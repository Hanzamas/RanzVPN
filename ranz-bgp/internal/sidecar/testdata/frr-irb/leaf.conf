! The leaf of the fabric of TestFRRIRB (frr_irb_test.go; SDN-67 #294), AS 65020, whose VTEP is 172.31.27.10 (irb.sh). Its VRFs
! red and blue route with symmetric IRB, each on its own L3 VNI, route distinguisher and route target, and each has the same
! stretched Network on an L2 VNI of its own, 5020 in red and 5021 in blue, with the route target of the stretch of the gateway
! for it. It carries the L2 VNI 5030 too, the Network of a stretch without irb. It advertises the MAC and IP addresses of its
! hosts as EVPN routes of type 2, with the L3 VNI and the router MAC of their VRF, and its VTEP as routes of type 3; it
! advertises no prefix of its own. The gateway is AS 65001 on 172.31.27.1, where its sidecar listens on port 1179, so FRR dials
! it.
frr defaults datacenter
hostname irb-leaf
log file /tmp/frr.log informational
!
vrf red
 vni 10201
exit-vrf
!
vrf blue
 vni 10202
exit-vrf
!
router bgp 65020
 bgp router-id 192.0.2.20
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 172.31.27.1 remote-as 65001
 neighbor 172.31.27.1 port 1179
 neighbor 172.31.27.1 timers connect 2
 !
 address-family l2vpn evpn
  neighbor 172.31.27.1 activate
  advertise-all-vni
  vni 5020
   rd 192.0.2.20:5020
   route-target import 65000:5020
   route-target export 65000:5020
  exit-vni
  vni 5021
   rd 192.0.2.20:5021
   route-target import 65000:5021
   route-target export 65000:5021
  exit-vni
  vni 5030
   rd 192.0.2.20:5030
   route-target import 65000:5030
   route-target export 65000:5030
  exit-vni
 exit-address-family
exit
!
router bgp 65020 vrf red
 bgp router-id 192.0.2.20
 no bgp ebgp-requires-policy
 !
 address-family l2vpn evpn
  rd 192.0.2.20:1
  route-target import 65000:10201
  route-target export 65000:10201
 exit-address-family
exit
!
router bgp 65020 vrf blue
 bgp router-id 192.0.2.20
 no bgp ebgp-requires-policy
 !
 address-family l2vpn evpn
  rd 192.0.2.20:2
  route-target import 65000:10202
  route-target export 65000:10202
 exit-address-family
exit
!
