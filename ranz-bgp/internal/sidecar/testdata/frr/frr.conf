! The fabric of TestFRREVPN (frr_test.go; SDN-25 #201): one leaf of a data-centre fabric, AS 65010, whose VTEP is
! 172.31.25.10 (fabric.sh). Its VRFs red and blue hand the same LAN 172.16.1.0/24 to the gateway as IP prefix routes,
! EVPN route type 5, each on its own L3 VNI, route distinguisher and route target, and red its fd16::/64 too. The
! gateway is AS 65001 on 172.31.25.1, where its sidecar listens on port 1179, so FRR dials it.
frr defaults datacenter
hostname fabric
log file /tmp/frr.log informational
!
vrf red
 vni 10101
exit-vrf
!
vrf blue
 vni 10102
exit-vrf
!
router bgp 65010
 bgp router-id 192.0.2.10
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 172.31.25.1 remote-as 65001
 neighbor 172.31.25.1 port 1179
 neighbor 172.31.25.1 timers connect 2
 !
 address-family l2vpn evpn
  neighbor 172.31.25.1 activate
  advertise-all-vni
 exit-address-family
exit
!
router bgp 65010 vrf red
 bgp router-id 192.0.2.10
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  network 172.16.1.0/24
 exit-address-family
 !
 address-family ipv6 unicast
  network fd16::/64
 exit-address-family
 !
 address-family l2vpn evpn
  rd 192.0.2.10:1
  route-target import 65000:10101
  route-target export 65000:10101
  advertise ipv4 unicast
  advertise ipv6 unicast
 exit-address-family
exit
!
router bgp 65010 vrf blue
 bgp router-id 192.0.2.10
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  network 172.16.1.0/24
 exit-address-family
 !
 address-family l2vpn evpn
  rd 192.0.2.10:2
  route-target import 65000:10102
  route-target export 65000:10102
  advertise ipv4 unicast
 exit-address-family
exit
!
