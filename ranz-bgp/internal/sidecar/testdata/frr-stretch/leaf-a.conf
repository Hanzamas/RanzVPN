! Leaf a of the fabric of TestFRRStretch (frr_stretch_test.go; SDN-64 #291), AS 65010, whose VTEP is 172.31.26.10
! (stretch.sh). It carries the L2 VNI 5010 of the stretched Network with the route target 65000:5010 of the gateway, and
! advertises the MAC address of its host and its own VTEP as EVPN routes of type 2 and 3. The gateway is AS 65001 on
! 172.31.26.1, where its sidecar listens on port 1179, so FRR dials it.
frr defaults datacenter
hostname leaf-a
log file /tmp/frr.log informational
!
router bgp 65010
 bgp router-id 192.0.2.10
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 172.31.26.1 remote-as 65001
 neighbor 172.31.26.1 port 1179
 neighbor 172.31.26.1 timers connect 2
 !
 address-family l2vpn evpn
  neighbor 172.31.26.1 activate
  advertise-all-vni
  vni 5010
   rd 192.0.2.10:5010
   route-target import 65000:5010
   route-target export 65000:5010
  exit-vni
 exit-address-family
exit
!
