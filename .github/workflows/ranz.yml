# The Go programs of Ranz: one module and one executable, ranz (ONE-1 #310, ADR-0011 amendment of
# 2026-10-22). The controller with its web UI (controller/, SDN-2 #178), the BGP sidecar of ADR-0010
# (ranz-bgp/, CORE-S7-1 #82), the mimicry sidecar of ADR-0023 (controller/internal/mimic, CORE-P2-1
# #85) and the CLI are all in controller/cmd/ranz: the subcommands controller, bgp and mimic, and the
# verbs of the controller's API. ranz-nodesim, ranz-noisepeer and ranz-wgpeer (controller/cmd)
# are test tools: this workflow builds them and never ships them. The control protocol schema
# (proto/) belongs here too.
#
# linux: generates the Go code of proto/ranz/control/v1/control.proto with the pinned protoc and
# protoc-gen-go, tidies go.mod and go.sum and runs gofmt; then vets (for Linux and for Windows),
# builds every package and ranz for Linux x64, Windows x64 and Windows arm64 as it ships, records
# the size of each, runs the Linux executable for its contract (one version for every subcommand,
# the subcommands, the NOTICE with the licences of GoBGP and rqlite), and tests the module, with
# rqlited of the pinned rqlite release for the controller conformance tests and the cluster tests of
# SDN-17 (three controller processes, each with its rqlited, on the runner:
# controller/cluster_test.go), and the session of the BGP sidecar against GoBGP routers over an
# in-memory pipe. The controller tests write every control message they sent or received to a
# directory, and the nanopb code generated from the same schema decodes each one and encodes it back
# to the same bytes (tests/control/nanopb_roundtrip.c). Then the job fails, and prints the diff, if
# generation, tidy or gofmt changed a committed file. Last come the quality gates of ADR-0040 for
# the module: the tests run with -race (item 4) and -coverprofile, and each package must stay at or
# above its coverage floor (item 2, .github/quality/coverage-floors.txt); the fuzz tests of
# .github/quality/fuzz-targets.txt run with go test -fuzz for a short time each (item 1); and
# staticcheck and govulncheck, for Linux and for Windows, must find nothing (item 3).
#
# windows: vets, builds and tests the module on Windows x64 and arm64. On x64 that includes the
# controller (the cluster tests, its keys in the Microsoft Software Key Storage Provider) and ranz
# controller as a Windows service on TCP 443 (and plain HTTP for the redirect) with its own rqlite
# member as its sidecar: install, start, stop, reset-admin and uninstall, driven with ranz and
# ranz-nodesim (.github/scripts/controller-service.ps1). The rqlite member of a Controller is a
# Payload of ranz (ONE-4, #313; ADR-0026 amendment of 2026-10-23): each Windows job signs the
# rqlited.exe of the pinned release with a self-signed certificate that it trusts and embeds it
# over the placeholder of controller/internal/payload before it builds, so the x64 job's cluster
# tests, its ranz.exe and its service run with members that ranz writes out under the data
# directory itself, with no rqlited beside it, also again after a deletion. The cluster tests run
# the executable ranz as each member: they build it from the checkout with the vendor key of the
# tests linked in, as a release links its own (controller/cluster_test.go). rqlite publishes no
# Windows build for arm64: the member of ranz for arm64 is the x64 rqlited.exe, which Windows 11 on
# ARM runs under emulation, and the arm64 job writes it out and starts it (TestRqlitedMemberRuns).
# On both architectures the job runs the sidecar on the named pipe of the node, among them the
# process mitigations and the System32-only DLL search of ranz read from outside its process
# (ADR-0039, SEC-1 #279), runs the executable for its contract, and checks its flags
# (.github/scripts/binary-hardening.ps1). The NOTICE holds the licence text of the pinned rqlite tag
# word for word (TestNoticeHasTheRqliteLicence of controller/cmd/ranz), and each rqlite archive
# that a job downloads has the SHA-256 of the pinned release.
#
# The three tools that succeed the vpncmd tools (SDN-53, #246) run as processes in both jobs, read
# from outside: ranz doctor passes its six checks; ranz test throughput runs the test server and the
# test client as two processes of the runner, which stand in for two nodes, and reports a rate; ranz
# cert makes a CA and certificates that it signs. On Linux OpenSSL, an implementation of its own,
# takes those certificates as a listener and as a trust store would. On Windows the certificates have
# their keys in the Microsoft Software Key Storage Provider and their certificates in the My store,
# and Schannel and the chain engine of Windows take them (.github/scripts/ranz-tools.ps1).
#
# The spike with the node (BGP on TCP 179, a prefix announced and withdrawn, a learned route
# installed through IP Helper, the node starting ranz bgp) needs the C build and runs in
# windows.yml (.github/scripts/bgp-spike.ps1).
#
# evpn-frr: the EVPN of a gateway (SDN-25 #201) against FRR, the reference BGP speaker of a
# data-centre fabric, in a container of its own on this runner: EVPN type-5 both ways between the
# sidecar and FRR, and VXLAN both ways between the gateway and the VRFs of the kernel of FRR
# (TestFRREVPN of ranz-bgp/internal/sidecar).
#
# scale: the scale test of SDN-18 (#194, ADR-0026 decision 7, ADR-0040 item 5). One controller serves simulated nodes
# (internal/nodesim) in VRFs that advertise routes, and the run measures how long each node takes to acknowledge a change, from
# the apply that makes it, by percentile (TestScale of internal/controller). The fast set of a pull request runs a tenth of the
# target, 1,000 nodes, 100 VRFs and 10,000 routes; the full set runs that and the target, 10,000 nodes, 1,000 VRFs and 100,000
# routes. Each run writes its report, a summary table and BENCH lines; the performance gate (.github/scripts/bench-gate.py) compares
# them with the medians recorded in .github/quality/scale-pr.txt and scale-full.txt, the job summary shows the table, and the
# artifact ranz-scale-<size> keeps the report of each run, so a regression is visible.
#
# No job here touches the C build, so they run beside windows.yml and add nothing to its time.
#
# Two sets of jobs, which the plan job chooses (ci-plan.yml, .github/scripts/ci-plan.py; windows.yml
# says when each runs). A pull request runs linux, evpn-frr, scale (at a tenth of the target) and windows for x64. The full set
# also runs windows for arm64, which a pull request does not create, since GitHub cannot skip one leg of a matrix, and scale at
# the target as well: it runs on a push to master or integration, every night, on workflow_dispatch, and on a pull request
# with the label full-ci or with a sensitive path of ci-plan.py.
#
# A push to master or integration, a scheduled run and a run by hand run every job, with no path
# filter. A pull request runs them when it changes a path that they read: controller/ and
# ranz-bgp/, the two trees of the module; go.mod and go.sum; proto/, the schema that go generate
# and the nanopb round trip read; tests/control/, the round trip program; tests/explain/, the
# scenarios of the explain conformance that the tests of the controller read; docs/clients.md, the
# clients guide that a test of controller/cmd/ranz keeps in step with the product (SDN-82, #377);
# .gitattributes, which sets the line endings of the checkout; this file, the plan (ci-plan.yml and
# ci-plan.py),
# .github/scripts/controller-service.ps1 with the .github/scripts/controller-hostfiles.ps1 that it
# runs, .github/scripts/ranz-tools.ps1, the binary hardening gate
# .github/scripts/binary-hardening.ps1, which windows.yml runs too, the fuzz targets, coverage
# floors, accepted vulnerabilities and recorded scale medians of .github/quality and the scripts that read them. A pull
# request that changes none of them (a C change under src/, or docs only) does not run this
# workflow.

name: ranz

on:
  push:
    branches: [master, integration]
  schedule:
  - cron: '23 20 * * *'
  workflow_dispatch:
  pull_request:
    # labeled: the label full-ci starts the full set on a pull request that is open
    types: [opened, synchronize, reopened, labeled]
    paths:
    - 'controller/**'
    - 'ranz-bgp/**'
    - 'go.mod'
    - 'go.sum'
    - 'proto/**'
    - 'tests/control/**'
    - 'tests/explain/**'
    - '.gitattributes'
    - 'docs/clients.md'
    - '.github/workflows/ranz.yml'
    - '.github/workflows/ci-plan.yml'
    - '.github/scripts/ci-plan.py'
    - '.github/scripts/controller-service.ps1'
    - '.github/scripts/controller-hostfiles.ps1'
    - '.github/scripts/ranz-tools.ps1'
    - '.github/quality/fuzz-targets.txt'
    - '.github/quality/coverage-floors.txt'
    - '.github/quality/govulncheck-accepted.txt'
    - '.github/quality/scale-*.txt'
    - '.github/scripts/fuzz-registry.py'
    - '.github/scripts/coverage-floor.py'
    - '.github/scripts/bench-gate.py'
    - '.github/scripts/govulncheck-gate.py'
    - '.github/scripts/binary-hardening.ps1'
    - '.github/scripts/fetch-wintun.ps1'
    - '.github/scripts/fetch-xdp.ps1'
    - '.github/scripts/fetch-wireguard.ps1'
    - 'src/bin/hamcore/legal.txt'
    - 'src/bin/hamcore/DriverPackages/**'

# A run that is not a pull request is the full set, and its name says so: Full CI: push on integration
run-name: "${{ github.event_name == 'pull_request' && github.event.pull_request.title || format('Full CI: {0} on {1}', github.event_name, github.ref_name) }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'
  PROTOC_VERSION: '36.2'
  PROTOC_GEN_GO_VERSION: 'v1.36.12'
  # The Python protobuf runtime of the nanopb generator, the one of the protoc release above
  PROTOBUF_PY_VERSION: '7.36.2'
  NANOPB_VERSION: '0.4.9.2'
  RQLITE_VERSION: 'v10.5.3'
  # The SHA-256 of the release archives of RQLITE_VERSION that the jobs download, the digests that
  # GitHub holds for the assets of the release (ONE-4, #313). A new version changes the pin, these
  # digests, windows.yml and the NOTICE together.
  RQLITE_LINUX_AMD64_SHA256: '93dc04417d9d233e79eb359e325793b1f92daa84ec93694953f4bff6307fda2b'
  RQLITE_WIN64_SHA256: '0f4a65a603b89b9a3c2607c5de64445236856884c83aa2e865ec9142fd184118'
  # The releases of the drivers that ranz carries as Payloads (ONE-3, #312), pinned by their fetch
  # scripts (.github/scripts/fetch-wintun.ps1, fetch-xdp.ps1), which a step below checks against these:
  # the jobs download the licence of each pinned tag for the NOTICE tests
  WINTUN_VERSION: '0.14.1'
  XDP_VERSION: '1.4.0'
  # The Go static analysis of ADR-0040 item 3: staticcheck 2026.2.2 and govulncheck
  STATICCHECK_VERSION: 'v0.8.2'
  GOVULNCHECK_VERSION: 'v1.9.0'

jobs:
  # The fast set or the full set (ci-plan.yml); windows reads the legs of its matrix from it
  plan:
    uses: ./.github/workflows/ci-plan.yml
    permissions:
      contents: read
      pull-requests: read

  linux:
    name: ranz (Linux)
    runs-on: ubuntu-24.04
    # The tests with the race detector take about 4 minutes (the tests of controller/internal/controller share an rqlited,
    # CI-SPEED-1 #547; about 10 minutes before), and the fuzz step runs each target of fuzz-targets.txt for 20 s,
    # one after the other, about 14 minutes now: a job of 25 minutes was cancelled in its static analysis, the last step,
    # with every step before it done
    # TEMPORARY (CI-FLAKE-8, #610): 75 minutes for the stress step at the end, 40 again in the last commit of this pull request
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: go.sum
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install protoc, protoc-gen-go, rqlited and the nanopb generator
      run: |
        curl -fsSL -o "$RUNNER_TEMP/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
        unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
        echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
        GOBIN="$RUNNER_TEMP/gobin" go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
        echo "$RUNNER_TEMP/gobin" >> "$GITHUB_PATH"

        curl -fsSL -o "$RUNNER_TEMP/rqlite.tar.gz" "https://github.com/rqlite/rqlite/releases/download/${RQLITE_VERSION}/rqlite-${RQLITE_VERSION}-linux-amd64.tar.gz"
        echo "${RQLITE_LINUX_AMD64_SHA256}  $RUNNER_TEMP/rqlite.tar.gz" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/rqlite"
        tar -xzf "$RUNNER_TEMP/rqlite.tar.gz" -C "$RUNNER_TEMP/rqlite"
        rqlited="$(find "$RUNNER_TEMP/rqlite" -name rqlited -type f | head -n 1)"
        test -n "$rqlited"
        "$rqlited" -version
        echo "RQLITED=$rqlited" >> "$GITHUB_ENV"

        python -m pip install --disable-pip-version-check "protobuf==${PROTOBUF_PY_VERSION}"
        git clone --quiet --depth 1 --branch "nanopb-${NANOPB_VERSION}" https://github.com/nanopb/nanopb "$RUNNER_TEMP/nanopb"

        # Built for the runner; GOOS of the step that runs them picks the platform they analyze
        GOBIN="$RUNNER_TEMP/gobin" go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
        GOBIN="$RUNNER_TEMP/gobin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
    - name: Generate, tidy and format
      run: |
        protoc --version
        go generate ./controller/internal/controlpb
        go mod tidy
        gofmt -l -w controller ranz-bgp
    - name: Vet
      run: |
        go vet ./...
        GOOS=windows go vet ./...
    # ranz as it ships (ONE-1): -trimpath and -ldflags "-s -w" strip the paths and the symbol table
    # (SEC-3 #281, ADR-0036 amendment of 2026-10-22; checked by .github/scripts/self-integrity.ps1),
    # and the run number is the build number of its one version. The test tools are built by
    # go build ./..., not shipped.
    - name: Build
      run: |
        go build ./...
        ldflags="-s -w -X main.build=${GITHUB_RUN_NUMBER}"
        GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o "$RUNNER_TEMP/linux-x64/ranz" ./controller/cmd/ranz
        GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o "$RUNNER_TEMP/windows-x64/ranz.exe" ./controller/cmd/ranz
        GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "$ldflags" -o "$RUNNER_TEMP/windows-arm64/ranz.exe" ./controller/cmd/ranz
        ls -l "$RUNNER_TEMP/linux-x64" "$RUNNER_TEMP/windows-x64" "$RUNNER_TEMP/windows-arm64"
    # ONE-1 records the size of the one file, which carries the controller, GoBGP and the CLI: in the
    # job log, in the job summary and in the artifact ranz-size
    - name: Size of ranz
      run: |
        size="$RUNNER_TEMP/ranz-size.md"
        {
          echo '### Size of ranz, the one executable'
          echo
          echo '| Platform | Bytes |'
          echo '|---|---:|'
          echo "| linux-x64 | $(stat -c %s "$RUNNER_TEMP/linux-x64/ranz") |"
          echo "| windows-x64 | $(stat -c %s "$RUNNER_TEMP/windows-x64/ranz.exe") |"
          echo "| windows-arm64 | $(stat -c %s "$RUNNER_TEMP/windows-arm64/ranz.exe") |"
        } > "$size"
        cat "$size"
        cat "$size" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v4
      with:
        name: ranz-size
        retention-days: 14
        path: ${{ runner.temp }}/ranz-size.md
    # The contract of the one executable, read from outside (ONE-1): ranz version prints one line
    # with the one version, in every spelling, and the run number as its build number; ranz bgp,
    # ranz controller and the CLI answer as their subcommands do; ranz notice prints the NOTICE that
    # is committed, which holds the licences of GoBGP and of rqlite
    - name: The executable
      run: |
        ranz="$RUNNER_TEMP/linux-x64/ranz"
        version="$("$ranz" version)"
        echo "$version"
        echo "$version" | grep -Eq "^ranz [0-9]+\.[0-9]+\.${GITHUB_RUN_NUMBER}\$"
        test "$("$ranz" -version)" = "$version"
        test "$("$ranz" --version)" = "$version"

        code=0
        "$ranz" bgp 2> "$RUNNER_TEMP/bgp.err" || code=$?
        cat "$RUNNER_TEMP/bgp.err"
        test "$code" = 2
        grep -q 'ranz bgp: -pipe is required' "$RUNNER_TEMP/bgp.err"

        "$ranz" controller -h 2> "$RUNNER_TEMP/controller.err"
        grep -q 'Usage of ranz controller' "$RUNNER_TEMP/controller.err"

        code=0
        "$ranz" 2> "$RUNNER_TEMP/cli.err" || code=$?
        cat "$RUNNER_TEMP/cli.err"
        test "$code" = 2
        grep -q '^usage:' "$RUNNER_TEMP/cli.err"

        "$ranz" notice > "$RUNNER_TEMP/NOTICE"
        grep -q 'GoBGP' "$RUNNER_TEMP/NOTICE"
        grep -q 'Apache License' "$RUNNER_TEMP/NOTICE"
        grep -q 'rqlite' "$RUNNER_TEMP/NOTICE"
        grep -q 'The MIT License (MIT)' "$RUNNER_TEMP/NOTICE"
        cmp "$RUNNER_TEMP/NOTICE" controller/cmd/ranz/NOTICE
    # The mimicry sidecar (CORE-P2-1, #85) as a subcommand of the executable, read from outside: without
    # -pipe it says so and exits with 2, -keygen prints the key pair of a server (each key 64 hex digits),
    # and the NOTICE holds the licences of the libraries that the sidecar carries (REALITY, uTLS and the
    # library of REALITY under the LGPL), which TestNoticeHasTheLicencesOfTheMimicryLibraries compares
    # with the files of the modules
    - name: The mimicry sidecar as a subcommand
      run: |
        ranz="$RUNNER_TEMP/linux-x64/ranz"
        code=0
        "$ranz" mimic 2> "$RUNNER_TEMP/mimic.err" || code=$?
        cat "$RUNNER_TEMP/mimic.err"
        test "$code" = 2
        grep -q 'ranz mimic: -pipe is required' "$RUNNER_TEMP/mimic.err"

        "$ranz" mimic -keygen > "$RUNNER_TEMP/mimic.keys"
        grep -Eq '^private_key [0-9a-f]{64}$' "$RUNNER_TEMP/mimic.keys"
        grep -Eq '^public_key [0-9a-f]{64}$' "$RUNNER_TEMP/mimic.keys"

        "$ranz" notice > "$RUNNER_TEMP/NOTICE-mimic"
        grep -q 'Mozilla Public License Version 2.0' "$RUNNER_TEMP/NOTICE-mimic"
        grep -q 'Copyright (c) 2009 The Go Authors' "$RUNNER_TEMP/NOTICE-mimic"
        grep -q 'github.com/juju/ratelimit' "$RUNNER_TEMP/NOTICE-mimic"
    # The rqlite version stays pinned (ONE-4, #313): RQLITE_VERSION here and in windows.yml, which
    # downloads the same release for the default VRF tracer, and the NOTICE names that version. The
    # LICENSE of the pinned tag is downloaded for TestNoticeHasTheRqliteLicence, which compares it
    # with the NOTICE word for word, so a new version fails until the NOTICE follows it.
    - name: The rqlite pin and the licence of its tag
      run: |
        grep -Fq "RQLITE_VERSION: '${RQLITE_VERSION}'" .github/workflows/windows.yml
        grep -Fq "the rqlite release ${RQLITE_VERSION}," controller/cmd/ranz/NOTICE
        grep -Fq "rqlite/blob/${RQLITE_VERSION}/go.mod" controller/cmd/ranz/NOTICE
        curl -fsSL -o "$RUNNER_TEMP/rqlite-LICENSE" "https://raw.githubusercontent.com/rqlite/rqlite/${RQLITE_VERSION}/LICENSE"
        echo "RQLITE_LICENSE=$RUNNER_TEMP/rqlite-LICENSE" >> "$GITHUB_ENV"
    # The pins of the Wintun DLL and of the XDP runtime (ONE-3, #312): the versions here, in the fetch
    # scripts that windows.yml runs and in the NOTICE (TestNoticeNamesThePinnedPayloads) are one. The
    # licence of each pinned tag is downloaded for TestNoticeHasTheWintunLicence and
    # TestNoticeHasTheXDPLicence, which compare it with the NOTICE word for word, so a new version
    # fails until the NOTICE follows it.
    - name: The pins and the licences of the Wintun and XDP releases
      run: |
        grep -Fq "[string] \$Version = '${WINTUN_VERSION}'" .github/scripts/fetch-wintun.ps1
        grep -Fq "[string] \$Version = '${XDP_VERSION}'" .github/scripts/fetch-xdp.ps1
        curl -fsSL -o "$RUNNER_TEMP/wintun-LICENSE" "https://raw.githubusercontent.com/WireGuard/wintun/${WINTUN_VERSION}/prebuilt-binaries-license.txt"
        curl -fsSL -o "$RUNNER_TEMP/xdp-LICENSE" "https://raw.githubusercontent.com/microsoft/xdp-for-windows/v${XDP_VERSION}/LICENSE"
        echo "WINTUN_LICENSE=$RUNNER_TEMP/wintun-LICENSE" >> "$GITHUB_ENV"
        echo "XDP_LICENSE=$RUNNER_TEMP/xdp-LICENSE" >> "$GITHUB_ENV"
    # The licences of libjuice and libplum, which ranz-node.exe links (CORE-S5-6, #412): the LICENSE of the commit that each
    # submodule pins, for TestNoticeHasTheLicencesOfLibjuiceAndLibplum, which compares it with the NOTICE word for word
    - name: The licences of libjuice and libplum
      run: |
        for lib in libjuice libplum; do
          commit="$(git rev-parse "HEAD:src/Core/3rdparty/$lib")"
          curl -fsSL -o "$RUNNER_TEMP/$lib-LICENSE" "https://raw.githubusercontent.com/paullouisageneau/$lib/$commit/LICENSE"
          echo "${lib^^}_LICENSE=$RUNNER_TEMP/$lib-LICENSE" >> "$GITHUB_ENV"
        done
    # The tools of SDN-53 (#246), read from outside. ranz cert makes a CA and the certificates that it
    # signs, and OpenSSL takes them: openssl verify builds their chain (the trust store), an openssl
    # s_server with a certificate (the listener) is accepted by an openssl s_client that trusts the CA
    # only, and one that asks for a client certificate takes the one that ranz cert made. ranz doctor
    # runs the six checks of the vpncmd Check command. ranz test throughput runs its server and its
    # client as two processes of the runner, which stand in for two nodes, and reports a rate.
    - name: The tools ranz cert, ranz doctor and ranz test throughput
      run: |
        ranz="$RUNNER_TEMP/linux-x64/ranz"
        tools="$RUNNER_TEMP/tools"
        mkdir -p "$tools"

        "$ranz" cert -ca -cn "Ranz CI CA" -savecert "$tools/ca.pem" -savekey "$tools/ca.key"
        "$ranz" cert -cn localhost -signcert "$tools/ca.pem" -signkey "$tools/ca.key" -savecert "$tools/server.pem" -savekey "$tools/server.key"
        "$ranz" cert -cn ranz-client -signcert "$tools/ca.pem" -signkey "$tools/ca.key" -savecert "$tools/client.pem" -savekey "$tools/client.key"
        "$ranz" cert -cn localhost -rsa 2048 -signcert "$tools/ca.pem" -signkey "$tools/ca.key" -savecert "$tools/rsa.pem" -savekey "$tools/rsa.key"
        "$ranz" cert -ca -cn "Another CA" -savecert "$tools/other-ca.pem" -savekey "$tools/other-ca.key"
        test "$(stat -c %a "$tools/server.key")" = 600

        # The trust store: the chain of each certificate to the CA, and not to another one
        openssl verify -CAfile "$tools/ca.pem" "$tools/server.pem" "$tools/client.pem" "$tools/rsa.pem"
        if openssl verify -CAfile "$tools/other-ca.pem" "$tools/server.pem"; then
          echo "::error::openssl verified a certificate of ranz cert against another CA"
          exit 1
        fi

        # The listener: an OpenSSL server with a certificate and its key takes one connection, and an
        # OpenSSL client with the arguments after the fourth tries it until the server is up
        try_tls() {
          port="$1"; cert="$2"; key="$3"; server_args="$4"; shift 4
          openssl s_server -accept "127.0.0.1:$port" -cert "$cert" -key "$key" $server_args -naccept 1 -quiet > "$tools/s_server-$port.out" 2>&1 &
          server=$!
          ok=1
          for i in $(seq 1 20); do
            if openssl s_client -connect "127.0.0.1:$port" "$@" -brief < /dev/null > "$tools/s_client-$port.out" 2>&1; then
              ok=0
              break
            fi
            sleep 0.5
          done
          cat "$tools/s_client-$port.out"
          kill "$server" 2> /dev/null || true
          wait "$server" 2> /dev/null || true
          return $ok
        }
        try_tls 19443 "$tools/server.pem" "$tools/server.key" "" -CAfile "$tools/ca.pem" -verify_return_error -verify_hostname localhost
        grep -q 'Verification: OK' "$tools/s_client-19443.out"
        try_tls 19444 "$tools/rsa.pem" "$tools/rsa.key" "" -CAfile "$tools/ca.pem" -verify_return_error -verify_hostname localhost
        grep -q 'Verification: OK' "$tools/s_client-19444.out"
        # The listener asks for a client certificate and takes the one of ranz cert. TLS 1.2 tells the
        # client at once if the server refused its certificate.
        try_tls 19445 "$tools/server.pem" "$tools/server.key" "-Verify 1 -verify_return_error -CAfile $tools/ca.pem -tls1_2" \
          -CAfile "$tools/ca.pem" -verify_return_error -verify_hostname localhost -cert "$tools/client.pem" -key "$tools/client.key" -tls1_2
        grep -q 'Verification: OK' "$tools/s_client-19445.out"

        "$ranz" doctor > "$tools/doctor.out"
        cat "$tools/doctor.out"
        for title in "Kernel System" "Memory Operation System" "ANSI / Unicode string processing system" "File system" "Thread processing system" "Network system"; do
          grep -q "Checking '$title'... Pass" "$tools/doctor.out"
        done
        grep -q 'All checks passed' "$tools/doctor.out"

        "$ranz" test throughput -listen 127.0.0.1:19821 > "$tools/throughput-server.out" 2>&1 &
        server=$!
        for i in $(seq 1 50); do
          grep -q 'serving on' "$tools/throughput-server.out" && break
          sleep 0.2
        done
        grep -q 'serving on' "$tools/throughput-server.out"
        "$ranz" test throughput -connections 8 -span 3s 127.0.0.1:19821 > "$tools/throughput.out"
        cat "$tools/throughput.out"
        for row in Download Upload Total; do
          grep -Eq "^ +$row +[0-9]+ +[0-9,]+ bytes +[0-9.]+ [KMGT]?bps" "$tools/throughput.out"
        done
        "$ranz" test throughput -json -type upload -connections 2 -span 1s 127.0.0.1:19821 > "$tools/throughput.json"
        python -c 'import json, sys; r = json.load(open(sys.argv[1])); assert r["upload"]["connections"] == 2 and r["upload"]["bytes"] > 0 and r["upload"]["bps"] > 0 and r["download"]["connections"] == 0, r' "$tools/throughput.json"
        kill -TERM "$server"
        wait "$server"
        cat "$tools/throughput-server.out"
    # -race is the race detection of ADR-0040 item 4 for the Go code; the profile is read by the
    # coverage floor step. -timeout 20m (CI-SLOW-1 #552, CI-SPEED-1 #547): go test applies the limit to
    # each package alone, and stops a package after 10 minutes unless told otherwise. The tests of
    # controller/internal/controller take an empty database of an rqlited that they share, and run in
    # parallel (rqlitetest.Fresh): the package takes about 140 s here under -race, where it took about
    # 550 s with an rqlited for each test. The slowest package is controller, with its cluster tests,
    # about 135 s to 150 s. The limit stays 20 minutes, more than four times the time of any package: it
    # costs nothing, and a runner can be slow. A hang still ends the package, only later.
    - name: Test
      env:
        RANZ_CONTROL_WIRE: ${{ runner.temp }}/wire
      run: go test -race -count=1 -timeout 20m -coverprofile="$RUNNER_TEMP/cover.out" ./...
    # The Hanzcodes activation service and the install side (internal/activation, SEC-7 #284 and
    # SEC-6 #285), in the job log: the service issues a node-locked, time-limited token and refuses
    # an invalid or node-mismatched request, releases the Enterprise feature key only against an
    # Enterprise token, re-validates on a heartbeat and serves the revocation list through a software
    # KSP that stands in for the HSM, and resolves to the Personal tier when no vendor signing key is
    # linked; the install activates against the service and unseals the Enterprise feature blob only
    # with the server-held key, holds its tier for the grace period past a missed heartbeat and
    # degrades to the Licence in force or Personal past it, and round-trips the offline activation
    # file with no network.
    - name: Activation service and the install, with the software KSP
      run: go test -count=1 -v ./controller/internal/activation
    - name: nanopb round trip of the control messages
      run: |
        out="$RUNNER_TEMP/nanopb-out"
        mkdir -p "$out"
        python "$RUNNER_TEMP/nanopb/generator/nanopb_generator.py" --error-on-unmatched -I proto -D "$out" ranz/control/v1/control.proto
        nanopb="$RUNNER_TEMP/nanopb"
        # PB_FIELD_32BIT: an Update of control.options is larger than 64 kB (see there)
        cflags="-std=c17 -O2 -DPB_FIELD_32BIT -I $nanopb -I $out"
        gcc $cflags -Wall -Wextra -Werror -c tests/control/nanopb_roundtrip.c -o "$RUNNER_TEMP/nanopb_roundtrip.o"
        gcc $cflags -o "$RUNNER_TEMP/nanopb_roundtrip" "$RUNNER_TEMP/nanopb_roundtrip.o" \
          "$out/ranz/control/v1/control.pb.c" "$nanopb/pb_encode.c" "$nanopb/pb_decode.c" "$nanopb/pb_common.c"
        "$RUNNER_TEMP/nanopb_roundtrip" "$RUNNER_TEMP"/wire/*.bin
    - name: Committed files match generation, tidy and gofmt
      if: ${{ !cancelled() }}
      run: |
        git add -A -N go.mod go.sum controller ranz-bgp
        if ! git diff --exit-code -- go.mod go.sum controller ranz-bgp; then
          echo "::error::go.mod, go.sum, controller/ or ranz-bgp/ differs from what go generate, go mod tidy and gofmt make of it: commit the diff above"
          exit 1
        fi
    # ADR-0040 item 2: the statement coverage of each package against its floor
    - name: Coverage floor
      if: ${{ !cancelled() }}
      run: python .github/scripts/coverage-floor.py go --module . --profile "$RUNNER_TEMP/cover.out"
    # ADR-0040 item 1: every fuzz test of the module in .github/quality/fuzz-targets.txt, 20 s each. A
    # crashing input is saved under testdata/fuzz of its package and uploaded below.
    - name: Fuzz (go test -fuzz)
      if: ${{ !cancelled() }}
      run: |
        targets="$(python .github/scripts/fuzz-registry.py go-targets .)"
        test -n "$targets"
        failed=0
        while read -r package target; do
          echo "::group::$target ($package)"
          if ! go test -run '^$' -fuzz "^${target}\$" -fuzztime 20s "$package"; then
            echo "::error::$target of $package found a failing input (testdata/fuzz/$target of the package, in the artifact ranz-fuzz-inputs)"
            failed=1
          fi
          echo "::endgroup::"
        done <<< "$targets"
        exit $failed
    # ADR-0040 item 3: staticcheck (with the checks of controller/staticcheck.conf for controller/)
    # and govulncheck, for Linux and for Windows. Any staticcheck finding fails the job, and so does
    # a vulnerability that the code calls, unless .github/quality/govulncheck-accepted.txt accepts it
    # for that version. The two staticcheck runs are merged (-merge), so code that one platform alone
    # uses is not reported as unused.
    - name: Static analysis (staticcheck, govulncheck)
      if: ${{ !cancelled() }}
      run: |
        "$RUNNER_TEMP/gobin/staticcheck" -version
        "$RUNNER_TEMP/gobin/staticcheck" -f binary ./... > "$RUNNER_TEMP/staticcheck-linux.bin"
        GOOS=windows "$RUNNER_TEMP/gobin/staticcheck" -f binary ./... > "$RUNNER_TEMP/staticcheck-windows.bin"
        "$RUNNER_TEMP/gobin/staticcheck" -merge "$RUNNER_TEMP/staticcheck-linux.bin" "$RUNNER_TEMP/staticcheck-windows.bin"
        "$RUNNER_TEMP/gobin/govulncheck" -version
        "$RUNNER_TEMP/gobin/govulncheck" -format json ./... > "$RUNNER_TEMP/govulncheck-linux.json"
        GOOS=windows "$RUNNER_TEMP/gobin/govulncheck" -format json ./... > "$RUNNER_TEMP/govulncheck-windows.json"
        python .github/scripts/govulncheck-gate.py --accepted .github/quality/govulncheck-accepted.txt "$RUNNER_TEMP/govulncheck-linux.json" "$RUNNER_TEMP/govulncheck-windows.json"
    # TEMPORARY, removed in the last commit of this pull request (CI-FLAKE-8, #610): the tests that stop a simulated node and
    # start it again with other Capabilities, 50 runs in a row under -race, alone and then with two busy loops on every core of
    # the runner. The control runs the same tests under the same load without the line that waits for the Controller to list the
    # node as gone: it is meant to fail now and then, and it never fails the step; every other run fails it.
    - name: 'Stress, temporary (CI-FLAKE-8, #610)'
      if: ${{ !cancelled() }}
      timeout-minutes: 50
      run: |
        pkg=./controller/internal/controller
        dir=controller/internal/controller
        tests='^(TestPeeringNeedsTheCapability|TestLinkSwitchIsOneGeneration|TestStretchRefusals|TestCertificateReplacementReachesPinnedNodes)$'

        # stress <name> <runs> <limit> <tests>: the tests <runs> times in a row under -race, in at most <limit>. It says how many
        # runs of each passed and how many failed, and shows the first failure.
        stress() {
          local name=$1 runs=$2 limit=$3 pattern=$4 out="$RUNNER_TEMP/stress-$1.log" code=0 t
          go test -race -v -count="$runs" -timeout "$limit" -run "$pattern" "$pkg" > "$out" 2>&1 || code=$?
          for t in $(echo "$pattern" | tr -d '^()$' | tr '|' ' '); do
            echo "$name: $t passed $(grep -c "^--- PASS: $t " "$out") of $runs runs and failed $(grep -c "^--- FAIL: $t " "$out")"
          done
          if [ "$code" -ne 0 ]; then
            echo "$name: go test exited with code $code, and this is the first failure:"
            grep -m1 -A60 '^--- FAIL' "$out" || tail -n 60 "$out"
          fi
          return "$code"
        }

        busy=()
        trap 'kill "${busy[@]}" 2>/dev/null || true; git checkout -- "$dir"' EXIT

        stress alone 50 15m "$tests"

        # Two busy loops on every core of the runner, until the step ends
        for _ in $(seq $(($(nproc) * 2))); do
          (while :; do :; done) &
          busy+=("$!")
        done
        stress loaded 50 25m "$tests"

        # The control: the same tests under the same load without the line that waits for the Controller to list the node as
        # gone, which the tests did not have before this ticket
        sed -i -E '/^[[:space:]]*h\.waitNode\("gw-1", 1, false\)$/d' "$dir/peering_test.go" "$dir/stretch_test.go"
        sed -i -E '/^[[:space:]]*h\.waitNode\("db", 1, false\)$/d' "$dir/link_test.go"
        sed -i -E '/^[[:space:]]*certWait\(t, "the Controller to list branch-1 as gone", .*\)$/d' "$dir/certificate_test.go"
        git diff --stat
        stress control 50 20m "$tests" || true
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: ranz-fuzz-inputs
        if-no-files-found: ignore
        path: |
          controller/**/testdata/fuzz/
          ranz-bgp/**/testdata/fuzz/

  # The scale test of SDN-18 (#194, ADR-0026 decision 7, ADR-0040 item 5). TestScale runs the scenario of
  # controller/internal/nodesim/scale.go against one controller on an rqlited of its own, without the race detector, which would
  # change what it measures: the VRFs of the intent are declared, the simulated nodes enrol, the MTU of every VRF changes, and a
  # route changes, and at the end every node is at the generation that it acknowledged with the state of the intent. Every run of
  # the job measures a tenth of the target (pr: 1,000 nodes, 100 VRFs, 10,000 routes, the change of every VRF three times); the
  # full set measures the target as well (full: 10,000 nodes, 1,000 VRFs, 100,000 routes, the VRFs declared and changed in 5
  # applies each), after the tenth, so that the runs that record the medians of the target record those of the tenth too. The
  # test writes scale.json, scale-summary.md and the BENCH lines to RANZ_SCALE_OUT, a directory for each size; the gate compares
  # them with the recorded medians of the size, the summary goes to the job summary, and the artifact ranz-scale-<size> holds all
  # of it for 90 days. The time of a run is the time of the applies, which compile the whole intent: 15 seconds at the tenth,
  # 9 to 12 minutes at the target.
  scale:
    name: scale (Linux)
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: go.sum
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install rqlited
      timeout-minutes: 5
      run: |
        curl -fsSL -o "$RUNNER_TEMP/rqlite.tar.gz" "https://github.com/rqlite/rqlite/releases/download/${RQLITE_VERSION}/rqlite-${RQLITE_VERSION}-linux-amd64.tar.gz"
        echo "${RQLITE_LINUX_AMD64_SHA256}  $RUNNER_TEMP/rqlite.tar.gz" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/rqlite"
        tar -xzf "$RUNNER_TEMP/rqlite.tar.gz" -C "$RUNNER_TEMP/rqlite"
        rqlited="$(find "$RUNNER_TEMP/rqlite" -name rqlited -type f | head -n 1)"
        test -n "$rqlited"
        "$rqlited" -version
        echo "RQLITED=$rqlited" >> "$GITHUB_ENV"
    # The scenario without a controller: the intent that it declares is accepted by the rules of the intent and compiles to
    # the states that it promises, the Fleet waits for Acks, the report has its formats
    - name: The scenario without a controller
      timeout-minutes: 10
      run: go test -count=1 -v ./controller/internal/nodesim
    - name: The scale scenario at a tenth of the target
      timeout-minutes: 30
      env:
        RANZ_SCALE: pr
        RANZ_SCALE_OUT: ${{ github.workspace }}/scale-out/pr
      run: go test -count=1 -v -timeout 25m -run '^TestScale$' ./controller/internal/controller
    # ADR-0040 item 5: every BENCH case of the run against the median recorded for its size, in .github/quality/scale-pr.txt
    # and scale-full.txt (bench-gate.py record makes them from the files of earlier runs); the best of the runs of each case
    # counts, and one that is slower than its median by more than its margin fails the job
    - name: Performance regression gate at a tenth of the target
      timeout-minutes: 5
      env:
        RANZ_SCALE_OUT: ${{ github.workspace }}/scale-out/pr
      run: python .github/scripts/bench-gate.py compare --medians .github/quality/scale-pr.txt "${RANZ_SCALE_OUT}/scale-bench*.txt"
    # The target runs when the tenth failed too: a failure at one size and not at the other says what kind of failure it is
    - name: The scale scenario at the target
      id: scale-full
      if: ${{ !cancelled() && needs.plan.outputs.full == 'true' }}
      timeout-minutes: 75
      env:
        RANZ_SCALE: full
        RANZ_SCALE_OUT: ${{ github.workspace }}/scale-out/full
      run: go test -count=1 -v -timeout 70m -run '^TestScale$' ./controller/internal/controller
    - name: Performance regression gate at the target
      if: ${{ !cancelled() && steps.scale-full.outcome == 'success' }}
      timeout-minutes: 5
      env:
        RANZ_SCALE_OUT: ${{ github.workspace }}/scale-out/full
      run: python .github/scripts/bench-gate.py compare --medians .github/quality/scale-full.txt "${RANZ_SCALE_OUT}/scale-bench*.txt"
    - name: Summary
      if: ${{ !cancelled() }}
      timeout-minutes: 2
      run: |
        for size in pr full; do
          if [ -f "scale-out/$size/scale-summary.md" ]; then
            cat "scale-out/$size/scale-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
        done
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: ranz-scale-pr
        retention-days: 90
        if-no-files-found: ignore
        path: ${{ github.workspace }}/scale-out/pr
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && needs.plan.outputs.full == 'true' }}
      with:
        name: ranz-scale-full
        retention-days: 90
        if-no-files-found: ignore
        path: ${{ github.workspace }}/scale-out/full

  windows:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        # x64 on a pull request, x64 and arm64 in the full set (MATRICES in ci-plan.py)
        platform: ${{ fromJSON(needs.plan.outputs.ranz_windows_matrix) }}
    name: ranz (Windows ${{ matrix.platform.ARCHITECTURE }})
    runs-on: ${{ matrix.platform.RUNNER }}
    timeout-minutes: 40
    env:
      # The Go code builds without cgo; the gcc of the arm64 runner builds x64 code only
      CGO_ENABLED: '0'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: go.sum
    # rqlite publishes a Windows build for x64 only: on the arm64 runner this is the x64 rqlited.exe,
    # which Windows 11 on ARM runs under emulation, and which is the member of ranz for arm64
    - name: Install rqlited
      shell: pwsh
      run: |
        $zip = Join-Path $env:RUNNER_TEMP 'rqlite.zip'
        $dir = Join-Path $env:RUNNER_TEMP 'rqlite'
        Invoke-WebRequest -Uri "https://github.com/rqlite/rqlite/releases/download/$env:RQLITE_VERSION/rqlite-$env:RQLITE_VERSION-win64.zip" -OutFile $zip
        # The LICENSE of the pinned tag, for TestNoticeHasTheRqliteLicence
        $licence = Join-Path $env:RUNNER_TEMP 'rqlite-LICENSE'
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/rqlite/rqlite/$env:RQLITE_VERSION/LICENSE" -OutFile $licence
        "RQLITE_LICENSE=$licence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        # The licences of the pinned Wintun and XDP releases, for TestNoticeHasTheWintunLicence and
        # TestNoticeHasTheXDPLicence (ONE-3, #312)
        $wintun = Join-Path $env:RUNNER_TEMP 'wintun-LICENSE'
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/WireGuard/wintun/$env:WINTUN_VERSION/prebuilt-binaries-license.txt" -OutFile $wintun
        "WINTUN_LICENSE=$wintun" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        $xdp = Join-Path $env:RUNNER_TEMP 'xdp-LICENSE'
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/microsoft/xdp-for-windows/v$env:XDP_VERSION/LICENSE" -OutFile $xdp
        "XDP_LICENSE=$xdp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        # The licences of libjuice and libplum at the commits that their submodules pin, for
        # TestNoticeHasTheLicencesOfLibjuiceAndLibplum (CORE-S5-6, #412)
        foreach ($lib in 'libjuice', 'libplum') {
          $commit = git rev-parse "HEAD:src/Core/3rdparty/$lib"
          if ($LASTEXITCODE -ne 0) { throw "git rev-parse HEAD:src/Core/3rdparty/$lib exited with code $LASTEXITCODE" }
          $file = Join-Path $env:RUNNER_TEMP "$lib-LICENSE"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/paullouisageneau/$lib/$commit/LICENSE" -OutFile $file
          "$($lib.ToUpper())_LICENSE=$file" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }
        $sum = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
        if ($sum -ne $env:RQLITE_WIN64_SHA256) { throw "rqlite-$env:RQLITE_VERSION-win64.zip has the SHA-256 $sum, not the pinned $env:RQLITE_WIN64_SHA256" }
        Expand-Archive -Path $zip -DestinationPath $dir
        $exe = Get-ChildItem -Path $dir -Recurse -Filter 'rqlited.exe' | Select-Object -First 1
        if (-not $exe) { throw 'rqlited.exe is not in the rqlite release archive' }
        & $exe.FullName -version
        "RQLITED=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    # The rqlite member of a Controller is a Payload of ranz (ONE-4, #313; ADR-0026 amendment of
    # 2026-10-23). ranz controller writes it out under its data directory only after it checked the
    # SHA-256 and the Authenticode signature of the copy it carries (controller/internal/payload),
    # and the rqlited.exe of the release has no signature. So this step signs a copy of it with a
    # self-signed code-signing certificate that it makes and trusts on this runner, as
    # .github/scripts/self-integrity.ps1 does for the executables of the C build (the certificate of
    # the release signs the Payload at release, as it signs ranz-node.exe), and writes it over the
    # placeholder of controller/internal/payload, so that every build of the steps below carries it:
    # the cluster tests run members, each a ranz that they build, that write their own rqlited from
    # it, ranz.exe carries it as it ships, and the service check runs with no rqlited beside
    # ranz.exe. RQLITED stays for the tests that start an rqlite of their own (rqlitetest), and
    # RQLITED_SIGNED is the signed file, which the service check compares what the controller writes
    # out with. On the arm64 runner the member is the x64 rqlited.exe (rqlited_arm64.exe is its
    # placeholder).
    - name: Sign the rqlite member and embed it as the Payload
      shell: pwsh
      run: |
        $embed = (Resolve-Path controller\internal\payload\rqlited_${{ matrix.platform.GOARCH }}.exe).Path
        $work = Join-Path $env:RUNNER_TEMP 'rqlited-payload'
        New-Item -ItemType Directory -Force -Path $work | Out-Null
        $signed = Join-Path $work 'rqlited.exe'
        Copy-Item -LiteralPath $env:RQLITED -Destination $signed -Force
        $cert = New-SelfSignedCertificate -Type CodeSigningCert `
          -Subject 'CN=Ranz VPN CI signing (rqlite member, self-signed), O=Hanzcodes' `
          -CertStoreLocation Cert:\CurrentUser\My `
          -KeyExportPolicy Exportable -KeyUsage DigitalSignature `
          -NotAfter (Get-Date).AddYears(1)
        $cer = Join-Path $work 'ranz-ci-rqlite.cer'
        Export-Certificate -Cert $cert -FilePath $cer | Out-Null
        # The root store only: the signature of a file chains to a trusted root, and nothing here asks
        # for a trusted publisher (the arm64 runner refuses that store to its user)
        Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
        $result = Set-AuthenticodeSignature -FilePath $signed -Certificate $cert -HashAlgorithm SHA256
        if ($result.Status -ne 'Valid') { throw "signing $signed left the status $($result.Status): $($result.StatusMessage)" }
        $check = Get-AuthenticodeSignature -FilePath $signed
        if ($check.Status -ne 'Valid') { throw "the signature of $signed has the status $($check.Status): $($check.StatusMessage)" }
        # The signature is appended to the file: it must still be the same rqlited
        & $signed -version
        if ($LASTEXITCODE -ne 0) { throw "the signed rqlited.exe exited with code $LASTEXITCODE" }
        Copy-Item -LiteralPath $signed -Destination $embed -Force
        $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $embed).Hash
        Write-Host "the rqlite member, signed by $($check.SignerCertificate.Subject): $((Get-Item -LiteralPath $embed).Length) bytes, SHA-256 $hash"
        "RQLITED_SIGNED=$signed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    # ranz as it ships (-trimpath, -ldflags "-s -w", the run number as the build number), and the
    # test tool ranz-nodesim, which the service check and the hardening gate use
    - name: Vet and build
      shell: pwsh
      run: |
        go vet ./...
        if ($LASTEXITCODE -ne 0) { throw "go vet exited with code $LASTEXITCODE" }
        go build -trimpath -ldflags "-s -w -X main.build=$env:GITHUB_RUN_NUMBER" -o build\ranz\ ./controller/cmd/ranz
        if ($LASTEXITCODE -ne 0) { throw "go build of ranz exited with code $LASTEXITCODE" }
        go build -o build\ranz\ ./controller/cmd/ranz-nodesim
        if ($LASTEXITCODE -ne 0) { throw "go build of ranz-nodesim exited with code $LASTEXITCODE" }
        Get-ChildItem build\ranz | Format-Table Name, Length
    # ranz bgp on a named pipe that the test makes the way the node does, and its process read from
    # outside: the mitigations of ADR-0039 and the System32-only DLL search (SEC-1 #279)
    - name: The BGP sidecar on the named pipe of the node
      shell: pwsh
      run: |
        go test -count=1 -v -run 'TestPipe|TestNoPipe|TestMitigations' ./ranz-bgp
        if ($LASTEXITCODE -ne 0) { throw "go test exited with code $LASTEXITCODE" }
    # -timeout 20m (CI-SLOW-1 #552, CI-SPEED-1 #547): go test applies the limit to each package alone, and
    # stops a package after 10 minutes unless told otherwise. The tests of controller/internal/controller
    # take an empty database of an rqlited that they share, and run in parallel (rqlitetest.Fresh): the
    # package takes about 160 s on Windows x64, where it took about 520 s to 560 s with an rqlited for
    # each test and a slow runner ran out of the 10 minutes. The slowest package is controller, with its
    # cluster tests, about 220 s to 280 s. The limit stays 20 minutes, more than four times the time of
    # any package: it costs nothing, and a runner can be slow. A hang still ends the package, only later.
    - name: Test
      if: matrix.platform.ARCHITECTURE == 'x64'
      shell: pwsh
      run: |
        go test -count=1 -timeout 20m ./...
        if ($LASTEXITCODE -ne 0) { throw "go test exited with code $LASTEXITCODE" }
    - name: Test the BGP sidecar
      if: matrix.platform.ARCHITECTURE != 'x64'
      shell: pwsh
      run: |
        go test -count=1 ./ranz-bgp/...
        if ($LASTEXITCODE -ne 0) { throw "go test exited with code $LASTEXITCODE" }
    # The mimicry sidecar (CORE-P2-1, #85) end to end on the named pipes of the node, which the Test step
    # above runs on x64: the test is the node at both ends of the two sidecars, over go-winio pipes with the
    # DACL of the node (internal/mimic/pipe_windows.go), a REALITY server and a uTLS client between them
    - name: Test the mimicry sidecar
      if: matrix.platform.ARCHITECTURE != 'x64'
      shell: pwsh
      run: |
        go test -count=1 ./controller/internal/mimic
        if ($LASTEXITCODE -ne 0) { throw "go test exited with code $LASTEXITCODE" }
    # The member of ranz for arm64 (ONE-4, #313): the x64 rqlited.exe written out and started under
    # emulation, and the choice of the rqlited that the controller runs
    - name: Test the rqlite member
      if: matrix.platform.ARCHITECTURE != 'x64'
      shell: pwsh
      run: |
        go test -count=1 -v -run '^(TestRqlitedMemberRuns|TestRqlitedExe.*|TestParseFlagsRqliteExternal)$' ./controller
        if ($LASTEXITCODE -ne 0) { throw "go test exited with code $LASTEXITCODE" }
    # The contract of the one executable, read from outside and natively on this architecture
    # (ONE-1): one version for every subcommand, the subcommands, the NOTICE
    - name: The executable
      shell: pwsh
      run: |
        $ranz = (Resolve-Path build\ranz\ranz.exe).Path
        $err = Join-Path $env:RUNNER_TEMP 'ranz.err'
        $version = (& $ranz version | Out-String).Trim()
        if ($LASTEXITCODE -ne 0) { throw "ranz version exited with code $LASTEXITCODE" }
        Write-Host $version
        if ($version -notmatch ('^ranz \d+\.\d+\.' + $env:GITHUB_RUN_NUMBER + '$')) { throw "ranz version printed '$version'" }
        foreach ($flag in '-version', '--version') {
          $again = (& $ranz $flag | Out-String).Trim()
          if ($again -ne $version) { throw "ranz $flag printed '$again', not '$version'" }
        }
        & $ranz bgp 2> $err
        if ($LASTEXITCODE -ne 2 -or (Get-Content -LiteralPath $err -Raw) -notmatch 'ranz bgp: -pipe is required') { throw "ranz bgp without -pipe: exit code $LASTEXITCODE, $(Get-Content -LiteralPath $err -Raw)" }
        & $ranz controller -h 2> $err
        if ($LASTEXITCODE -ne 0 -or (Get-Content -LiteralPath $err -Raw) -notmatch 'Usage of ranz controller') { throw "ranz controller -h: exit code $LASTEXITCODE, $(Get-Content -LiteralPath $err -Raw)" }
        & $ranz 2> $err
        if ($LASTEXITCODE -ne 2 -or (Get-Content -LiteralPath $err -Raw) -notmatch '(?m)^usage:') { throw "ranz without arguments: exit code $LASTEXITCODE, $(Get-Content -LiteralPath $err -Raw)" }
        $notice = (& $ranz notice | Out-String)
        if ($LASTEXITCODE -ne 0 -or $notice -notmatch 'GoBGP' -or $notice -notmatch 'Apache License') { throw 'ranz notice does not print the licence of GoBGP' }
        if ($notice -notmatch 'rqlite' -or $notice -notmatch 'The MIT License \(MIT\)') { throw 'ranz notice does not print the licence of rqlite' }
        Write-Host 'ranz: one version for every subcommand, the subcommands answer, the NOTICE has the licences of GoBGP and of rqlite'
    # The mimicry sidecar (CORE-P2-1, #85) as a subcommand, natively on this architecture: without -pipe it
    # says so and exits with 2, -keygen prints the key pair of a server, and the NOTICE holds the licences
    # of the libraries that the sidecar carries
    - name: The mimicry sidecar as a subcommand
      shell: pwsh
      run: |
        $ranz = (Resolve-Path build\ranz\ranz.exe).Path
        $err = Join-Path $env:RUNNER_TEMP 'mimic.err'
        & $ranz mimic 2> $err
        if ($LASTEXITCODE -ne 2 -or (Get-Content -LiteralPath $err -Raw) -notmatch 'ranz mimic: -pipe is required') { throw "ranz mimic without -pipe: exit code $LASTEXITCODE, $(Get-Content -LiteralPath $err -Raw)" }
        $keys = (& $ranz mimic -keygen | Out-String)
        if ($LASTEXITCODE -ne 0 -or $keys -notmatch '(?m)^private_key [0-9a-f]{64}\r?$' -or $keys -notmatch '(?m)^public_key [0-9a-f]{64}\r?$') { throw "ranz mimic -keygen did not print a key pair of 64 hex digits each" }
        $notice = (& $ranz notice | Out-String)
        if ($notice -notmatch 'Mozilla Public License Version 2\.0' -or $notice -notmatch 'Copyright \(c\) 2009 The Go Authors' -or $notice -notmatch 'github\.com/juju/ratelimit') { throw 'ranz notice does not print the licences of the libraries of ranz mimic' }
        Write-Host 'ranz mimic: it answers as a subcommand, makes a key pair, and the NOTICE has the licences of its libraries'
    # The tools of SDN-53 (#246) as processes, natively on this architecture: ranz doctor passes its
    # six checks, ranz test throughput reports a rate between its server and its client, which are two
    # processes of the runner, and ranz cert makes a CA and a certificate that it signs with their keys
    # in the Microsoft Software Key Storage Provider and the certificates in the My store of the user, and
    # one more in the LocalMachine\My store, where a node looks for its listener's certificate. certutil
    # finds their keys, Schannel serves with the certificate of the store, and the chain engine of
    # Windows takes it for a client whose only root is the CA (.github/scripts/ranz-tools.ps1).
    - name: The tools ranz cert, ranz doctor and ranz test throughput
      shell: pwsh
      timeout-minutes: 10
      run: |
        ./.github/scripts/ranz-tools.ps1 -Ranz build\ranz\ranz.exe
    # The exploit-mitigation flags of ADR-0039 decision 1 (SEC-1, #279) on the shipped executable,
    # read with dumpbin (.github/scripts/binary-hardening.ps1): the Go toolchain gives them ASLR and
    # DEP, and the exceptions of the script say why not CFG, CET, /GS and /sdl. ranz-nodesim, a
    # test tool, is checked without exceptions and must fail the gate.
    - name: Binary hardening
      shell: pwsh
      run: |
        ./.github/scripts/binary-hardening.ps1 -Path build\ranz\ranz.exe -Unhardened build\ranz\ranz-nodesim.exe
    # The controller's keys in the Microsoft Software Key Storage Provider (internal/keys), in the
    # job log: the X25519 Noise static key against crypto/ecdh, and both keys across two loads; and the
    # certificate of the Controller that is served by its thumbprint with its key staying in the
    # provider (internal/servercert, SDN-92, #397).
    - name: Keys in the key storage provider
      if: matrix.platform.ARCHITECTURE == 'x64'
      shell: pwsh
      run: |
        go test -count=1 -v -run 'TestKSPStatic|TestLoad' ./controller/internal/keys
        if ($LASTEXITCODE -ne 0) { throw "go test exited with code $LASTEXITCODE" }
        go test -count=1 -v -run 'TestServesACertificateOfTheKeyStorage' ./controller/internal/servercert
        if ($LASTEXITCODE -ne 0) { throw "go test exited with code $LASTEXITCODE" }
    # The service runs the ranz.exe built above, which carries the rqlite member (ONE-4, #313): no
    # rqlited is beside it, and the script checks that the controller writes and runs its own, and
    # writes it again after a deletion
    - name: Controller as a Windows service
      if: matrix.platform.ARCHITECTURE == 'x64'
      shell: pwsh
      timeout-minutes: 10
      run: |
        . .github/scripts/controller-service.ps1 -BinDir build\ranz

  # The EVPN of a gateway against FRR, the reference BGP speaker of a data-centre fabric (SDN-25 #201; ADR-0032). FRR runs
  # in a container of its own on a bridge of this runner, which stands in for the second host (ADR-0002 amendment of
  # 2026-10-21): one leaf of the fabric, whose VRFs red and blue hand the same LAN to the gateway on their own L3 VNIs,
  # through the VXLAN of the kernel of the container (ranz-bgp/internal/sidecar/testdata/frr/fabric.sh). TestFRREVPN is the
  # gateway on the runner: the sidecar peers EVPN type-5 with FRR, the prefixes of each VRF reach the VRF of FRR and the
  # other way round, an ICMP echo goes both ways through VXLAN in each VRF, and a prefix withdrawn in red stays in blue.
  # The node itself runs the same exchange against a harness VTEP on Windows (vpntest evpn, windows.yml).
  evpn-frr:
    name: EVPN with FRR (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # FRR 10.7.1, pinned by the digest of its image
      FRR_IMAGE: 'quay.io/frrouting/frr:10.7.1@sha256:e995beaa50fdc9edb35eadcfefa29b7f062cc06f2b812613789b68fa541554d2'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: go.sum
    - name: The fabric, FRR in a container of its own
      run: bash ranz-bgp/internal/sidecar/testdata/frr/fabric.sh "$FRR_IMAGE"
    # The test must run, not skip: the step fails unless it passed
    - name: The gateway against FRR
      shell: bash
      env:
        RANZ_FRR_CONTAINER: ranz-frr
      run: |
        go test -count=1 -v -run '^TestFRREVPN$' ./ranz-bgp/internal/sidecar 2>&1 | tee "$RUNNER_TEMP/frr-test.out"
        grep -q -- '--- PASS: TestFRREVPN' "$RUNNER_TEMP/frr-test.out"
    - name: The log of FRR
      if: ${{ !cancelled() }}
      run: docker exec ranz-frr cat /tmp/frr.log
