# The Go programs of Ranz: one module and one executable, ranz (ONE-1 #310, ADR-0011 amendment of
# 2026-10-22). The controller with its web UI (controller/, SDN-2 #178), the BGP sidecar of ADR-0010
# (ranz-bgp/, CORE-S7-1 #82) and the CLI are all in controller/cmd/ranz: the subcommands controller
# and bgp, and the verbs of the controller's API. ranz-nodesim and ranz-noisepeer (controller/cmd)
# are test tools: this workflow builds them and never ships them. The control protocol schema
# (proto/) belongs here too.
#
# linux: generates the Go code of proto/ranz/control/v1/control.proto with the pinned protoc and
# protoc-gen-go, tidies go.mod and go.sum and runs gofmt; then vets (for Linux and for Windows),
# builds every package and ranz for Linux x64, Windows x64 and Windows arm64 as it ships, records
# the size of each, runs the Linux executable for its contract (one version for every subcommand,
# the subcommands, the NOTICE with the licence of GoBGP), and tests the module, with rqlited of the
# pinned rqlite release for the controller conformance tests and the cluster tests of SDN-17 (three
# controller processes, each with its rqlited, on the runner: controller/cluster_test.go), and the
# session of the BGP sidecar against GoBGP routers over an in-memory pipe. The controller tests
# write every control message they sent or received to a directory, and the nanopb code generated
# from the same schema decodes each one and encodes it back to the same bytes
# (tests/control/nanopb_roundtrip.c). Then the job fails, and prints the diff, if generation, tidy
# or gofmt changed a committed file. Last come the quality gates of ADR-0040 for the module: the
# tests run with -race (item 4) and -coverprofile, and each package must stay at or above its
# coverage floor (item 2, .github/quality/coverage-floors.txt); the fuzz tests of
# .github/quality/fuzz-targets.txt run with go test -fuzz for a short time each (item 1); and
# staticcheck and govulncheck, for Linux and for Windows, must find nothing (item 3).
#
# windows: vets, builds and tests the module on Windows x64 and arm64. On x64 that includes the
# controller (the cluster tests, its keys in the Microsoft Software Key Storage Provider) and ranz
# controller as a Windows service on TCP 443 (and plain HTTP for the redirect) with its own rqlite
# member as its sidecar: install, start, stop, reset-admin and uninstall, driven with ranz and
# ranz-nodesim (.github/scripts/controller-service.ps1). The rqlite member of a Controller is a
# Payload of ranz (ONE-4, #313; ADR-0026 amendment of 2026-10-23): the x64 job signs the rqlited.exe
# of the pinned release with a self-signed certificate that it trusts and embeds it over the
# placeholder of controller/internal/payload before it builds, so its cluster tests, its ranz.exe
# and the service run with members that ranz writes out under the data directory itself, with no
# rqlited beside it, also again after a deletion. On both
# architectures it runs the sidecar on the named pipe of the node, among them the process
# mitigations and the System32-only DLL search of ranz read from outside its process (ADR-0039,
# SEC-1 #279), runs the executable for its contract, and checks its flags
# (.github/scripts/binary-hardening.ps1). The arm64 runner has no rqlited, and
# rqlite publishes no Windows build for arm64, so ranz for arm64 carries no member and the job tests
# the sidecar only. The NOTICE holds the licence text of the pinned rqlite tag word for word
# (TestNoticeHasTheRqliteLicence of controller/cmd/ranz), and each rqlite archive that a job
# downloads has the SHA-256 of the pinned release.
#
# The spike with the node (BGP on TCP 179, a prefix announced and withdrawn, a learned route
# installed through IP Helper, the node starting ranz bgp) needs the C build and runs in
# windows.yml (.github/scripts/bgp-spike.ps1).
#
# Neither job touches the C build, so they run beside windows.yml and add nothing to its time.
#
# A push to master runs both jobs, with no path filter. A pull request runs them when it changes a
# path that they read: controller/ and ranz-bgp/, the two trees of the module; go.mod and go.sum;
# proto/, the schema that go generate and the nanopb round trip read; tests/control/, the round
# trip program; .gitattributes, which sets the line endings of the checkout; this file,
# .github/scripts/controller-service.ps1, the binary hardening gate
# .github/scripts/binary-hardening.ps1, which windows.yml runs too, the fuzz targets, coverage
# floors and accepted vulnerabilities of .github/quality and the scripts that read them. A pull
# request that changes none of them (a C change under src/, or docs only) does not run this
# workflow.

name: ranz

on:
  push:
    branches: [master]
  pull_request:
    paths:
    - 'controller/**'
    - 'ranz-bgp/**'
    - 'go.mod'
    - 'go.sum'
    - 'proto/**'
    - 'tests/control/**'
    - '.gitattributes'
    - '.github/workflows/ranz.yml'
    - '.github/scripts/controller-service.ps1'
    - '.github/quality/fuzz-targets.txt'
    - '.github/quality/coverage-floors.txt'
    - '.github/quality/govulncheck-accepted.txt'
    - '.github/scripts/fuzz-registry.py'
    - '.github/scripts/coverage-floor.py'
    - '.github/scripts/govulncheck-gate.py'
    - '.github/scripts/binary-hardening.ps1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'
  PROTOC_VERSION: '36.2'
  PROTOC_GEN_GO_VERSION: 'v1.36.12'
  # The Python protobuf runtime of the nanopb generator, the one of the protoc release above
  PROTOBUF_PY_VERSION: '7.36.2'
  NANOPB_VERSION: '0.4.9.2'
  RQLITE_VERSION: 'v10.5.3'
  # The SHA-256 of the release archives of RQLITE_VERSION that the jobs download, the digests that
  # GitHub holds for the assets of the release (ONE-4, #313). A new version changes the pin, these
  # digests, windows.yml and the NOTICE together.
  RQLITE_LINUX_AMD64_SHA256: '93dc04417d9d233e79eb359e325793b1f92daa84ec93694953f4bff6307fda2b'
  RQLITE_WIN64_SHA256: '0f4a65a603b89b9a3c2607c5de64445236856884c83aa2e865ec9142fd184118'
  # The Go static analysis of ADR-0040 item 3: staticcheck 2026.2.2 and govulncheck
  STATICCHECK_VERSION: 'v0.8.2'
  GOVULNCHECK_VERSION: 'v1.9.0'

jobs:
  linux:
    name: ranz (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: go.sum
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install protoc, protoc-gen-go, rqlited and the nanopb generator
      run: |
        curl -fsSL -o "$RUNNER_TEMP/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
        unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
        echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
        GOBIN="$RUNNER_TEMP/gobin" go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
        echo "$RUNNER_TEMP/gobin" >> "$GITHUB_PATH"

        curl -fsSL -o "$RUNNER_TEMP/rqlite.tar.gz" "https://github.com/rqlite/rqlite/releases/download/${RQLITE_VERSION}/rqlite-${RQLITE_VERSION}-linux-amd64.tar.gz"
        echo "${RQLITE_LINUX_AMD64_SHA256}  $RUNNER_TEMP/rqlite.tar.gz" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/rqlite"
        tar -xzf "$RUNNER_TEMP/rqlite.tar.gz" -C "$RUNNER_TEMP/rqlite"
        rqlited="$(find "$RUNNER_TEMP/rqlite" -name rqlited -type f | head -n 1)"
        test -n "$rqlited"
        "$rqlited" -version
        echo "RQLITED=$rqlited" >> "$GITHUB_ENV"

        python -m pip install --disable-pip-version-check "protobuf==${PROTOBUF_PY_VERSION}"
        git clone --quiet --depth 1 --branch "nanopb-${NANOPB_VERSION}" https://github.com/nanopb/nanopb "$RUNNER_TEMP/nanopb"

        # Built for the runner; GOOS of the step that runs them picks the platform they analyze
        GOBIN="$RUNNER_TEMP/gobin" go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
        GOBIN="$RUNNER_TEMP/gobin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
    - name: Generate, tidy and format
      run: |
        protoc --version
        go generate ./controller/internal/controlpb
        go mod tidy
        gofmt -l -w controller ranz-bgp
    - name: Vet
      run: |
        go vet ./...
        GOOS=windows go vet ./...
    # ranz as it ships (ONE-1): -trimpath and -ldflags "-s -w" strip the paths and the symbol table
    # (SEC-3 #281, ADR-0036 amendment of 2026-10-22; checked by .github/scripts/self-integrity.ps1),
    # and the run number is the build number of its one version. The test tools are built by
    # go build ./..., not shipped.
    - name: Build
      run: |
        go build ./...
        ldflags="-s -w -X main.build=${GITHUB_RUN_NUMBER}"
        GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o "$RUNNER_TEMP/linux-x64/ranz" ./controller/cmd/ranz
        GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o "$RUNNER_TEMP/windows-x64/ranz.exe" ./controller/cmd/ranz
        GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "$ldflags" -o "$RUNNER_TEMP/windows-arm64/ranz.exe" ./controller/cmd/ranz
        ls -l "$RUNNER_TEMP/linux-x64" "$RUNNER_TEMP/windows-x64" "$RUNNER_TEMP/windows-arm64"
    # ONE-1 records the size of the one file, which carries the controller, GoBGP and the CLI: in the
    # job log, in the job summary and in the artifact ranz-size
    - name: Size of ranz
      run: |
        size="$RUNNER_TEMP/ranz-size.md"
        {
          echo '### Size of ranz, the one executable'
          echo
          echo '| Platform | Bytes |'
          echo '|---|---:|'
          echo "| linux-x64 | $(stat -c %s "$RUNNER_TEMP/linux-x64/ranz") |"
          echo "| windows-x64 | $(stat -c %s "$RUNNER_TEMP/windows-x64/ranz.exe") |"
          echo "| windows-arm64 | $(stat -c %s "$RUNNER_TEMP/windows-arm64/ranz.exe") |"
        } > "$size"
        cat "$size"
        cat "$size" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v4
      with:
        name: ranz-size
        retention-days: 14
        path: ${{ runner.temp }}/ranz-size.md
    # The contract of the one executable, read from outside (ONE-1): ranz version prints one line
    # with the one version, in every spelling, and the run number as its build number; ranz bgp,
    # ranz controller and the CLI answer as their subcommands do; ranz notice prints the NOTICE that
    # is committed, which holds the licences of GoBGP and of rqlite
    - name: The executable
      run: |
        ranz="$RUNNER_TEMP/linux-x64/ranz"
        version="$("$ranz" version)"
        echo "$version"
        echo "$version" | grep -Eq "^ranz [0-9]+\.[0-9]+\.${GITHUB_RUN_NUMBER}\$"
        test "$("$ranz" -version)" = "$version"
        test "$("$ranz" --version)" = "$version"

        code=0
        "$ranz" bgp 2> "$RUNNER_TEMP/bgp.err" || code=$?
        cat "$RUNNER_TEMP/bgp.err"
        test "$code" = 2
        grep -q 'ranz bgp: -pipe is required' "$RUNNER_TEMP/bgp.err"

        "$ranz" controller -h 2> "$RUNNER_TEMP/controller.err"
        grep -q 'Usage of ranz controller' "$RUNNER_TEMP/controller.err"

        code=0
        "$ranz" 2> "$RUNNER_TEMP/cli.err" || code=$?
        cat "$RUNNER_TEMP/cli.err"
        test "$code" = 2
        grep -q '^usage:' "$RUNNER_TEMP/cli.err"

        "$ranz" notice > "$RUNNER_TEMP/NOTICE"
        grep -q 'GoBGP' "$RUNNER_TEMP/NOTICE"
        grep -q 'Apache License' "$RUNNER_TEMP/NOTICE"
        grep -q 'rqlite' "$RUNNER_TEMP/NOTICE"
        grep -q 'The MIT License (MIT)' "$RUNNER_TEMP/NOTICE"
        cmp "$RUNNER_TEMP/NOTICE" controller/cmd/ranz/NOTICE
    # The rqlite version stays pinned (ONE-4, #313): RQLITE_VERSION here and in windows.yml, which
    # downloads the same release for the default VRF tracer, and the NOTICE names that version. The
    # LICENSE of the pinned tag is downloaded for TestNoticeHasTheRqliteLicence, which compares it
    # with the NOTICE word for word, so a new version fails until the NOTICE follows it.
    - name: The rqlite pin and the licence of its tag
      run: |
        grep -Fq "RQLITE_VERSION: '${RQLITE_VERSION}'" .github/workflows/windows.yml
        grep -Fq "the rqlite release ${RQLITE_VERSION}," controller/cmd/ranz/NOTICE
        grep -Fq "rqlite/blob/${RQLITE_VERSION}/go.mod" controller/cmd/ranz/NOTICE
        curl -fsSL -o "$RUNNER_TEMP/rqlite-LICENSE" "https://raw.githubusercontent.com/rqlite/rqlite/${RQLITE_VERSION}/LICENSE"
        echo "RQLITE_LICENSE=$RUNNER_TEMP/rqlite-LICENSE" >> "$GITHUB_ENV"
    # -race is the race detection of ADR-0040 item 4 for the Go code; the profile is read by the
    # coverage floor step
    - name: Test
      env:
        RANZ_CONTROL_WIRE: ${{ runner.temp }}/wire
      run: go test -race -count=1 -coverprofile="$RUNNER_TEMP/cover.out" ./...
    # The Hanzcodes activation service and the install side (internal/activation, SEC-7 #284 and
    # SEC-6 #285), in the job log: the service issues a node-locked, time-limited token and refuses
    # an invalid or node-mismatched request, releases the Enterprise feature key only against an
    # Enterprise token, re-validates on a heartbeat and serves the revocation list through a software
    # KSP that stands in for the HSM, and resolves to the Personal tier when no vendor signing key is
    # linked; the install activates against the service and unseals the Enterprise feature blob only
    # with the server-held key, holds its tier for the grace period past a missed heartbeat and
    # degrades to the Licence in force or Personal past it, and round-trips the offline activation
    # file with no network.
    - name: Activation service and the install, with the software KSP
      run: go test -count=1 -v ./controller/internal/activation
    - name: nanopb round trip of the control messages
      run: |
        out="$RUNNER_TEMP/nanopb-out"
        mkdir -p "$out"
        python "$RUNNER_TEMP/nanopb/generator/nanopb_generator.py" --error-on-unmatched -I proto -D "$out" ranz/control/v1/control.proto
        nanopb="$RUNNER_TEMP/nanopb"
        # PB_FIELD_32BIT: an Update of control.options is larger than 64 kB (see there)
        cflags="-std=c17 -O2 -DPB_FIELD_32BIT -I $nanopb -I $out"
        gcc $cflags -Wall -Wextra -Werror -c tests/control/nanopb_roundtrip.c -o "$RUNNER_TEMP/nanopb_roundtrip.o"
        gcc $cflags -o "$RUNNER_TEMP/nanopb_roundtrip" "$RUNNER_TEMP/nanopb_roundtrip.o" \
          "$out/ranz/control/v1/control.pb.c" "$nanopb/pb_encode.c" "$nanopb/pb_decode.c" "$nanopb/pb_common.c"
        "$RUNNER_TEMP/nanopb_roundtrip" "$RUNNER_TEMP"/wire/*.bin
    - name: Committed files match generation, tidy and gofmt
      if: ${{ !cancelled() }}
      run: |
        git add -A -N go.mod go.sum controller ranz-bgp
        if ! git diff --exit-code -- go.mod go.sum controller ranz-bgp; then
          echo "::error::go.mod, go.sum, controller/ or ranz-bgp/ differs from what go generate, go mod tidy and gofmt make of it: commit the diff above"
          exit 1
        fi
    # ADR-0040 item 2: the statement coverage of each package against its floor
    - name: Coverage floor
      if: ${{ !cancelled() }}
      run: python .github/scripts/coverage-floor.py go --module . --profile "$RUNNER_TEMP/cover.out"
    # ADR-0040 item 1: every fuzz test of the module in .github/quality/fuzz-targets.txt, 20 s each. A
    # crashing input is saved under testdata/fuzz of its package and uploaded below.
    - name: Fuzz (go test -fuzz)
      if: ${{ !cancelled() }}
      run: |
        targets="$(python .github/scripts/fuzz-registry.py go-targets .)"
        test -n "$targets"
        failed=0
        while read -r package target; do
          echo "::group::$target ($package)"
          if ! go test -run '^$' -fuzz "^${target}\$" -fuzztime 20s "$package"; then
            echo "::error::$target of $package found a failing input (testdata/fuzz/$target of the package, in the artifact ranz-fuzz-inputs)"
            failed=1
          fi
          echo "::endgroup::"
        done <<< "$targets"
        exit $failed
    # ADR-0040 item 3: staticcheck (with the checks of controller/staticcheck.conf for controller/)
    # and govulncheck, for Linux and for Windows. Any staticcheck finding fails the job, and so does
    # a vulnerability that the code calls, unless .github/quality/govulncheck-accepted.txt accepts it
    # for that version. The two staticcheck runs are merged (-merge), so code that one platform alone
    # uses is not reported as unused.
    - name: Static analysis (staticcheck, govulncheck)
      if: ${{ !cancelled() }}
      run: |
        "$RUNNER_TEMP/gobin/staticcheck" -version
        "$RUNNER_TEMP/gobin/staticcheck" -f binary ./... > "$RUNNER_TEMP/staticcheck-linux.bin"
        GOOS=windows "$RUNNER_TEMP/gobin/staticcheck" -f binary ./... > "$RUNNER_TEMP/staticcheck-windows.bin"
        "$RUNNER_TEMP/gobin/staticcheck" -merge "$RUNNER_TEMP/staticcheck-linux.bin" "$RUNNER_TEMP/staticcheck-windows.bin"
        "$RUNNER_TEMP/gobin/govulncheck" -version
        "$RUNNER_TEMP/gobin/govulncheck" -format json ./... > "$RUNNER_TEMP/govulncheck-linux.json"
        GOOS=windows "$RUNNER_TEMP/gobin/govulncheck" -format json ./... > "$RUNNER_TEMP/govulncheck-windows.json"
        python .github/scripts/govulncheck-gate.py --accepted .github/quality/govulncheck-accepted.txt "$RUNNER_TEMP/govulncheck-linux.json" "$RUNNER_TEMP/govulncheck-windows.json"
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: ranz-fuzz-inputs
        if-no-files-found: ignore
        path: |
          controller/**/testdata/fuzz/
          ranz-bgp/**/testdata/fuzz/

  windows:
    strategy:
      fail-fast: false
      matrix:
        platform: [
          { ARCHITECTURE: x64, RUNNER: "windows-latest" },
          { ARCHITECTURE: arm64, RUNNER: "windows-11-arm" }
        ]
    name: ranz (Windows ${{ matrix.platform.ARCHITECTURE }})
    runs-on: ${{ matrix.platform.RUNNER }}
    timeout-minutes: 40
    env:
      # The Go code builds without cgo; the gcc of the arm64 runner builds x64 code only
      CGO_ENABLED: '0'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: go.sum
    - name: Install rqlited
      if: matrix.platform.ARCHITECTURE == 'x64'
      shell: pwsh
      run: |
        $zip = Join-Path $env:RUNNER_TEMP 'rqlite.zip'
        $dir = Join-Path $env:RUNNER_TEMP 'rqlite'
        Invoke-WebRequest -Uri "https://github.com/rqlite/rqlite/releases/download/$env:RQLITE_VERSION/rqlite-$env:RQLITE_VERSION-win64.zip" -OutFile $zip
        # The LICENSE of the pinned tag, for TestNoticeHasTheRqliteLicence
        $licence = Join-Path $env:RUNNER_TEMP 'rqlite-LICENSE'
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/rqlite/rqlite/$env:RQLITE_VERSION/LICENSE" -OutFile $licence
        "RQLITE_LICENSE=$licence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        $sum = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
        if ($sum -ne $env:RQLITE_WIN64_SHA256) { throw "rqlite-$env:RQLITE_VERSION-win64.zip has the SHA-256 $sum, not the pinned $env:RQLITE_WIN64_SHA256" }
        Expand-Archive -Path $zip -DestinationPath $dir
        $exe = Get-ChildItem -Path $dir -Recurse -Filter 'rqlited.exe' | Select-Object -First 1
        if (-not $exe) { throw 'rqlited.exe is not in the rqlite release archive' }
        & $exe.FullName -version
        "RQLITED=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    # The rqlite member of a Controller is a Payload of ranz (ONE-4, #313; ADR-0026 amendment of
    # 2026-10-23). ranz controller writes it out under its data directory only after it checked the
    # SHA-256 and the Authenticode signature of the copy it carries (controller/internal/payload),
    # and the rqlited.exe of the release has no signature. So this step signs a copy of it with a
    # self-signed code-signing certificate that it makes and trusts on this runner, as
    # .github/scripts/self-integrity.ps1 does for the executables of the C build (the certificate of
    # the release signs the Payload at release, as it signs ranz-node.exe), and writes it over the
    # placeholder of controller/internal/payload, so that every build and test binary of the steps
    # below carries it: the cluster tests run members that write their own rqlited from it, ranz.exe
    # carries it as it ships, and the service check runs with no rqlited beside ranz.exe. RQLITED
    # stays for the tests that start an rqlite of their own (rqlitetest), and RQLITED_SIGNED is the
    # signed file, which the service check compares what the controller writes out with.
    - name: Sign the rqlite member and embed it as the Payload
      if: matrix.platform.ARCHITECTURE == 'x64'
      shell: pwsh
      run: |
        $embed = (Resolve-Path controller\internal\payload\rqlited_amd64.exe).Path
        $work = Join-Path $env:RUNNER_TEMP 'rqlited-payload'
        New-Item -ItemType Directory -Force -Path $work | Out-Null
        $signed = Join-Path $work 'rqlited.exe'
        Copy-Item -LiteralPath $env:RQLITED -Destination $signed -Force
        $cert = New-SelfSignedCertificate -Type CodeSigningCert `
          -Subject 'CN=Ranz VPN CI signing (rqlite member, self-signed), O=Hanzcodes' `
          -CertStoreLocation Cert:\CurrentUser\My `
          -KeyExportPolicy Exportable -KeyUsage DigitalSignature `
          -NotAfter (Get-Date).AddYears(1)
        $cer = Join-Path $work 'ranz-ci-rqlite.cer'
        Export-Certificate -Cert $cert -FilePath $cer | Out-Null
        Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
        Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
        $result = Set-AuthenticodeSignature -FilePath $signed -Certificate $cert -HashAlgorithm SHA256
        if ($result.Status -ne 'Valid') { throw "signing $signed left the status $($result.Status): $($result.StatusMessage)" }
        $check = Get-AuthenticodeSignature -FilePath $signed
        if ($check.Status -ne 'Valid') { throw "the signature of $signed has the status $($check.Status): $($check.StatusMessage)" }
        # The signature is appended to the file: it must still be the same rqlited
        & $signed -version
        if ($LASTEXITCODE -ne 0) { throw "the signed rqlited.exe exited with code $LASTEXITCODE" }
        Copy-Item -LiteralPath $signed -Destination $embed -Force
        $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $embed).Hash
        Write-Host "the rqlite member, signed by $($check.SignerCertificate.Subject): $((Get-Item -LiteralPath $embed).Length) bytes, SHA-256 $hash"
        "RQLITED_SIGNED=$signed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    # ranz as it ships (-trimpath, -ldflags "-s -w", the run number as the build number), and the
    # test tool ranz-nodesim, which the service check and the hardening gate use
    - name: Vet and build
      shell: pwsh
      run: |
        go vet ./...
        if ($LASTEXITCODE -ne 0) { throw "go vet exited with code $LASTEXITCODE" }
        go build -trimpath -ldflags "-s -w -X main.build=$env:GITHUB_RUN_NUMBER" -o build\ranz\ ./controller/cmd/ranz
        if ($LASTEXITCODE -ne 0) { throw "go build of ranz exited with code $LASTEXITCODE" }
        go build -o build\ranz\ ./controller/cmd/ranz-nodesim
        if ($LASTEXITCODE -ne 0) { throw "go build of ranz-nodesim exited with code $LASTEXITCODE" }
        Get-ChildItem build\ranz | Format-Table Name, Length
    # ranz bgp on a named pipe that the test makes the way the node does, and its process read from
    # outside: the mitigations of ADR-0039 and the System32-only DLL search (SEC-1 #279)
    - name: The BGP sidecar on the named pipe of the node
      shell: pwsh
      run: |
        go test -count=1 -v -run 'TestPipe|TestNoPipe|TestMitigations' ./ranz-bgp
        if ($LASTEXITCODE -ne 0) { throw "go test exited with code $LASTEXITCODE" }
    - name: Test
      if: matrix.platform.ARCHITECTURE == 'x64'
      shell: pwsh
      run: |
        go test -count=1 ./...
        if ($LASTEXITCODE -ne 0) { throw "go test exited with code $LASTEXITCODE" }
    - name: Test the BGP sidecar
      if: matrix.platform.ARCHITECTURE != 'x64'
      shell: pwsh
      run: |
        go test -count=1 ./ranz-bgp/...
        if ($LASTEXITCODE -ne 0) { throw "go test exited with code $LASTEXITCODE" }
    # The contract of the one executable, read from outside and natively on this architecture
    # (ONE-1): one version for every subcommand, the subcommands, the NOTICE
    - name: The executable
      shell: pwsh
      run: |
        $ranz = (Resolve-Path build\ranz\ranz.exe).Path
        $err = Join-Path $env:RUNNER_TEMP 'ranz.err'
        $version = (& $ranz version | Out-String).Trim()
        if ($LASTEXITCODE -ne 0) { throw "ranz version exited with code $LASTEXITCODE" }
        Write-Host $version
        if ($version -notmatch ('^ranz \d+\.\d+\.' + $env:GITHUB_RUN_NUMBER + '$')) { throw "ranz version printed '$version'" }
        foreach ($flag in '-version', '--version') {
          $again = (& $ranz $flag | Out-String).Trim()
          if ($again -ne $version) { throw "ranz $flag printed '$again', not '$version'" }
        }
        & $ranz bgp 2> $err
        if ($LASTEXITCODE -ne 2 -or (Get-Content -LiteralPath $err -Raw) -notmatch 'ranz bgp: -pipe is required') { throw "ranz bgp without -pipe: exit code $LASTEXITCODE, $(Get-Content -LiteralPath $err -Raw)" }
        & $ranz controller -h 2> $err
        if ($LASTEXITCODE -ne 0 -or (Get-Content -LiteralPath $err -Raw) -notmatch 'Usage of ranz controller') { throw "ranz controller -h: exit code $LASTEXITCODE, $(Get-Content -LiteralPath $err -Raw)" }
        & $ranz 2> $err
        if ($LASTEXITCODE -ne 2 -or (Get-Content -LiteralPath $err -Raw) -notmatch '(?m)^usage:') { throw "ranz without arguments: exit code $LASTEXITCODE, $(Get-Content -LiteralPath $err -Raw)" }
        $notice = (& $ranz notice | Out-String)
        if ($LASTEXITCODE -ne 0 -or $notice -notmatch 'GoBGP' -or $notice -notmatch 'Apache License') { throw 'ranz notice does not print the licence of GoBGP' }
        if ($notice -notmatch 'rqlite' -or $notice -notmatch 'The MIT License \(MIT\)') { throw 'ranz notice does not print the licence of rqlite' }
        Write-Host 'ranz: one version for every subcommand, the subcommands answer, the NOTICE has the licences of GoBGP and of rqlite'
    # The exploit-mitigation flags of ADR-0039 decision 1 (SEC-1, #279) on the shipped executable,
    # read with dumpbin (.github/scripts/binary-hardening.ps1): the Go toolchain gives them ASLR and
    # DEP, and the exceptions of the script say why not CFG, CET, /GS and /sdl. ranz-nodesim, a
    # test tool, is checked without exceptions and must fail the gate.
    - name: Binary hardening
      shell: pwsh
      run: |
        ./.github/scripts/binary-hardening.ps1 -Path build\ranz\ranz.exe -Unhardened build\ranz\ranz-nodesim.exe
    # The controller's keys in the Microsoft Software Key Storage Provider (internal/keys), in the
    # job log: the X25519 Noise static key against crypto/ecdh, and both keys across two loads.
    - name: Keys in the key storage provider
      if: matrix.platform.ARCHITECTURE == 'x64'
      shell: pwsh
      run: |
        go test -count=1 -v -run 'TestKSPStatic|TestLoad' ./controller/internal/keys
        if ($LASTEXITCODE -ne 0) { throw "go test exited with code $LASTEXITCODE" }
    # The service runs the ranz.exe built above, which carries the rqlite member (ONE-4, #313): no
    # rqlited is beside it, and the script checks that the controller writes and runs its own, and
    # writes it again after a deletion
    - name: Controller as a Windows service
      if: matrix.platform.ARCHITECTURE == 'x64'
      shell: pwsh
      timeout-minutes: 10
      run: |
        . .github/scripts/controller-service.ps1 -BinDir build\ranz
