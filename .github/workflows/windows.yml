# The C build and its checks: x64 and arm64 (build_and_test), fuzz-asan, the x64 and arm64 Debug
# builds and the format check, and the quality gates of ADR-0040 for the C code: the performance
# regression gate in build_and_test, the coverage floor of the new core (coverage), clang-tidy and
# MSVC /analyze (static-analysis) and Application Verifier (appverif). The fuzz targets run in
# fuzz-asan; quality.yml checks that every parser has one.
#
# A push to master runs every job, with no path filter. A pull request runs them when it changes a
# path that one of the jobs reads. The filter starts from every path ('**') and takes out the paths
# that no job here reads:
# - controller/ and proto/: the Go controller and its control protocol schema (controller.yml). No
#   CMake file reads proto/ yet: when the C node generates its nanopb code from it in the build,
#   the '!proto/**' line goes, and a change of the schema runs both workflows.
# - ranz-bgp/: the Go BGP sidecar of ADR-0010 (not in the tree yet), which the C build does not read.
# - tests/control/: the nanopb round trip of controller.yml.
# - docs/ and every *.md file (ADRs, README.md, CONTEXT.md, CLAUDE.md). The files of src/bin/hamcore
#   are resources of the executables (cmake/RanzResources.cmake), so that directory is taken back
#   in, whatever its file names.
# - controller.yml, move-only.yml and quality.yml, and the scripts that only they call.
# Every other path runs the workflow: src/, cmake/, CMakeLists.txt, CMakePresets.json, vcpkg.json,
# .gitmodules, .gitattributes, .clang-format, tests/golden/, developer_tools/stbchecker/, this file,
# the scripts of .github/scripts that the jobs call and the files of .github/quality that they read.
# A new top-level path also runs it until it is taken out here.
on:
  push:
    branches: [master]
  pull_request:
    paths:
    - '**'
    - '!controller/**'
    - '!proto/**'
    - '!ranz-bgp/**'
    - '!tests/control/**'
    - '!docs/**'
    - '!**.md'
    - 'src/bin/hamcore/**'
    - '!.github/workflows/controller.yml'
    - '!.github/scripts/controller-service.ps1'
    - '!.github/workflows/move-only.yml'
    - '!.github/scripts/move-only-check.py'
    - '!.github/scripts/move-only-check-test.py'
    - '!.github/workflows/quality.yml'
    - '!.github/scripts/fuzz-registry.py'
    - '!.github/scripts/quality-gates-test.py'
    - '!.github/quality/fuzz-targets.txt'
    - '!.github/scripts/govulncheck-gate.py'
    - '!.github/quality/govulncheck-accepted.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# vcpkg binary caching: built packages (OpenSSL) are stored as zip files keyed by their ABI hash in
# VCPKG_BINCACHE and kept between runs with actions/cache. The cache key carries the hash of
# vcpkg.json: its builtin-baseline pins the ports tree (the same OpenSSL and zlib on every runner),
# and a change of vcpkg.json is a cache miss, so the new versions are built, never mixed with old ones.
# VCPKG_ROOT is the vcpkg checkout of the runner image: CMakePresets.json takes the toolchain file from it.
env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_BINCACHE: ${{ github.workspace }}\vcpkg-bincache
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-bincache,readwrite
  # The Go of controller.yml and ranz-bgp.yml: ranz-noisepeer (controller/cmd/ranz-noisepeer), the
  # flynn/noise end of the session module's interop test (coretest noiseinterop, CORE-F2 #62), and
  # the BGP sidecar spike (ranz-bgp.yml, CORE-S7-1)
  GO_VERSION: '1.27.3'

jobs:
  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        platform: [
          { ARCHITECTURE: x64, VCPKG_TRIPLET: "x64-windows-static", RUNNER: "windows-latest"},
          { ARCHITECTURE: arm64, VCPKG_TRIPLET: "arm64-windows-static", RUNNER: "windows-11-arm"}
        ]
    runs-on: ${{ matrix.platform.RUNNER }}
    name: ${{ matrix.platform.ARCHITECTURE }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: controller/go.sum
    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-${{ matrix.platform.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json') }}-none
        restore-keys: vcpkg-bin-${{ matrix.platform.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json') }}-
    - name: Build
      env:
        ARCHITECTURE: ${{ matrix.platform.ARCHITECTURE }}
      run: |
        if not exist "%VCPKG_BINCACHE%" mkdir "%VCPKG_BINCACHE%"

        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
        if "%VSINSTALL%"=="" (
          echo Visual Studio installation was not found.
          exit /b 1
        )

        if /i "%ARCHITECTURE%"=="x64" (
          set "VCVARS_PATH=%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "COMPILER_PATH=%VSINSTALL%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
        ) else if /i "%ARCHITECTURE%"=="arm64" (
          set "VCVARS_PATH=%VSINSTALL%\VC\Auxiliary\Build\vcvarsarm64.bat"
          set "COMPILER_PATH=%VSINSTALL%\VC\Tools\Llvm\ARM64\bin\clang-cl.exe"
        ) else (
          echo Unsupported architecture: %ARCHITECTURE%
          exit /b 1
        )

        call "%VCVARS_PATH%"
        rem The preset is named after the architecture (CMakePresets.json); a job adds the compiler path of this
        rem runner, the run number and build/compile_commands.json (for the /volatile:ms check) to it
        cmake --preset %ARCHITECTURE% -DCMAKE_C_COMPILER="%COMPILER_PATH%" -DBUILD_NUMBER=%GITHUB_RUN_NUMBER% -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        if errorlevel 1 exit /b 1

        rem The compiler output goes to build\build-log.txt for the unused-code report step, then to the job log
        cmake --build --preset %ARCHITECTURE% > build\build-log.txt 2>&1
        set BUILD_EXIT=%ERRORLEVEL%
        type build\build-log.txt
        if not "%BUILD_EXIT%"=="0" exit /b %BUILD_EXIT%

        rem The linker's report of what /OPT:REF discarded and /OPT:ICF folded (src/CMakeLists.txt) for
        rem vpnserver and vpncmd, uploaded as link-verbose-<arch>: each one is linked again with /VERBOSE,
        rem passed in _LINK_, which lld-link and link.exe add to their arguments. lld-link has no
        rem /VERBOSE:REF; its /VERBOSE lists the discarded sections and the folded functions.
        set "_LINK_=/VERBOSE"
        for %%t in (vpnserver vpncmd) do (
          del build\%%t.exe
          cmake --build --preset %ARCHITECTURE% --target %%t > build\link-verbose-%%t.txt 2>&1
          if errorlevel 1 (
            type build\link-verbose-%%t.txt
            exit /b 1
          )
        )
        set "_LINK_="
        exit /b 0
      shell: cmd
    # Every Mayaqua and Cedar compile command carries /volatile:ms (cmake/RanzOptions.cmake). ARM64
    # defaults to /volatile:iso, which gives the cross-thread halt and cancel flags no acquire and
    # release semantics.
    - name: Check /volatile:ms
      shell: pwsh
      run: |
        $db = Get-Content -Raw -LiteralPath build/compile_commands.json | ConvertFrom-Json
        $own = @($db | Where-Object { $_.file -match '[\\/]src[\\/](Mayaqua|Cedar)[\\/]' })
        if ($own.Count -eq 0) { throw 'No Mayaqua or Cedar compile command in build/compile_commands.json' }
        $missing = @($own | Where-Object { $_.command -notmatch '(^|\s)[/-]volatile:ms(\s|$)' })
        $missing | ForEach-Object { Write-Host "No /volatile:ms: $($_.file)" }
        if ($missing.Count -gt 0) { throw "$($missing.Count) of $($own.Count) Mayaqua and Cedar compile commands lack /volatile:ms" }
        Write-Host "$($own.Count) Mayaqua and Cedar compile commands carry /volatile:ms (${{ matrix.platform.ARCHITECTURE }})"
    # The key is the content hash of the cache directory, so a run that built nothing new finds the key
    # taken and saves nothing (a warning, not a failure).
    - name: Save vcpkg binary cache
      if: ${{ !cancelled() }}
      uses: actions/cache/save@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-${{ matrix.platform.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('vcpkg-bincache/**') }}
    # Every unused or unreachable code warning of the build (cmake/RanzWarnings.cmake), de-duplicated:
    # in the job log under "=== unused-code report ===", in the job summary and as an artifact.
    # The kinds in RANZ_UNUSED_ERROR_FLAGS are errors and fail the Build step; the rest are informational.
    - name: Unused-code report
      if: ${{ !cancelled() }}
      shell: pwsh
      run: |
        python .github/scripts/unused-report.py --log build/build-log.txt --out build/unused-report.txt --arch ${{ matrix.platform.ARCHITECTURE }}
    - name: Upload unused-code report and build log
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: warn
        name: unused-report-${{ matrix.platform.ARCHITECTURE }}
        path: |
          build/unused-report.txt
          build/build-log.txt
    - name: Upload linker report (vpnserver and vpncmd)
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: warn
        name: link-verbose-${{ matrix.platform.ARCHITECTURE }}
        path: build/link-verbose-*.txt
    # Source lines per directory and executable sizes, in the job log and the job summary. Never a gate.
    - name: Size metrics
      if: ${{ !cancelled() }}
      shell: pwsh
      run: |
        python .github/scripts/size-metrics.py --build-dir build --arch ${{ matrix.platform.ARCHITECTURE }}
    # The version resource of each executable (src/BuildFiles/VerScript/ver.rc.in): English (United
    # States), language 0x0409, with the file description filled in.
    - name: Version resource
      shell: pwsh
      run: |
        foreach ($exe in 'vpnserver', 'vpncmd', 'vpntest', 'ranz-node', 'coretest') {
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "build/$exe.exe").Path)
          Write-Host "${exe}.exe: Language '$($info.Language)', FileDescription '$($info.FileDescription)', FileVersion '$($info.FileVersion)'"
          if ($info.Language -ne 'English (United States)') { throw "${exe}.exe: version resource language is '$($info.Language)', not English (United States) (0x0409)" }
          if (-not $info.FileDescription) { throw "${exe}.exe: version resource has no FileDescription" }
        }
    - name: Set up .NET for stbchecker
      if: matrix.platform.ARCHITECTURE == 'x64'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Check string tables
      if: matrix.platform.ARCHITECTURE == 'x64'
      shell: pwsh
      run: |
        cd developer_tools/stbchecker
        dotnet run -- ../../src/bin/hamcore
        if ($LASTEXITCODE -ne 0) { throw "stbchecker reported differences between the string tables (exit code $LASTEXITCODE)" }
    - name: Test
      timeout-minutes: 10
      shell: pwsh
      env:
        # Names build/harness-out/bench-<arch>.txt (the BENCH lines of vpntest bench)
        ARCHITECTURE: ${{ matrix.platform.ARCHITECTURE }}
      run: |
        . .github/scripts/vpntest.ps1
    # The performance regression gate (ADR-0040 item 5): every BENCH case of this run (vpntest bench and
    # the other tests that print BENCH lines) against its median recorded from earlier CI runs of the
    # same architecture (.github/quality/bench-<arch>.txt). A case slower than its median by more than
    # its margin fails the job; .github/scripts/bench-gate.py record makes the file anew.
    - name: Performance regression gate
      shell: pwsh
      run: |
        $arch = '${{ matrix.platform.ARCHITECTURE }}'
        python .github/scripts/bench-gate.py compare --medians ".github/quality/bench-$arch.txt" "build/harness-out/bench-$arch.txt"
        if ($LASTEXITCODE -ne 0) { throw "a benchmark is slower than its recorded median allows (exit code $LASTEXITCODE)" }
    # The new core's crypto module (CORE-F1, #61): known-answer tests of X25519, AES-GCM, SHA-256,
    # HMAC, HKDF and the RNG, the identity key, the ML-KEM hybrid, the certificate path and an
    # in-memory Schannel TLS 1.3 handshake; and its session module (CORE-F2, #62): the Noise_IK
    # handshake against the cacophony vector, the IKhfs handshake, the golden transcripts of the
    # session, its timers and rekey, the tunnel, and the interop with flynn/noise through
    # ranz-noisepeer. On x64 and arm64. With the peer module's ICE tests (CORE-S5-3, #79), which
    # wait about 90 s for the consent and check timers of libjuice, the step takes 10 minutes.
    - name: Build the Noise interop peer (flynn/noise)
      shell: pwsh
      working-directory: controller
      run: |
        go build -o ..\build\ranz-noisepeer.exe ./cmd/ranz-noisepeer
        if ($LASTEXITCODE -ne 0) { throw "go build exited with code $LASTEXITCODE" }
    - name: Core crypto and session tests
      timeout-minutes: 10
      shell: pwsh
      run: |
        . .github/scripts/coretest.ps1
    # The new core links no OpenSSL and no liboqs (ADR-0022, CORE-F1 #61): the linker map of
    # coretest, which links the crypto module and the system libraries only, names no object,
    # library or symbol of either. src/CMakeLists.txt checks the same at configure time
    # (ranz_core_check_links). String literals (the ??_C@ symbols) are left out: their names carry
    # the text, and coretest's messages mention the OpenSSL 3 PFX it imports.
    - name: Core links no OpenSSL or liboqs
      shell: pwsh
      run: |
        $map = Get-Content -Raw -LiteralPath build/coretest.map
        if ($map -notmatch 'corecrypto') { throw 'build/coretest.map names no corecrypto object: not the map of the crypto module' }
        if ($map -notmatch 'corenoise') { throw 'build/coretest.map names no corenoise object: not the map of the session module' }
        $hits = @([regex]::Matches($map, '(?im)^.*(openssl|libcrypto|libssl|liboqs|oqsprovider|\bOQS_|\bEVP_|\bOSSL_|\bSSL_CTX_|\bX509_new\b).*$') | ForEach-Object { $_.Value.Trim() } | Where-Object { $_ -notmatch '\?\?_C@' })
        $hits | Select-Object -First 20 | ForEach-Object { Write-Host $_ }
        if ($hits.Count -gt 0) { throw "coretest links OpenSSL or liboqs: $($hits.Count) lines of build/coretest.map" }
        Write-Host "build/coretest.map (${{ matrix.platform.ARCHITECTURE }}): corecrypto and corenoise linked, no OpenSSL or liboqs object, library or symbol"
    # The exploit-mitigation flags of ADR-0039 decision 1 (SEC-1, #279) on the node, the shipped
    # executable of the new core, read from the binary with dumpbin: CFG, CET (x64), high-entropy
    # ASLR, DEP, /GS and /sdl, or an exception that says why not (.github/scripts/binary-hardening.ps1).
    # ranz-noisepeer, a Go test tool built without them, must fail the gate.
    - name: Binary hardening
      shell: pwsh
      run: |
        ./.github/scripts/binary-hardening.ps1 -Path build\ranz-node.exe -Unhardened build\ranz-noisepeer.exe
    # When a step fails: what the build asked the linker for, next to what the gate read from the
    # binary. The link command of ranz-node (ninja -t commands; its response file holds the objects
    # and libraries) and the link variables of its build statement in build.ninja.
    - name: Link command of ranz-node
      if: failure()
      shell: pwsh
      run: |
        $ninja = (Select-String -LiteralPath build\CMakeCache.txt -Pattern '^CMAKE_MAKE_PROGRAM:\w+=(.+)$').Matches[0].Groups[1].Value
        & $ninja -C build -t commands ranz-node.exe | Select-Object -Last 1
        (Select-String -LiteralPath build\build.ninja -Pattern '^build ranz-node\.exe:' -Context 0, 20).Context.PostContext | Where-Object { $_ -match '^\s+LINK_' }
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: ranz-bgp/go.sum
    # The Windows spike of the BGP sidecar (ADR-0010, CORE-S7-1 #82), on x64 and arm64: ranz-bgp built next to
    # vpntest, GoBGP's own gobgpd as the router of the operator on 127.0.0.1, and vpntest bgp: BGP on TCP 179,
    # a prefix announced and withdrawn, a learned route installed through IP Helper and removed again, and no
    # sidecar on a node without BGP peers
    - name: BGP sidecar spike
      timeout-minutes: 15
      shell: pwsh
      run: |
        . .github/scripts/ranz-bgp-spike.ps1 -BuildDir build
    - name: Self-check
      timeout-minutes: 10
      shell: pwsh
      run: |
        $out = & build\vpncmd.exe /TOOLS /CMD Check 2>&1 | Out-String
        Write-Host $out
        if ($LASTEXITCODE -ne 0) { throw "vpncmd self-check exited with code $LASTEXITCODE" }
        if ($out -notmatch 'All checks passed') { throw "vpncmd self-check did not report 'All checks passed'" }
    # vpntest trace without and inside an ETW trace session on the Debug() TraceLogging provider (ticket #92).
    # The session's .etl file is kept in build/harness-out/.
    - name: ETW trace session
      timeout-minutes: 5
      shell: pwsh
      run: |
        . .github/scripts/etw-trace.ps1
    # vpnserver installed, started, stopped and uninstalled as a Windows service: its start and stop entries
    # in the Application event log (ticket #92)
    - name: Service events in the Event Log
      timeout-minutes: 10
      shell: pwsh
      run: |
        . .github/scripts/service-eventlog.ps1
    # vpnserver from an unzipped folder: /install adds the one inbound rule "Ranz VPN Server" for it,
    # the server start adds or changes no rule and runs no VBScript, /uninstall deletes the rule
    # (ticket #47)
    - name: Firewall rule of /install and /uninstall
      timeout-minutes: 10
      shell: pwsh
      run: |
        . .github/scripts/firewall-rule.ps1
    - name: Upload harness outputs (golden bootstrap and diffs)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: ignore
        name: harness-out-${{ matrix.platform.ARCHITECTURE }}
        path: build/harness-out/
    - uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        name: Binaries-${{ matrix.platform.ARCHITECTURE }}
        path: |
          build/*.exe
          build/*.pdb

  # AddressSanitizer + libFuzzer (x64 only: Microsoft documents ASan on Windows for x86 and x64).
  # Builds with -DRANZ_ASAN=ON -DRANZ_FUZZ=ON (cmake/RanzSanitizers.cmake), runs the vpntest
  # smoke test script on that build, replays the seed corpora (deterministic), then runs every
  # fuzz target of src/fuzz for a fixed time. Any of the three failing fails the job.
  fuzz-asan:
    runs-on: windows-latest
    name: fuzz-asan
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: controller/go.sum
    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-none
        restore-keys: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-
    - name: Pick clang-cl with the one-DLL ASan runtime and libFuzzer
      shell: pwsh
      run: |
        # Visual Studio's clang-cl first (the compiler of build_and_test), the runner's standalone
        # LLVM second. A toolchain is taken only if its runtime directory holds the libraries
        # cmake/RanzSanitizers.cmake links: the one-DLL ASan runtime of LLVM 20 and later
        # (asan_dynamic, asan_static_runtime_thunk) and libFuzzer. The static /MT runtime of
        # LLVM 19 and earlier never hooks HeapAlloc (Mayaqua's allocator), so it is not accepted.
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
        $libs = @('asan_dynamic', 'asan_static_runtime_thunk', 'fuzzer')
        foreach ($cc in @("$vs\VC\Tools\Llvm\x64\bin\clang-cl.exe", "$env:ProgramFiles\LLVM\bin\clang-cl.exe")) {
          if (-not (Test-Path -LiteralPath $cc)) { continue }
          # Official LLVM builds for Windows keep compiler-rt in <resource-dir>\lib\windows (one file per
          # architecture), others in the per-target -print-runtime-dir; try both.
          $dirs = @((& $cc -print-runtime-dir | Out-String).Trim(), (Join-Path (& $cc -print-resource-dir | Out-String).Trim() 'lib\windows'))
          foreach ($rt in $dirs) {
            if (-not (Test-Path -LiteralPath $rt)) { Write-Host "$cc -> $rt (does not exist)"; continue }
            $missing = @($libs | Where-Object {
              -not (Test-Path -LiteralPath "$rt\clang_rt.$_-x86_64.lib") -and -not (Test-Path -LiteralPath "$rt\clang_rt.$_.lib")
            })
            Write-Host "$cc -> $rt (missing: $($missing -join ', '))"
            Get-ChildItem -LiteralPath $rt -Filter 'clang_rt.*' -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { Write-Host "    $($_.Name)" }
            if ($missing.Count -eq 0) {
              & $cc --version
              "COMPILER_PATH=$cc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "RANZ_RT_DIR=$rt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              exit 0
            }
          }
        }
        throw 'No clang-cl with the one-DLL ASan runtime (LLVM 20 or later) and libFuzzer found'
    - name: Build (RANZ_ASAN=ON, RANZ_FUZZ=ON)
      run: |
        if not exist "%VCPKG_BINCACHE%" mkdir "%VCPKG_BINCACHE%"

        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
        if "%VSINSTALL%"=="" (
          echo Visual Studio installation was not found.
          exit /b 1
        )

        call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
        rem COMPILER_PATH is the clang-cl picked by the step above
        cmake --preset asan -DCMAKE_C_COMPILER="%COMPILER_PATH%"
        if errorlevel 1 exit /b 1
        cmake --build --preset asan
      shell: cmd
    - name: Save vcpkg binary cache
      if: ${{ !cancelled() }}
      uses: actions/cache/save@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('vcpkg-bincache/**') }}
    - name: vpntest smoke test under ASan
      shell: pwsh
      timeout-minutes: 10
      env:
        # harness and bench have time budgets that AddressSanitizer would exceed; run them in build_and_test only.
        # certdl has time windows too (it measures the client timeouts); it also runs in build_and_test only.
        # nodesvc installs ranz-node as a service, which would run outside the instrumented process; build_and_test only.
        RANZ_SMOKE_TESTS: nthash,crypto,stun,watermark,stress,tickorigin,timeenc,nullsafe,charset,fileio,resources,threadpool,dns,trace,eventlog,str,udpaccel,selow,dllsearch,machineid,vmdetect,tcpip,x509,bufbounds,keepalive,packcap,storepacket,consoleline,tempdir,logwriter,logbound,slog,eraser,authtype,acpassword,sigleak,listeners,pktparse,vlantpid,icmpv6ns,pack_decode_bounds,tablecache,registry,certsig,x509root,rsasig,chaincerts,tlsctx,endian,svcargs,osinfo,fifo,node,nodelogin,store,transport
      run: |
        # The smoke test script of build_and_test itself, so both jobs run the same test list. Its output
        # and the vpntest stderr (AddressSanitizer reports) are captured, to also catch a report printed
        # after "NO MEMORY LEAKS".
        $script = '.github/scripts/vpntest.ps1'
        $out = (cmd /c "pwsh -NoProfile -ExecutionPolicy Bypass -File $script -BuildDir build 2>&1") | Out-String
        $code = $LASTEXITCODE
        Write-Host $out
        if ($code -ne 0) { throw "$script failed under AddressSanitizer (exit code $code)" }
        if ($out -match 'ERROR: AddressSanitizer') { throw "AddressSanitizer reported an error while running $script" }
    - name: Build the Noise interop peer (flynn/noise)
      shell: pwsh
      working-directory: controller
      run: |
        go build -o ..\build\ranz-noisepeer.exe ./cmd/ranz-noisepeer
        if ($LASTEXITCODE -ne 0) { throw "go build exited with code $LASTEXITCODE" }
    - name: coretest under ASan
      shell: pwsh
      timeout-minutes: 10
      run: |
        # The crypto and session modules' tests of build_and_test (.github/scripts/coretest.ps1) on
        # the instrumented build, output and stderr captured as for vpntest above
        $script = '.github/scripts/coretest.ps1'
        $out = (cmd /c "pwsh -NoProfile -ExecutionPolicy Bypass -File $script -BuildDir build 2>&1") | Out-String
        $code = $LASTEXITCODE
        Write-Host $out
        if ($code -ne 0) { throw "$script failed under AddressSanitizer (exit code $code)" }
        if ($out -match 'ERROR: AddressSanitizer') { throw "AddressSanitizer reported an error while running $script" }
    - name: Fuzz seed replay (deterministic)
      shell: pwsh
      timeout-minutes: 10
      run: |
        ./src/fuzz/run_fuzzers.ps1 -BuildDir build -Seconds 0
    - name: Fuzz (60 s per target)
      shell: pwsh
      timeout-minutes: 30
      run: |
        ./src/fuzz/run_fuzzers.ps1 -BuildDir build -Seconds 60 -Seed 1
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fuzz-asan-artifacts
        if-no-files-found: ignore
        path: |
          build/fuzz-artifacts/
          build/fuzz-logs/
    # What a crash needs to be replayed elsewhere: the instrumented executables, their symbols
    # and the ASan runtime DLL
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: fuzz-asan-binaries
        if-no-files-found: ignore
        path: |
          build/fuzz_*.exe
          build/fuzz_*.pdb
          build/vpntest.exe
          build/vpntest.pdb
          build/clang_rt.asan_dynamic*.dll

  # The coverage floor of the new core (ADR-0040 item 2), x64: coretest and vpntest built with
  # RANZ_COVERAGE (cmake/RanzCoverage.cmake, the coverage preset) run the tests of
  # .github/scripts/coretest.ps1 and the transport test of vpntest (the transport module's, CORE-F4
  # #64), llvm-cov counts the lines of each module of src/Core over both programs, and a module below
  # its floor in .github/quality/coverage-floors.txt, or a file of src/Core in no module, fails the job.
  coverage:
    runs-on: windows-latest
    name: coverage (new core)
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: controller/go.sum
    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-none
        restore-keys: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-
    - name: Pick clang-cl with llvm-profdata, llvm-cov and the profile runtime
      shell: pwsh
      run: |
        # Visual Studio's clang-cl first (the compiler of build_and_test), the runner's standalone LLVM
        # second. A toolchain is taken only if its bin directory has llvm-profdata and llvm-cov, which
        # must be of the compiler's release to read its profiles, and its runtime directory has the
        # profile runtime that cmake/RanzCoverage.cmake links.
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
        foreach ($cc in @("$vs\VC\Tools\Llvm\x64\bin\clang-cl.exe", "$env:ProgramFiles\LLVM\bin\clang-cl.exe")) {
          if (-not (Test-Path -LiteralPath $cc)) { continue }
          $bin = Split-Path -Parent $cc
          $tools = @(@('llvm-profdata.exe', 'llvm-cov.exe') | Where-Object { -not (Test-Path -LiteralPath (Join-Path $bin $_)) })
          $dirs = @((& $cc -print-runtime-dir | Out-String).Trim(), (Join-Path (& $cc -print-resource-dir | Out-String).Trim() 'lib\windows'))
          foreach ($rt in $dirs) {
            if (-not (Test-Path -LiteralPath $rt)) { Write-Host "$cc -> $rt (does not exist)"; continue }
            $lib = @(@('clang_rt.profile-x86_64.lib', 'clang_rt.profile.lib') | Where-Object { Test-Path -LiteralPath (Join-Path $rt $_) })
            Write-Host "$cc -> $rt (profile runtime: $($lib -join ', '); missing tools: $($tools -join ', '))"
            if ($lib.Count -gt 0 -and $tools.Count -eq 0) {
              & $cc --version
              "COMPILER_PATH=$cc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "RANZ_RT_DIR=$rt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "LLVM_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              exit 0
            }
          }
        }
        throw 'No clang-cl with llvm-profdata, llvm-cov and the profile runtime found'
    - name: Build coretest and vpntest (RANZ_COVERAGE=ON)
      run: |
        if not exist "%VCPKG_BINCACHE%" mkdir "%VCPKG_BINCACHE%"

        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
        if "%VSINSTALL%"=="" (
          echo Visual Studio installation was not found.
          exit /b 1
        )

        call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
        rem COMPILER_PATH is the clang-cl picked by the step above
        cmake --preset coverage -DCMAKE_C_COMPILER="%COMPILER_PATH%"
        if errorlevel 1 exit /b 1
        cmake --build --preset coverage --target coretest vpntest
      shell: cmd
    - name: Build the Noise interop peer (flynn/noise)
      shell: pwsh
      working-directory: controller
      run: |
        go build -o ..\build\ranz-noisepeer.exe ./cmd/ranz-noisepeer
        if ($LASTEXITCODE -ne 0) { throw "go build exited with code $LASTEXITCODE" }
    - name: Core tests with coverage
      shell: pwsh
      timeout-minutes: 10
      run: |
        $dir = Join-Path $PWD 'build\coverage'
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        # One profile per process (%p, the process id): coretest.ps1 runs each test in a process of its own
        $env:LLVM_PROFILE_FILE = Join-Path $dir 'coretest-%p.profraw'
        . .github/scripts/coretest.ps1
        # The transport module's test is vpntest's, run by the smoke test script of build_and_test
        $env:LLVM_PROFILE_FILE = Join-Path $dir 'vpntest-%p.profraw'
        $env:RANZ_SMOKE_TESTS = 'transport'
        . .github/scripts/vpntest.ps1
    - name: Coverage floor
      if: ${{ !cancelled() }}
      shell: pwsh
      run: |
        $raw = @(Get-ChildItem -LiteralPath build\coverage -Filter '*.profraw' | ForEach-Object { $_.FullName })
        if ($raw.Count -eq 0) { throw 'coretest and vpntest wrote no .profraw file' }
        & "$env:LLVM_BIN\llvm-profdata.exe" merge -sparse @raw -o build\coverage\core.profdata
        if ($LASTEXITCODE -ne 0) { throw "llvm-profdata exited with code $LASTEXITCODE" }
        # The lines of each file of the new core in the job log, then the JSON that the floor check reads, over
        # both programs: a module that both link counts the lines that either ran
        & "$env:LLVM_BIN\llvm-cov.exe" report -instr-profile build\coverage\core.profdata build\coretest.exe -object build\vpntest.exe src\Core
        & "$env:LLVM_BIN\llvm-cov.exe" export -summary-only -instr-profile build\coverage\core.profdata build\coretest.exe -object build\vpntest.exe | Set-Content -LiteralPath build\coverage\core.json -Encoding utf8NoBOM
        if ($LASTEXITCODE -ne 0) { throw "llvm-cov exited with code $LASTEXITCODE" }
        python .github/scripts/coverage-floor.py llvm --export build/coverage/core.json --scope src/Core
        if ($LASTEXITCODE -ne 0) { throw "a module of the new core is below its coverage floor (exit code $LASTEXITCODE)" }
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: coverage-core
        if-no-files-found: ignore
        path: |
          build/coverage/core.json
          build/coverage/core.profdata

  # The C static analysis of the new core (ADR-0040 item 3), x64: clang-tidy with the checks of
  # .github/quality/clang-tidy.yaml on every .c file of src/Core, over the compile commands of the x64
  # build, and MSVC /analyze, which checks the SAL annotations of the Windows SDK and of the code, on a
  # cl.exe build of the new core's modules (corecrypto, corenoise, corepeer, coretransport). A finding
  # that the baseline of its tool in .github/quality does not hold fails the job
  # (.github/scripts/static-findings.py). The third-party libraries of the peer module
  # (src/Core/3rdparty: libjuice, libplum), which that build compiles too, are not the new core's code
  # and do not count.
  static-analysis:
    runs-on: windows-latest
    name: static analysis (new core)
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-none
        restore-keys: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-
    - name: clang-tidy
      run: |
        if not exist "%VCPKG_BINCACHE%" mkdir "%VCPKG_BINCACHE%"

        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
        if "%VSINSTALL%"=="" (
          echo Visual Studio installation was not found.
          exit /b 1
        )

        call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
        set "CLANG_TIDY=%VSINSTALL%\VC\Tools\Llvm\x64\bin\clang-tidy.exe"
        "%CLANG_TIDY%" --version
        if errorlevel 1 exit /b 1
        rem The compile commands of the x64 build (build_and_test's compiler); configured, not built
        cmake --preset x64 -DCMAKE_C_COMPILER="%VSINSTALL%\VC\Tools\Llvm\x64\bin\clang-cl.exe" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        if errorlevel 1 exit /b 1

        rem The planted finding (.github\scripts\static-fault.c) must be reported as new
        "%CLANG_TIDY%" --config-file=.github\quality\clang-tidy.yaml .github\scripts\static-fault.c -- -std=c17 > build\clang-tidy-planted.txt 2>&1
        python .github\scripts\static-findings.py --tool clang-tidy --log build\clang-tidy-planted.txt --baseline .github\quality\clang-tidy-baseline.txt --scope .github/scripts
        if not errorlevel 1 (
          type build\clang-tidy-planted.txt
          echo ::error::clang-tidy did not report the planted finding of .github\scripts\static-fault.c
          exit /b 1
        )

        if exist build\clang-tidy.txt del build\clang-tidy.txt
        for %%f in (src\Core\*.c) do (
          echo clang-tidy %%f
          "%CLANG_TIDY%" -p build --config-file=.github\quality\clang-tidy.yaml "%%f" >> build\clang-tidy.txt 2>&1
        )
        type build\clang-tidy.txt
        rem A file that clang-tidy could not process gives no findings: that fails too
        findstr /C:"Error while" build\clang-tidy.txt
        if not errorlevel 1 exit /b 1
        python .github\scripts\static-findings.py --tool clang-tidy --log build\clang-tidy.txt --baseline .github\quality\clang-tidy-baseline.txt --scope src/Core --exclude src/Core/3rdparty
      shell: cmd
    - name: MSVC /analyze
      if: ${{ !cancelled() }}
      run: |
        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
        call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
        if not exist build-msvc mkdir build-msvc

        rem The planted finding (.github\scripts\static-fault.c) must be reported as new
        cl /nologo /analyze /c /Fobuild-msvc\static-fault.obj .github\scripts\static-fault.c > build-msvc\analyze-planted.txt 2>&1
        python .github\scripts\static-findings.py --tool msvc --log build-msvc\analyze-planted.txt --baseline .github\quality\msvc-analyze-baseline.txt --scope .github/scripts
        if not errorlevel 1 (
          type build-msvc\analyze-planted.txt
          echo ::error::MSVC /analyze did not report the planted finding of .github\scripts\static-fault.c
          exit /b 1
        )

        rem cl.exe in a build directory of its own, with CMake's default C flags and /analyze, which
        rem defines _PREFAST_ and so checks the SAL annotations
        cmake -S . -B build-msvc -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_C_COMPILER=cl -DBUILD_NUMBER=0 "-DCMAKE_C_FLAGS=/DWIN32 /D_WINDOWS /analyze"
        if errorlevel 1 exit /b 1

        cmake --build build-msvc --target corecrypto corenoise corepeer coretransport > build-msvc\analyze.txt 2>&1
        set BUILD_EXIT=%ERRORLEVEL%
        type build-msvc\analyze.txt
        if not "%BUILD_EXIT%"=="0" exit /b %BUILD_EXIT%
        python .github\scripts\static-findings.py --tool msvc --log build-msvc\analyze.txt --baseline .github\quality\msvc-analyze-baseline.txt --scope src/Core --exclude src/Core/3rdparty
      shell: cmd
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: static-analysis
        if-no-files-found: ignore
        path: |
          build/clang-tidy.txt
          build-msvc/analyze.txt

  # Application Verifier (ADR-0040 item 4), x64: the native Windows tool for locks, handles and the
  # heap, which stands in for ThreadSanitizer (not available on Windows). It is a feature of the
  # Windows SDK, which the runner image has; on an image without it the job adds it with the SDK
  # installer. The job runs a planted fault (.github/scripts/appverif-fault.c), then the tests of
  # coretest under the Heaps, Handles and Locks layers (.github/scripts/appverif.ps1). An unreported
  # planted fault, a failed test or a verifier error fails the job. go test -race covers the Go code
  # (controller.yml, ranz-bgp.yml).
  appverif:
    runs-on: windows-latest
    name: Application Verifier (new core)
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: controller/go.sum
    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-none
        restore-keys: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-
    - name: Build coretest and the planted fault
      run: |
        if not exist "%VCPKG_BINCACHE%" mkdir "%VCPKG_BINCACHE%"

        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
        if "%VSINSTALL%"=="" (
          echo Visual Studio installation was not found.
          exit /b 1
        )

        call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
        cmake --preset x64 -DCMAKE_C_COMPILER="%VSINSTALL%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
        if errorlevel 1 exit /b 1
        cmake --build --preset x64 --target coretest
        if errorlevel 1 exit /b 1
        cl /nologo /W3 /Fobuild\appverif-fault.obj /Febuild\appverif-fault.exe .github\scripts\appverif-fault.c
      shell: cmd
    - name: Build the Noise interop peer (flynn/noise)
      shell: pwsh
      working-directory: controller
      run: |
        go build -o ..\build\ranz-noisepeer.exe ./cmd/ranz-noisepeer
        if ($LASTEXITCODE -ne 0) { throw "go build exited with code $LASTEXITCODE" }
    - name: Install Application Verifier
      shell: pwsh
      timeout-minutes: 15
      run: |
        $appverif = Join-Path $env:windir 'System32\appverif.exe'
        if (-not (Test-Path -LiteralPath $appverif)) {
          # The Application Verifier feature of the Windows SDK (OptionId.AvrfExternal), added with the
          # SDK installer that the runner image keeps in its package cache, as the image adds the
          # debuggers feature; without one, with the installer of the SDK that the image installs
          $sdk = Get-ItemProperty 'HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object { $_.BundleCachePath -and $_.DisplayName -like 'Windows Software Development Kit*' } |
            Sort-Object -Property DisplayVersion -Descending | Select-Object -First 1
          $installer = if ($sdk -and (Test-Path -LiteralPath $sdk.BundleCachePath)) { $sdk.BundleCachePath } else { $null }
          if (-not $installer) {
            $installer = Join-Path $env:RUNNER_TEMP 'winsdksetup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2349110' -OutFile $installer
          }
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "$installer is not signed by Microsoft ($($signature.Status), $($signature.SignerCertificate.Subject))"
          }
          Write-Host "Adding OptionId.AvrfExternal with $installer ($($sdk.DisplayName) $($sdk.DisplayVersion))"
          $p = Start-Process -FilePath $installer -ArgumentList '/features', 'OptionId.AvrfExternal', '/q', '/norestart', '/ceip', 'off' -Wait -PassThru
          Write-Host "The SDK installer exited with code $($p.ExitCode)"
          if (-not (Test-Path -LiteralPath $appverif)) {
            Get-ChildItem -Path $env:TEMP -Recurse -Filter '*.log' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'sdk|Avrf|Verifier' } |
              Sort-Object LastWriteTime -Descending | Select-Object -First 2 | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -Tail 40 }
            throw "$appverif is not there after the SDK installer"
          }
        }
        (Get-Item -LiteralPath $appverif).VersionInfo | Format-List FileVersion, ProductName
    - name: coretest under Application Verifier
      shell: pwsh
      timeout-minutes: 20
      run: |
        ./.github/scripts/appverif.ps1 -BuildDir build -FaultExe build\appverif-fault.exe
        if ($LASTEXITCODE -ne 0) { throw "Application Verifier gate failed (exit code $LASTEXITCODE)" }
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: appverif-logs
        if-no-files-found: ignore
        path: build/appverif/

  # The release-only hardened variant (SEC-4 #282, ADR-0036), x64 only. Builds with RANZ_HARDENED=ON so
  # ranzguard is built next to the clean binaries, then asserts the four acceptance criteria of #282 in
  # CI: both variants build; the release variant has an empty import table and no RWX page and never
  # writes into ntdll; the VMProtect markers wrap only the licence-gate and key-handling routines; and
  # the release variant degrades or deceives under a debugger instead of crashing.
  harden:
    runs-on: windows-latest
    name: harden (ranzguard)
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-none
        restore-keys: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-
    - name: Build (RANZ_HARDENED=ON)
      run: |
        if not exist "%VCPKG_BINCACHE%" mkdir "%VCPKG_BINCACHE%"

        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
        if "%VSINSTALL%"=="" (
          echo Visual Studio installation was not found.
          exit /b 1
        )

        call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
        set "COMPILER_PATH=%VSINSTALL%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
        rem The clean binaries (vpnserver for the clean-variant check, vpntest for the debugger test) and
        rem the release-only ranzguard, in one build. VCPKG_APPLOCAL_DEPS is off: the static triplet copies
        rem no DLLs, and the per-target applocal step otherwise contends on the installed bin dir when
        rem several targets link at once ("the process cannot access the file because it is being used by
        rem another process").
        cmake --preset hardened -DCMAKE_C_COMPILER="%COMPILER_PATH%" -DBUILD_NUMBER=%GITHUB_RUN_NUMBER% -DVCPKG_APPLOCAL_DEPS=OFF
        if errorlevel 1 exit /b 1
        rem One target per build call, so the three executables never link at the same moment and never
        rem contend on an output file
        cmake --build --preset hardened --target ranzguard
        if errorlevel 1 exit /b 1
        cmake --build --preset hardened --target vpnserver
        if errorlevel 1 exit /b 1
        cmake --build --preset hardened --target vpntest
      shell: cmd
    - name: Save vcpkg binary cache
      if: ${{ !cancelled() }}
      uses: actions/cache/save@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('vcpkg-bincache/**') }}
    # Acceptance criterion 2: the release variant has an empty import table (dynamic API resolution) and
    # no section that is both executable and writable (the RWX page that trips HVCI and EDR)
    - name: ranzguard is hardened (empty import table, no RWX)
      shell: pwsh
      run: |
        python .github/scripts/harden-check.py pe --binary build/ranzguard.exe
        if ($LASTEXITCODE -ne 0) { throw "ranzguard.exe failed the hardened PE checks (exit $LASTEXITCODE)" }
    # Acceptance criterion 2 (the ntdll and RWX properties at the source) and criterion 4 (selective
    # VMProtect): the source allocates no RWX page and writes into no module, and the markers wrap only
    # the two protected routines
    - name: ranzguard source safety and VMProtect marker placement
      shell: pwsh
      run: |
        python .github/scripts/harden-check.py safety --source src/guard/ranzguard.c
        if ($LASTEXITCODE -ne 0) { throw "ranzguard source safety check failed (exit $LASTEXITCODE)" }
        python .github/scripts/harden-check.py markers --source src/guard/ranzguard.c
        if ($LASTEXITCODE -ne 0) { throw "ranzguard VMProtect marker check failed (exit $LASTEXITCODE)" }
    # Acceptance criterion 1: the clean variant carries no obfuscation (an ordinary import table, no
    # VMProtect section)
    - name: Clean variant carries no obfuscation
      shell: pwsh
      run: |
        python .github/scripts/harden-check.py clean --binary build/vpnserver.exe
        if ($LASTEXITCODE -ne 0) { throw "vpnserver.exe is not a clean, unobfuscated binary (exit $LASTEXITCODE)" }
    # Acceptance criterion 3: run the release variant under a debugger and assert the degrade-or-deceive
    # response (it reports locked, never crashes), and that it reports unlocked when unwatched. The
    # harden self-test of vpntest drives both paths through the Win32 debug API.
    - name: Degrade-or-deceive under a debugger
      timeout-minutes: 10
      shell: pwsh
      env:
        RANZ_SMOKE_TESTS: harden
      run: |
        . .github/scripts/vpntest.ps1
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        if-no-files-found: warn
        name: ranzguard-x64
        path: |
          build/ranzguard.exe
          build/ranzguard.pdb

  # Debug configuration, built without running anything: the code that build_and_test
  # (RelWithDebInfo) never compiles, under _DEBUG (Microsoft.c and vpncmd.c) and without
  # WIN32_NO_DEBUG_HELP_DLL (the DbgHelp call stacks of Win32.c), with the Debug definitions of
  # cmake/RanzOptions.cmake. x64 and arm64: Win32GetCallStack captures with CaptureStackBackTrace,
  # which needs no machine type.
  debug:
    strategy:
      fail-fast: false
      matrix:
        platform: [
          { ARCHITECTURE: x64, VCPKG_TRIPLET: "x64-windows-static", RUNNER: "windows-latest", PRESET: "debug"},
          { ARCHITECTURE: arm64, VCPKG_TRIPLET: "arm64-windows-static", RUNNER: "windows-11-arm", PRESET: "debug-arm64"}
        ]
    runs-on: ${{ matrix.platform.RUNNER }}
    name: ${{ matrix.platform.ARCHITECTURE }} Debug (build only)
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-${{ matrix.platform.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json') }}-none
        restore-keys: vcpkg-bin-${{ matrix.platform.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json') }}-
    - name: Build (Debug)
      env:
        ARCHITECTURE: ${{ matrix.platform.ARCHITECTURE }}
        PRESET: ${{ matrix.platform.PRESET }}
      run: |
        if not exist "%VCPKG_BINCACHE%" mkdir "%VCPKG_BINCACHE%"

        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
        if "%VSINSTALL%"=="" (
          echo Visual Studio installation was not found.
          exit /b 1
        )

        if /i "%ARCHITECTURE%"=="x64" (
          set "VCVARS_PATH=%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "COMPILER_PATH=%VSINSTALL%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
        ) else if /i "%ARCHITECTURE%"=="arm64" (
          set "VCVARS_PATH=%VSINSTALL%\VC\Auxiliary\Build\vcvarsarm64.bat"
          set "COMPILER_PATH=%VSINSTALL%\VC\Tools\Llvm\ARM64\bin\clang-cl.exe"
        ) else (
          echo Unsupported architecture: %ARCHITECTURE%
          exit /b 1
        )

        call "%VCVARS_PATH%"
        rem PRESET is the Debug preset of the architecture (CMakePresets.json: debug, debug-arm64)
        cmake --preset %PRESET% -DCMAKE_C_COMPILER="%COMPILER_PATH%"
        if errorlevel 1 exit /b 1
        cmake --build --preset %PRESET%
      shell: cmd

  # Layout drift check (spec #24, pass 11): every file that format_check.py lists must already be
  # formatted by the committed .clang-format, with the clang-format version that format.yml pins.
  # It needs only Python, so it runs on Linux like the reformat itself.
  format:
    runs-on: ubuntu-latest
    name: format check
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Format check
      env:
        # the pin of .github/workflows/format.yml
        CLANG_FORMAT_VERSION: '22.1.8'
      run: |
        python -m pip install --disable-pip-version-check "clang-format==${CLANG_FORMAT_VERSION}"
        clang-format --version
        python .github/scripts/format_check.py files . > "$RUNNER_TEMP/files.txt"
        echo "$(wc -l < "$RUNNER_TEMP/files.txt") files in scope"
        # --Werror turns every place that clang-format would change into an error
        if ! xargs -a "$RUNNER_TEMP/files.txt" clang-format --dry-run --Werror --style=file:.clang-format; then
          echo "::error::Some files are not formatted. Fix: pip install clang-format==${CLANG_FORMAT_VERSION}, then python .github/scripts/format_check.py files | xargs clang-format -i (docs/formatting.md)"
          exit 1
        fi

  # Binary signing and the self-integrity check (SEC-3 #281, ADR-0020 and ADR-0036 amendments of
  # 2026-10-22). It takes the executables build_and_test produced, signs every shipped one and an MSI with
  # a self-signed certificate (the production Authenticode certificate is bought near release), checks each
  # signature is present, runs the self-integrity check on a signed binary (it passes) and on a copy whose
  # .text was changed (it degrades, not crashes), and checks the shipped binaries carry no symbols and the
  # package no public PDB. The Go sidecar (ranz-bgp) built with -trimpath and -ldflags "-s -w" has no
  # symbol table. .github/scripts/self-integrity.ps1.
  sign_and_integrity:
    needs: build_and_test
    runs-on: windows-latest
    name: sign and self-integrity
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: ranz-bgp/go.sum
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Download x64 binaries
      uses: actions/download-artifact@v4
      with:
        name: Binaries-x64
        path: artifacts/x64
    - name: Download arm64 binaries
      uses: actions/download-artifact@v4
      with:
        name: Binaries-arm64
        path: artifacts/arm64
    - name: Install WiX
      shell: pwsh
      run: |
        # The WiX Toolset of the MSI (ADR-0020; REL-5, #50), the same pin as .github/workflows/ranz-bgp.yml
        dotnet tool install --global wix --version 5.0.2
        if ($LASTEXITCODE -ne 0) { throw "dotnet tool install exited with code $LASTEXITCODE" }
        $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
        $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & (Join-Path $tools 'wix.exe') --version
    - name: Sign, self-integrity and symbol strip
      shell: pwsh
      run: |
        . .github/scripts/self-integrity.ps1 -X64Dir artifacts/x64 -Arm64Dir artifacts/arm64 -Wxs .github/signing/signing-proof.wxs -LicenseFile LICENSE -GoModuleDir ranz-bgp -OutDir build/signing
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: signing-proof
        if-no-files-found: warn
        retention-days: 14
        path: |
          build/signing/*.msi
          build/signing/*.cer
