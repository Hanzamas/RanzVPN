# The C build and its checks: x64 and arm64 (build_and_test), fuzz-asan, the x64 and arm64 Debug
# builds and the format check, and the quality gates of ADR-0040 for the C code: the performance
# regression gate in build_and_test, the coverage floor of the new core (coverage), clang-tidy and
# MSVC /analyze (static-analysis) and Application Verifier (appverif). The fuzz targets run in
# fuzz-asan; quality.yml checks that every parser has one. The job compat builds ranz-compat from the
# frozen Cedar of the slim fork (compat/CMakeLists.txt).
#
# Two sets of jobs, which the plan job chooses (ci-plan.yml, .github/scripts/ci-plan.py):
# - The fast set, on a pull request: the format check, build_and_test for x64 (the build with its tests
#   and gates) and the Debug build for arm64, a compile check with no tests.
# - The full set, every job here and both architectures of build_and_test and debug: on a push to master
#   or integration, every night (a schedule runs on the default branch, master), on workflow_dispatch, on a
#   pull request with the label full-ci and on a pull request that changes src/Core/Crypto*,
#   src/Core/Noise*, src/SeLow, .github/scripts/self-integrity.ps1, .github/scripts/install.ps1,
#   .github/signing, .github/msi, .github/scripts/msi-*, docs/first-test.md,
#   .github/scripts/first-test.ps1 or compat/ (SENSITIVE in ci-plan.py).
# A job that only the full set runs has needs: plan and if: needs.plan.outputs.full == 'true' (install
# follows sign_and_integrity, which it needs, and first_test and kmtest follow build_and_test and sign_and_integrity),
# and a pull request shows it as skipped. A new job
# without them runs on every pull request. A leg of a matrix that a pull request does not run is not
# created, since GitHub cannot skip one leg of a matrix. A pull request that edits a workflow, or a
# script that a job of the full set runs, should carry the label full-ci.
#
# A push to master or integration, a scheduled run and a run by hand run every job, with no path filter.
# A pull request runs the workflow when it changes a path that one of the jobs reads. The filter starts
# from every path ('**') and takes out the paths that no job here reads:
# - controller/ and ranz-bgp/, with go.mod and go.sum: the Go code of the one executable ranz
#   (ranz.yml: the controller, the BGP sidecar and the CLI). The C build builds ranz for two of its
#   steps, the default VRF tracer and the node that starts ranz bgp, and generates the nanopb code
#   of the control protocol schema in proto/ (SDN-3, #179), so a change of the schema runs both
#   workflows. controller/internal/explain and controller/cmd/ranz-explainplan are taken back in:
#   the explain conformance of build_and_test runs them against the data plane (SDN-15, #191).
# - tests/control/: the nanopb round trip of ranz.yml.
# - docs/ and every *.md file (ADRs, README.md, CONTEXT.md, CLAUDE.md). The files of src/bin/hamcore
#   are resources of the executables (cmake/RanzResources.cmake), so that directory is taken back
#   in, whatever its file names. So is docs/first-test.md: the job first_test runs the commands that
#   it holds.
# - tests/formal/: the models of the handshake that formal.yml runs with ProVerif on Linux (AUD-5, #389).
# - ranz.yml, move-only.yml, quality.yml, formal.yml and fuzz.yml (the fuzz campaign, AUD-3 #363, which builds the fuzz targets
#   itself), and the scripts that only they call.
# Every other path runs the workflow: src/, proto/, cmake/, CMakeLists.txt, CMakePresets.json, vcpkg.json,
# .gitmodules, .gitattributes, .clang-format, tests/golden/, developer_tools/stbchecker/, this file,
# the actions of .github/actions, the scripts of .github/scripts that the jobs call and the files of
# .github/quality that they read. A new top-level path also runs it until it is taken out here.
on:
  push:
    branches: [master, integration]
  schedule:
  - cron: '17 20 * * *'
  workflow_dispatch:
  pull_request:
    # labeled: the label full-ci starts the full set on a pull request that is open
    types: [opened, synchronize, reopened, labeled]
    paths:
    - '**'
    - '!controller/**'
    - 'controller/internal/explain/**'
    - 'controller/cmd/ranz-explainplan/**'
    - '!ranz-bgp/**'
    - '!go.mod'
    - '!go.sum'
    - '!tests/control/**'
    - '!docs/**'
    - '!**.md'
    - 'src/bin/hamcore/**'
    - 'docs/first-test.md'
    - '!.github/workflows/ranz.yml'
    - '!.github/scripts/controller-service.ps1'
    - '!.github/scripts/controller-hostfiles.ps1'
    - '!.github/scripts/ranz-tools.ps1'
    - '!.github/workflows/move-only.yml'
    - '!.github/scripts/move-only-check.py'
    - '!.github/scripts/move-only-check-test.py'
    - '!.github/workflows/quality.yml'
    - '!.github/scripts/fuzz-registry.py'
    - '!.github/scripts/quality-gates-test.py'
    - '!.github/workflows/fuzz.yml'
    - '!.github/scripts/fuzz-campaign.py'
    - '!.github/scripts/fuzz-campaign-test.py'
    - '!.github/scripts/fuzz-fault.c'
    - '!.github/scripts/fuzz-fault_test.go'
    - '!.github/scripts/one-binary-check.py'
    - '!.github/scripts/ci-plan-test.py'
    - '!tests/formal/**'
    - '!.github/workflows/formal.yml'
    - '!.github/scripts/formal.py'
    - '!.github/quality/fuzz-targets.txt'
    - '!.github/scripts/govulncheck-gate.py'
    - '!.github/quality/govulncheck-accepted.txt'

# A run that is not a pull request is the full set, and its name says so: Full CI: push on integration
run-name: "${{ github.event_name == 'pull_request' && github.event.pull_request.title || format('Full CI: {0} on {1}', github.event_name, github.ref_name) }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# vcpkg binary caching: built packages (OpenSSL) are stored as zip files keyed by their ABI hash in
# VCPKG_BINCACHE and kept between runs with actions/cache. The cache key carries the hash of
# vcpkg.json: its builtin-baseline pins the ports tree (the same OpenSSL and zlib on every runner),
# and a change of vcpkg.json is a cache miss, so the new versions are built, never mixed with old ones.
# VCPKG_ROOT is the vcpkg checkout of the runner image: CMakePresets.json takes the toolchain file from it.
env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_BINCACHE: ${{ github.workspace }}\vcpkg-bincache
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-bincache,readwrite
  # The Go of ranz.yml: ranz-noisepeer (controller/cmd/ranz-noisepeer), the flynn/noise end of the
  # session module's interop test (coretest noiseinterop, CORE-F2 #62), ranz, whose subcommand
  # controller and CLI are the default VRF tracer (SDN-3 #179) and whose subcommand bgp is the BGP
  # sidecar spike (CORE-S7-1, ONE-1 #310)
  GO_VERSION: '1.27.3'
  # The rqlite release of ranz.yml: the store of the controller of the default VRF tracer
  RQLITE_VERSION: 'v10.5.3'
  # The SHA-256 of its Windows archive, which ranz.yml pins too (ONE-4, #313)
  RQLITE_WIN64_SHA256: '0f4a65a603b89b9a3c2607c5de64445236856884c83aa2e865ec9142fd184118'

jobs:
  # The fast set or the full set (ci-plan.yml); the jobs below read what it decided
  plan:
    uses: ./.github/workflows/ci-plan.yml
    permissions:
      contents: read
      pull-requests: read

  build_and_test:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        # x64 on a pull request, x64 and arm64 in the full set (MATRICES in ci-plan.py)
        platform: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    runs-on: ${{ matrix.platform.RUNNER }}
    name: ${{ matrix.platform.ARCHITECTURE }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: go.sum
    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-${{ matrix.platform.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json') }}-none
        restore-keys: vcpkg-bin-${{ matrix.platform.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json') }}-
    # The official signed msquic package (the Schannel build, pinned) for the QUIC transport of the
    # new core (CORE-S1-1, #67): the headers for the build (TransportQuic.c loads the DLL at run
    # time, so it links no import library) and msquic.dll next to the test executables, for the quic
    # test. RANZ_MSQUIC_DIR is written to GITHUB_ENV for the configure below.
    - name: Fetch msquic
      shell: pwsh
      run: |
        .github/scripts/fetch-msquic.ps1 -Arch ${{ matrix.platform.ARCHITECTURE }} -DllDir "${{ github.workspace }}\build"
    # The pinned Wintun release (THIRD_PARTY.TXT) for the client role of the node (CORE-S3-1, #71): wintun.dll of the
    # architecture next to vpntest, whose client test brings up Wintun adapters (the runners have administrator rights)
    - name: Fetch Wintun
      shell: pwsh
      run: |
        .github/scripts/fetch-wintun.ps1 -Arch ${{ matrix.platform.ARCHITECTURE }} -DllDir "${{ github.workspace }}\build"
    - name: Install the nanopb generator
      uses: ./.github/actions/nanopb
    - name: Build
      env:
        ARCHITECTURE: ${{ matrix.platform.ARCHITECTURE }}
      run: |
        if not exist "%VCPKG_BINCACHE%" mkdir "%VCPKG_BINCACHE%"

        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
        if "%VSINSTALL%"=="" (
          echo Visual Studio installation was not found.
          exit /b 1
        )

        if /i "%ARCHITECTURE%"=="x64" (
          set "VCVARS_PATH=%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "COMPILER_PATH=%VSINSTALL%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
        ) else if /i "%ARCHITECTURE%"=="arm64" (
          set "VCVARS_PATH=%VSINSTALL%\VC\Auxiliary\Build\vcvarsarm64.bat"
          set "COMPILER_PATH=%VSINSTALL%\VC\Tools\Llvm\ARM64\bin\clang-cl.exe"
        ) else (
          echo Unsupported architecture: %ARCHITECTURE%
          exit /b 1
        )

        call "%VCVARS_PATH%"
        rem The preset is named after the architecture (CMakePresets.json); a job adds the compiler path of this
        rem runner, the run number and build/compile_commands.json (for the /volatile:ms check) to it
        cmake --preset %ARCHITECTURE% -DCMAKE_C_COMPILER="%COMPILER_PATH%" -DBUILD_NUMBER=%GITHUB_RUN_NUMBER% -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        if errorlevel 1 exit /b 1

        rem The compiler output goes to build\build-log.txt for the unused-code report step, then to the job log
        cmake --build --preset %ARCHITECTURE% > build\build-log.txt 2>&1
        set BUILD_EXIT=%ERRORLEVEL%
        type build\build-log.txt
        if not "%BUILD_EXIT%"=="0" exit /b %BUILD_EXIT%
        exit /b 0
      shell: cmd
    # Every Mayaqua and Cedar compile command carries /volatile:ms (cmake/RanzOptions.cmake). ARM64
    # defaults to /volatile:iso, which gives the cross-thread halt and cancel flags no acquire and
    # release semantics.
    - name: Check /volatile:ms
      shell: pwsh
      run: |
        $db = Get-Content -Raw -LiteralPath build/compile_commands.json | ConvertFrom-Json
        $own = @($db | Where-Object { $_.file -match '[\\/]src[\\/](Mayaqua|Cedar)[\\/]' })
        if ($own.Count -eq 0) { throw 'No Mayaqua or Cedar compile command in build/compile_commands.json' }
        $missing = @($own | Where-Object { $_.command -notmatch '(^|\s)[/-]volatile:ms(\s|$)' })
        $missing | ForEach-Object { Write-Host "No /volatile:ms: $($_.file)" }
        if ($missing.Count -gt 0) { throw "$($missing.Count) of $($own.Count) Mayaqua and Cedar compile commands lack /volatile:ms" }
        Write-Host "$($own.Count) Mayaqua and Cedar compile commands carry /volatile:ms (${{ matrix.platform.ARCHITECTURE }})"
    # The key is the content hash of the cache directory, so a run that built nothing new finds the key
    # taken and saves nothing (a warning, not a failure).
    - name: Save vcpkg binary cache
      if: ${{ !cancelled() }}
      uses: actions/cache/save@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-${{ matrix.platform.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('vcpkg-bincache/**') }}
    # Every unused or unreachable code warning of the build (cmake/RanzWarnings.cmake), de-duplicated:
    # in the job log under "=== unused-code report ===", in the job summary and as an artifact.
    # The kinds in RANZ_UNUSED_ERROR_FLAGS are errors and fail the Build step; the rest are informational.
    - name: Unused-code report
      if: ${{ !cancelled() }}
      shell: pwsh
      run: |
        python .github/scripts/unused-report.py --log build/build-log.txt --out build/unused-report.txt --arch ${{ matrix.platform.ARCHITECTURE }}
    - name: Upload unused-code report and build log
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: warn
        name: unused-report-${{ matrix.platform.ARCHITECTURE }}
        path: |
          build/unused-report.txt
          build/build-log.txt
    # The linker map of ranz-node (src/ranz-node/CMakeLists.txt): every object and symbol that it links, after
    # /OPT:REF dropped what nothing reaches, which the step "ranz-node links no SE-VPN code" checks. It replaces
    # the /VERBOSE report of link-verbose-<arch>, whose output CMake's link wrapper never passed on (CORE-S8-2, #576).
    - name: Upload linker map (ranz-node)
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: warn
        name: link-map-${{ matrix.platform.ARCHITECTURE }}
        path: build/ranz-node.map
    # ranz-node links no SE-VPN code of the slim fork (CORE-S8-2, #576): its linker map (src/ranz-node/CMakeLists.txt)
    # names no object of the files that CORE-S8-3 (#577) deletes, and neither ServerAccept nor ClientConnect. A name
    # is "gone", which fails the job when the map holds it, or "allowed", which the job only reports: the local bridge
    # of the slim fork, which the Hub and Session code still starts until CORE-S8-3 deletes it and turns it into
    # "gone". The map must name Node.c.obj and Hub.c.obj, so that a map of another program or in another format
    # cannot pass by matching nothing. The shared constants (the string literals ??_C@ and the numbers __real@,
    # __xmm@ and __ymm@) are left out: the linker keeps one copy of each, from whichever object it read first. It
    # reads only the map of the build, so it runs right after it, before the tests, as the check of /volatile:ms does.
    - name: ranz-node links no SE-VPN code
      shell: pwsh
      run: |
        $lines = @(Get-Content -LiteralPath build/ranz-node.map | Where-Object { $_ -notmatch '\?\?_C@|__real@|__xmm@|__ymm@' })
        foreach ($kept in 'Node', 'Hub') {
          if (-not ($lines | Where-Object { $_ -match "[\s:\\/(]$kept\.c\.obj" })) { throw "build/ranz-node.map names no $kept.c.obj: not the linker map of ranz-node" }
        }
        $checks = @(
          @{ Name = 'Listener.c.obj'; Re = '[\s:\\/(]Listener\.c\.obj'; State = 'gone' },
          @{ Name = 'ServerListener.c.obj'; Re = '[\s:\\/(]ServerListener\.c\.obj'; State = 'gone' },
          @{ Name = 'HttpListener.c.obj'; Re = '[\s:\\/(]HttpListener\.c\.obj'; State = 'gone' },
          @{ Name = 'ServerHttpListener.c.obj'; Re = '[\s:\\/(]ServerHttpListener\.c\.obj'; State = 'gone' },
          @{ Name = 'Admin*.c.obj'; Re = '[\s:\\/(]Admin[A-Za-z]*\.c\.obj'; State = 'gone' },
          @{ Name = 'Remote.c.obj'; Re = '[\s:\\/(]Remote\.c\.obj'; State = 'gone' },
          @{ Name = 'RpcField.c.obj'; Re = '[\s:\\/(]RpcField\.c\.obj'; State = 'gone' },
          @{ Name = 'Link.c.obj'; Re = '[\s:\\/(]Link\.c\.obj'; State = 'gone' },
          @{ Name = 'UdpAccel.c.obj'; Re = '[\s:\\/(]UdpAccel\.c\.obj'; State = 'gone' },
          @{ Name = 'WaterMark.c.obj'; Re = '[\s:\\/(]WaterMark\.c\.obj'; State = 'gone' },
          @{ Name = 'Server.c.obj'; Re = '[\s:\\/(]Server\.c\.obj'; State = 'gone' },
          @{ Name = 'ServerCaps.c.obj'; Re = '[\s:\\/(]ServerCaps\.c\.obj'; State = 'gone' },
          @{ Name = 'Protocol.c.obj'; Re = '[\s:\\/(]Protocol\.c\.obj'; State = 'gone' },
          @{ Name = 'ProtocolClient.c.obj'; Re = '[\s:\\/(]ProtocolClient\.c\.obj'; State = 'gone' },
          @{ Name = 'ProtocolServer.c.obj'; Re = '[\s:\\/(]ProtocolServer\.c\.obj'; State = 'gone' },
          @{ Name = 'ServerAccept'; Re = '\sServerAccept(\s|$)'; State = 'gone' },
          @{ Name = 'ClientConnect'; Re = '\sClientConnect(\s|$)'; State = 'gone' },
          @{ Name = 'Bridge.c.obj'; Re = '[\s:\\/(]Bridge\.c\.obj'; State = 'allowed' },
          @{ Name = 'BridgeWin32.c.obj'; Re = '[\s:\\/(]BridgeWin32\.c\.obj'; State = 'allowed' }
        )
        $failed = @()
        foreach ($c in $checks) {
          $hits = @($lines | Where-Object { $_ -match $c.Re })
          Write-Host ('{0,-26} {1,-8} {2} lines of the map' -f $c.Name, $c.State, $hits.Count)
          $hits | Select-Object -First 5 | ForEach-Object { Write-Host "    $($_.Trim())" }
          if ($c.State -eq 'gone' -and $hits.Count -gt 0) { $failed += $c.Name }
        }
        if ($failed.Count -gt 0) { throw "ranz-node links SE-VPN code that CORE-S8-2 cut off: $($failed -join ', ')" }
        Write-Host "build/ranz-node.map (${{ matrix.platform.ARCHITECTURE }}): none of the SE-VPN code that CORE-S8-3 deletes is linked, except the local bridge that the list still allows"
    # Source lines per directory and executable sizes, in the job log and the job summary. Never a gate.
    - name: Size metrics
      if: ${{ !cancelled() }}
      shell: pwsh
      run: |
        python .github/scripts/size-metrics.py --build-dir build --arch ${{ matrix.platform.ARCHITECTURE }}
    # The version resource of each executable (src/BuildFiles/VerScript/ver.rc.in): English (United
    # States), language 0x0409, with the file description filled in.
    - name: Version resource
      shell: pwsh
      run: |
        foreach ($exe in 'vpntest', 'ranz-node', 'coretest') {
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "build/$exe.exe").Path)
          Write-Host "${exe}.exe: Language '$($info.Language)', FileDescription '$($info.FileDescription)', FileVersion '$($info.FileVersion)'"
          if ($info.Language -ne 'English (United States)') { throw "${exe}.exe: version resource language is '$($info.Language)', not English (United States) (0x0409)" }
          if (-not $info.FileDescription) { throw "${exe}.exe: version resource has no FileDescription" }
        }
    - name: Set up .NET for stbchecker
      if: matrix.platform.ARCHITECTURE == 'x64'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Check string tables
      if: matrix.platform.ARCHITECTURE == 'x64'
      shell: pwsh
      run: |
        cd developer_tools/stbchecker
        dotnet run -- ../../src/bin/hamcore
        if ($LASTEXITCODE -ne 0) { throw "stbchecker reported differences between the string tables (exit code $LASTEXITCODE)" }
    - name: Test
      # The smoke loop takes about 11 minutes with the two of punchpath (CORE-S5-7, #413: ICE gives the pair up after 40 s,
      # and the attempts wait out their backoff); a modal alert of a broken hamcore still turns red here, not at the job limit
      timeout-minutes: 15
      shell: pwsh
      env:
        # Names build/harness-out/bench-<arch>.txt (the BENCH lines of vpntest bench)
        ARCHITECTURE: ${{ matrix.platform.ARCHITECTURE }}
        # The tests that print BENCH lines run three times, the second and third into bench-<arch>-run2.txt and -run3.txt:
        # the gate below judges the best run of each case
        RANZ_BENCH_RUNS: '3'
      run: |
        . .github/scripts/vpntest.ps1
    # The performance regression gate (ADR-0040 item 5): every BENCH case of this job (vpntest bench and
    # the other tests that print BENCH lines) against its median recorded from earlier CI runs of the
    # same architecture (.github/quality/bench-<arch>.txt). The best of the three runs of each case counts
    # (the minimum time, the maximum rate), so a run that a busy runner slowed does not fail the job; a slowdown
    # that every run shows does. A case slower than its median by more than its margin fails the job, a time
    # recorded under 50 us only above 100 us over its median; .github/scripts/bench-gate.py record makes the file anew.
    - name: Performance regression gate
      shell: pwsh
      run: |
        $arch = '${{ matrix.platform.ARCHITECTURE }}'
        python .github/scripts/bench-gate.py compare --runs 3 --medians ".github/quality/bench-$arch.txt" "build/harness-out/bench-$arch*.txt"
        if ($LASTEXITCODE -ne 0) { throw "a benchmark is slower than its recorded median allows (exit code $LASTEXITCODE)" }
    # The Egress tiers on the NAT of Windows of the internet exit of a VRF (SDN-12, #188; ADR-0025 decision 13), on x64 and
    # arm64: vpntest egressnat with node-x on the tier that the runner gives, WinNAT where Hyper-V and WinNAT are present (the
    # egress of a peer translated, the NAT network of the node set again after it was removed behind its back, nothing of the
    # node left once it is the exit of no VRF), and the proxy once a NAT network of WinNAT of another program exists, which the
    # node leaves as it was (.github/scripts/egress-nat.ps1). A step of its own, since it changes the NAT of Windows of the
    # runner; it needs only the build, so it runs after a test that failed too.
    - name: Egress on the NAT of Windows
      if: ${{ !cancelled() }}
      timeout-minutes: 10
      shell: pwsh
      run: |
        . .github/scripts/egress-nat.ps1 -BuildDir build
    # The new core's crypto module (CORE-F1, #61): known-answer tests of X25519, AES-GCM, SHA-256,
    # HMAC, HKDF and the RNG, the identity key, the ML-KEM hybrid, the certificate path and an
    # in-memory Schannel TLS 1.3 handshake; and its session module (CORE-F2, #62): the Noise_IK
    # handshake against the cacophony vector, the IKhfs handshake, the golden transcripts of the
    # session, its timers and rekey, the tunnel, and the interop with flynn/noise through
    # ranz-noisepeer. On x64 and arm64. With the peer module's ICE tests (CORE-S5-3, #79), which
    # wait about 90 s for the consent and check timers of libjuice, the step takes 10 minutes.
    - name: Build the Noise interop peer (flynn/noise)
      shell: pwsh
      working-directory: controller
      run: |
        go build -o ..\build\ranz-noisepeer.exe ./cmd/ranz-noisepeer
        if ($LASTEXITCODE -ne 0) { throw "go build exited with code $LASTEXITCODE" }
    - name: Core crypto and session tests
      timeout-minutes: 10
      shell: pwsh
      run: |
        . .github/scripts/coretest.ps1
    # The new core links no OpenSSL and no liboqs (ADR-0022, CORE-F1 #61): the linker map of
    # coretest, which links the crypto module and the system libraries only, names no object,
    # library or symbol of either. src/CMakeLists.txt checks the same at configure time
    # (ranz_core_check_links). String literals (the ??_C@ symbols) are left out: their names carry
    # the text, and coretest's messages mention the OpenSSL 3 PFX it imports.
    - name: Core links no OpenSSL or liboqs
      shell: pwsh
      run: |
        $map = Get-Content -Raw -LiteralPath build/coretest.map
        if ($map -notmatch 'corecrypto') { throw 'build/coretest.map names no corecrypto object: not the map of the crypto module' }
        if ($map -notmatch 'corenoise') { throw 'build/coretest.map names no corenoise object: not the map of the session module' }
        $hits = @([regex]::Matches($map, '(?im)^.*(openssl|libcrypto|libssl|liboqs|oqsprovider|\bOQS_|\bEVP_|\bOSSL_|\bSSL_CTX_|\bX509_new\b).*$') | ForEach-Object { $_.Value.Trim() } | Where-Object { $_ -notmatch '\?\?_C@' })
        $hits | Select-Object -First 20 | ForEach-Object { Write-Host $_ }
        if ($hits.Count -gt 0) { throw "coretest links OpenSSL or liboqs: $($hits.Count) lines of build/coretest.map" }
        Write-Host "build/coretest.map (${{ matrix.platform.ARCHITECTURE }}): corecrypto and corenoise linked, no OpenSSL or liboqs object, library or symbol"
    # The default VRF tracer (SDN-3, #179): ranz controller on a test port with rqlited as its sidecar,
    # whose first start creates VRF default and the starter rule, and two nodes of vpntest (sdntrace)
    # that join it over the control stream, get their addresses from its automatic pool and exchange
    # ICMP echo over the in-process loopback transport, also once the controller stopped, and report the
    # rate of a stream of UDP datagrams each way between them (SDN-53, #246); the API shows the
    # Generation each node acknowledged and the Capabilities that its Hello carried: the architecture
    # of the runner and the SeLow and XDP runtime that it holds (ONE-3, #312;
    # .github/scripts/sdn-tracer.ps1)
    - name: Build ranz for the default VRF tracer
      if: ${{ !cancelled() }}
      shell: pwsh
      working-directory: controller
      env:
        # ranz is pure Go; the gcc of the arm64 runner builds x64 code only, so a build with cgo fails
        # there while it assembles runtime/cgo
        CGO_ENABLED: '0'
      run: |
        go build -o ..\build\ ./cmd/ranz
        if ($LASTEXITCODE -ne 0) { throw "go build exited with code $LASTEXITCODE" }
    - name: Install rqlited for the default VRF tracer
      shell: pwsh
      run: |
        $zip = Join-Path $env:RUNNER_TEMP 'rqlite.zip'
        $dir = Join-Path $env:RUNNER_TEMP 'rqlite'
        Invoke-WebRequest -Uri "https://github.com/rqlite/rqlite/releases/download/$env:RQLITE_VERSION/rqlite-$env:RQLITE_VERSION-win64.zip" -OutFile $zip
        $sum = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
        if ($sum -ne $env:RQLITE_WIN64_SHA256) { throw "rqlite-$env:RQLITE_VERSION-win64.zip has the SHA-256 $sum, not the pinned $env:RQLITE_WIN64_SHA256" }
        Expand-Archive -Path $zip -DestinationPath $dir
        $exe = Get-ChildItem -Path $dir -Recurse -Filter 'rqlited.exe' | Select-Object -First 1
        if (-not $exe) { throw 'rqlited.exe is not in the rqlite release archive' }
        & $exe.FullName -version
        "RQLITED=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Default VRF tracer
      timeout-minutes: 10
      shell: pwsh
      run: |
        . .github/scripts/sdn-tracer.ps1 -BuildDir build -Architecture ${{ matrix.platform.ARCHITECTURE }}
    # The explain conformance (SDN-15, #191; ADR-0031 decision 8): ranz-explainplan compiles each scenario of
    # tests/explain as the controller does and writes its plan, the states of its nodes and each test packet with the
    # verdict of explain; vpntest explain runs the plans through the data plane of real nodes, which take their states
    # from a stand-in controller over their own control streams, and every packet must end where explain says, with the
    # rules that explain names. The deliberately broken scenario of tests/explain/broken must fail the suite on the
    # packets of its fault (.github/scripts/explain-conformance.ps1)
    - name: Build ranz-explainplan for the explain conformance
      shell: pwsh
      working-directory: controller
      env:
        # As ranz above: the gcc of the arm64 runner builds x64 code only
        CGO_ENABLED: '0'
      run: |
        go build -o ..\build\ranz-explainplan.exe ./cmd/ranz-explainplan
        if ($LASTEXITCODE -ne 0) { throw "go build exited with code $LASTEXITCODE" }
    - name: Explain conformance
      timeout-minutes: 10
      shell: pwsh
      run: |
        . .github/scripts/explain-conformance.ps1 -BuildDir build
    # The operations tracer (SDN-50-N, #492): the controller of the default VRF tracer with the L2 Network lan, and the harness
    # Node of vpntest opstrace, which holds lan with a switch whose members sent ARP, IPv4 and IPv6: its Hello reports the
    # Capability operations, ranz mac-table and ranz ip-table read the tables of its switch through the controller with the
    # entries that it learnt, a clear of one entry and of every entry takes them out, and the traffic that follows learns them
    # again (.github/scripts/operations-tracer.ps1). arm64 is L3 only (ADR-0022), so no Node there holds an L2 Network.
    - name: Operations tracer
      if: matrix.platform.ARCHITECTURE == 'x64'
      timeout-minutes: 10
      shell: pwsh
      run: |
        . .github/scripts/operations-tracer.ps1 -BuildDir build
    # The tray tracer (SDN-55, #248): ranz tray, the tray of a laptop, with the controller of the default VRF tracer, whose
    # Intent holds the User alice with a password, and the Node of vpntest traytrace, with the client role on a Wintun adapter,
    # the pipe of its logged-in user and no Controller settings. ranz tray status says that the Node is not signed in; ranz tray
    # login signs alice in, with tray-browser.ps1 as the browser that signs in on the authorization page, and the Node enrols:
    # it takes the keys of the Controller on its pipe and joins it, as ranz tray status and the API show; ranz tray down and up
    # turn its client role off and on; once the Node is gone, ranz tray says that the Ranz service does not run, with the exit
    # code 3 (.github/scripts/tray-tracer.ps1)
    - name: Tray tracer
      timeout-minutes: 10
      shell: pwsh
      run: |
        . .github/scripts/tray-tracer.ps1 -BuildDir build
    # The Controller behind the front door of a node on the same host (SDN-73, #352; ADR-0035), on x64 and arm64: ranz
    # controller on a test port with its handoff pipe, and the node of coretest's frontdoor test with its front door on
    # another test port, never 443. Through the front door the API answers over h2, over HTTP/1.1 and with the server name
    # of the web UI, with the Controller's own certificate, a node control stream of ranz-nodesim enrols, and once the
    # Controller is gone the front door closes the connection (.github/scripts/controller-frontdoor.ps1). It needs only
    # the build, so it runs after a test that failed too.
    - name: Build ranz-nodesim for the front door check
      if: ${{ !cancelled() }}
      shell: pwsh
      working-directory: controller
      env:
        # As ranz above: the gcc of the arm64 runner builds x64 code only
        CGO_ENABLED: '0'
      run: |
        go build -o ..\build\ranz-nodesim.exe ./cmd/ranz-nodesim
        if ($LASTEXITCODE -ne 0) { throw "go build exited with code $LASTEXITCODE" }
    - name: Controller behind the front door
      if: ${{ !cancelled() }}
      timeout-minutes: 10
      shell: pwsh
      run: |
        . .github/scripts/controller-frontdoor.ps1 -BuildDir build
    # The WireGuard Device tracer (SDN-80, #375; seam 3 of #45 as ADR-0002 amended it on 2026-10-21): the controller of the
    # default VRF tracer with a Device of Network default, the gateway Node of vpntest devicetrace on the wireguard.dll of
    # the pinned WireGuardNT SDK (THIRD_PARTY.TXT) and a Wintun adapter, the overlay host on its other node, and
    # ranz-wgpeer, a stock WireGuard client on wireguard-go and its netstack with the key of the Device: the handshake, a
    # ping and a TCP connection through the gateway, a second Device of the gateway that the first reaches while the policy
    # lets them meet, a Device of the other node, a gateway too, that the first reaches through the overlay, the same pings
    # blocked by a deny rule of their ICMP while the TCP connection to the Device of the other gateway goes through, the last
    # handshake and the traffic in ranz get devices, and the gateway on UDP 51820 and on the port that its Node sets; and
    # a Device whose keys the controller makes (SDN-82, #377): the client takes the configuration that ranz device create
    # printed, with the PresharedKey in it, and completes its handshake, while the same configuration without that line gets
    # none, and the client of the Device once it is revoked gets none either (.github/scripts/device-tracer.ps1)
    - name: Fetch WireGuardNT
      shell: pwsh
      run: |
        .github/scripts/fetch-wireguard.ps1 -Arch ${{ matrix.platform.ARCHITECTURE }} -DllDir "${{ github.workspace }}\build" -ShowLicence
    - name: Build the stock WireGuard client of the Device tracer (wireguard-go)
      shell: pwsh
      working-directory: controller
      env:
        # As ranz above: the gcc of the arm64 runner builds x64 code only
        CGO_ENABLED: '0'
      run: |
        go build -o ..\build\ranz-wgpeer.exe ./cmd/ranz-wgpeer
        if ($LASTEXITCODE -ne 0) { throw "go build exited with code $LASTEXITCODE" }
    - name: WireGuard Device tracer
      timeout-minutes: 10
      shell: pwsh
      run: |
        . .github/scripts/device-tracer.ps1 -BuildDir build
    # The exploit-mitigation flags of ADR-0039 decision 1 (SEC-1, #279) on the node, the shipped
    # executable of the new core, read from the binary with dumpbin: CFG, CET (x64), high-entropy
    # ASLR, DEP, /GS and /sdl, or an exception that says why not (.github/scripts/binary-hardening.ps1).
    # ranz-noisepeer, a Go test tool built without them, must fail the gate.
    - name: Binary hardening
      shell: pwsh
      run: |
        ./.github/scripts/binary-hardening.ps1 -Path build\ranz-node.exe -Unhardened build\ranz-noisepeer.exe
    # When a step fails: what the build asked the linker for, next to what the gate read from the
    # binary. The link command of ranz-node (ninja -t commands; its response file holds the objects
    # and libraries) and the link variables of its build statement in build.ninja.
    - name: Link command of ranz-node
      if: failure()
      shell: pwsh
      run: |
        $ninja = (Select-String -LiteralPath build\CMakeCache.txt -Pattern '^CMAKE_MAKE_PROGRAM:\w+=(.+)$').Matches[0].Groups[1].Value
        & $ninja -C build -t commands ranz-node.exe | Select-Object -Last 1
        (Select-String -LiteralPath build\build.ninja -Pattern '^build ranz-node\.exe:' -Context 0, 20).Context.PostContext | Where-Object { $_ -match '^\s+LINK_' }
    # The Windows spike of the BGP sidecar (ADR-0010, CORE-S7-1 #82; ONE-1 #310), on x64 and arm64: ranz
    # built next to vpntest, where the node looks for it and starts it as ranz bgp, GoBGP's own gobgpd as
    # the router of the operator on 127.0.0.1, and vpntest bgp: BGP on TCP 179, a prefix announced and
    # withdrawn, a learned route installed through IP Helper and removed again, no sidecar on a node
    # without BGP peers, and the sidecar of a node with them started as ranz bgp; then vpntest evpn, the
    # EVPN of a gateway (SDN-25 #201): two VRFs with the same prefixes handed to a fabric as EVPN type-5
    # routes between the sidecars of two nodes, and VXLAN both ways between the overlay and a harness VTEP
    - name: BGP sidecar spike
      timeout-minutes: 15
      shell: pwsh
      run: |
        . .github/scripts/bgp-spike.ps1 -BuildDir build
    # The BGP peering of the standard mode between three nodes (SDN-77, #357), on x64 and arm64: ranz built next to
    # vpntest, where each node starts its own sidecar as ranz bgp on TCP 179 of a loopback address of its own, and vpntest
    # peering: the full mesh of two VRFs with what each node learns and the forwarding tables that take it, a session from
    # an address that the Controller did not name refused and counted, the peering of a VRF removed and back, and the routes
    # of a node whose sidecar stops answering, and of a node that stops, gone from the other two within the hold time; and
    # vpntest bgpboth: the sidecar of the operator on TCP 179 of every address and the sidecar of the peering on TCP 179 of
    # 127.0.0.2, and of ::1, of one host, in either order of start (SDN-77-R1, #531) (.github/scripts/bgp-peering.ps1). It
    # needs only the build, so it runs after a test that failed too.
    - name: BGP peering of the standard mode
      if: ${{ !cancelled() }}
      timeout-minutes: 15
      shell: pwsh
      run: |
        . .github/scripts/bgp-peering.ps1 -BuildDir build
    # The mimic transport of a node (ADR-0023; CORE-P2-6 #406), on x64 and arm64: ranz built next to vpntest, where the
    # node starts it as ranz mimic for the server role and the client role, and vpntest mimic: a Noise session over
    # REALITY on 127.0.0.1 between two nodes, the binding, a prober spliced to the decoy, the restart of a killed
    # sidecar, the counters, and the REALITY private key in no log, command line or diagnostics bundle
    # (.github/scripts/mimic-sidecar.ps1). It needs only the build, so it runs after a test that failed too.
    - name: Mimic transport
      if: ${{ !cancelled() }}
      timeout-minutes: 15
      shell: pwsh
      run: |
        . .github/scripts/mimic-sidecar.ps1 -BuildDir build
    # The ACME source of the Listener of a node (SDN-45, #238), on x64 and arm64: ranz built next to vpntest, where the
    # node starts it as ranz acme, Pebble, the test ACME server of Let's Encrypt, at a pinned version on this runner, and
    # vpntest listeneracme: the certificate of the Listener issued and renewed, and the front door listening with it
    # (.github/scripts/listener-acme.ps1). It needs only the build, so it runs after a test that failed too.
    - name: Listener with ACME
      if: ${{ !cancelled() }}
      timeout-minutes: 15
      shell: pwsh
      run: |
        . .github/scripts/listener-acme.ps1 -BuildDir build
    # The ACME source of the certificate of the Controller (SDN-92, #397), on x64 and arm64, with the same Pebble: the
    # Controller serves the chain that the service issued for its own key, keeps it across a restart and renews it
    # (.github/scripts/controller-acme.ps1, TestServesACertificateOfAnACMEService of controller/internal/servercert).
    - name: Controller certificate with ACME
      if: ${{ !cancelled() }}
      timeout-minutes: 15
      shell: pwsh
      run: |
        . .github/scripts/controller-acme.ps1 -BuildDir build
    # The self-check of vpncmd (/TOOLS /CMD Check) left with vpncmd (CORE-S8-1, #84): ranz doctor runs its six checks
    # in ranz.yml (.github/scripts/ranz-tools.ps1; SDN-53, #246).
    # vpntest trace without and inside an ETW trace session on the Debug() TraceLogging provider (ticket #92).
    # The session's .etl file is kept in build/harness-out/.
    - name: ETW trace session
      timeout-minutes: 5
      shell: pwsh
      run: |
        . .github/scripts/etw-trace.ps1
    # ranz-node installed and started as the ranzvpnserver service, restarted, stopped and uninstalled
    # (.github/scripts/service-eventlog.ps1): its start and stop entries in the Application event log (ticket #92); no
    # firewall rule added, deleted or changed by /install, the start, the restart or /uninstall, judged by the rules that
    # Windows Firewall reports, and no cscript.exe or wscript.exe started by the program, read from an ETW trace session
    # (ticket #47, criterion 2); and no VBScript firewall path in the sources of src/Mayaqua, src/Cedar, src/Core and
    # src/ranz-node (criterion 5). The checks of the rule and of the script host left with vpnserver (CORE-S8-1, #84) and
    # are back against ranz-node (CORE-S8-1-R1, #575). Each fails on a planted fault first: on data, on a real rule and on a
    # real process start. quality.yml runs the script on Linux, with the fixtures of the source scan (quality-gates-test.py).
    # The nodesvc test of vpntest checks the install, the roles and the stop of the service.
    - name: Service events, firewall rules and script hosts of the Node
      timeout-minutes: 10
      shell: pwsh
      run: |
        . .github/scripts/service-eventlog.ps1
    - name: Upload harness outputs (golden bootstrap and diffs)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: ignore
        name: harness-out-${{ matrix.platform.ARCHITECTURE }}
        path: build/harness-out/
    - uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        name: Binaries-${{ matrix.platform.ARCHITECTURE }}
        path: |
          build/*.exe
          build/*.pdb

  # AddressSanitizer + libFuzzer (x64 only: Microsoft documents ASan on Windows for x86 and x64).
  # Builds with -DRANZ_ASAN=ON -DRANZ_FUZZ=ON (cmake/RanzSanitizers.cmake), runs the vpntest
  # smoke test script on that build, replays the seed corpora (deterministic), then runs every
  # fuzz target of src/fuzz for a fixed time. Any of the three failing fails the job.
  # The steps before the fuzz step take about 12 minutes, and the fuzz step has 45 (below).
  fuzz-asan:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: windows-latest
    name: fuzz-asan
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: go.sum
    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-none
        restore-keys: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-
    - name: Pick clang-cl with the one-DLL ASan runtime and libFuzzer
      shell: pwsh
      run: |
        # Visual Studio's clang-cl first (the compiler of build_and_test), the runner's standalone
        # LLVM second. A toolchain is taken only if its runtime directory holds the libraries
        # cmake/RanzSanitizers.cmake links: the one-DLL ASan runtime of LLVM 20 and later
        # (asan_dynamic, asan_static_runtime_thunk) and libFuzzer. The static /MT runtime of
        # LLVM 19 and earlier never hooks HeapAlloc (Mayaqua's allocator), so it is not accepted.
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
        $libs = @('asan_dynamic', 'asan_static_runtime_thunk', 'fuzzer')
        foreach ($cc in @("$vs\VC\Tools\Llvm\x64\bin\clang-cl.exe", "$env:ProgramFiles\LLVM\bin\clang-cl.exe")) {
          if (-not (Test-Path -LiteralPath $cc)) { continue }
          # Official LLVM builds for Windows keep compiler-rt in <resource-dir>\lib\windows (one file per
          # architecture), others in the per-target -print-runtime-dir; try both.
          $dirs = @((& $cc -print-runtime-dir | Out-String).Trim(), (Join-Path (& $cc -print-resource-dir | Out-String).Trim() 'lib\windows'))
          foreach ($rt in $dirs) {
            if (-not (Test-Path -LiteralPath $rt)) { Write-Host "$cc -> $rt (does not exist)"; continue }
            $missing = @($libs | Where-Object {
              -not (Test-Path -LiteralPath "$rt\clang_rt.$_-x86_64.lib") -and -not (Test-Path -LiteralPath "$rt\clang_rt.$_.lib")
            })
            Write-Host "$cc -> $rt (missing: $($missing -join ', '))"
            Get-ChildItem -LiteralPath $rt -Filter 'clang_rt.*' -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { Write-Host "    $($_.Name)" }
            if ($missing.Count -eq 0) {
              & $cc --version
              "COMPILER_PATH=$cc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "RANZ_RT_DIR=$rt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              exit 0
            }
          }
        }
        throw 'No clang-cl with the one-DLL ASan runtime (LLVM 20 or later) and libFuzzer found'
    # The msquic headers for the QUIC transport of the new core (CORE-S1-1, #67). The ASan job builds
    # the transport but does not run the quic test (asan-exclude.txt leaves it out), so it needs
    # the headers, not the DLL: TransportQuic.c loads msquic.dll only when a QUIC call is made.
    - name: Fetch msquic
      shell: pwsh
      run: |
        .github/scripts/fetch-msquic.ps1 -Arch x64
    # wintun.dll next to vpntest for the client test (CORE-S3-1, #71), which runs here over TLS-443 (no msquic.dll)
    - name: Fetch Wintun
      shell: pwsh
      run: |
        .github/scripts/fetch-wintun.ps1 -Arch x64 -DllDir "${{ github.workspace }}\build"
    - name: Install the nanopb generator
      uses: ./.github/actions/nanopb
    - name: Build (RANZ_ASAN=ON, RANZ_FUZZ=ON)
      run: |
        if not exist "%VCPKG_BINCACHE%" mkdir "%VCPKG_BINCACHE%"

        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
        if "%VSINSTALL%"=="" (
          echo Visual Studio installation was not found.
          exit /b 1
        )

        call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
        rem COMPILER_PATH is the clang-cl picked by the step above
        cmake --preset asan -DCMAKE_C_COMPILER="%COMPILER_PATH%"
        if errorlevel 1 exit /b 1
        cmake --build --preset asan
      shell: cmd
    - name: Save vcpkg binary cache
      if: ${{ !cancelled() }}
      uses: actions/cache/save@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('vcpkg-bincache/**') }}
    - name: vpntest smoke test under ASan
      shell: pwsh
      # About 9 minutes with the two of punchpath (CORE-S5-7, #413), which waits for ICE and a backoff
      timeout-minutes: 15
      env:
        # Every test that vpntest lists runs, except the ones in .github/quality/smoke-exclude.txt and in
        # .github/quality/asan-exclude.txt, which gives the reason of each (a time budget that AddressSanitizer would
        # exceed, a service outside the instrumented process, msquic.dll that this job does not fetch). A new test
        # runs here without a line anywhere. noisehub runs its loopback and TLS-443 parts here; its QUIC part needs
        # msquic.dll. tls (CORE-S2-1 #69) runs on Schannel, which needs no DLL of its own; lossylink runs in virtual time.
        RANZ_SMOKE_EXCLUDE: asan
      run: |
        # The smoke test script of build_and_test itself, so both jobs run the same tests but the ones in
        # asan-exclude.txt. Its output and the vpntest stderr (AddressSanitizer reports) are captured, to also catch a
        # report printed after "NO MEMORY LEAKS".
        $script = '.github/scripts/vpntest.ps1'
        $out = (cmd /c "pwsh -NoProfile -ExecutionPolicy Bypass -File $script -BuildDir build 2>&1") | Out-String
        $code = $LASTEXITCODE
        Write-Host $out
        if ($code -ne 0) { throw "$script failed under AddressSanitizer (exit code $code)" }
        if ($out -match 'ERROR: AddressSanitizer') { throw "AddressSanitizer reported an error while running $script" }
    - name: Build the Noise interop peer (flynn/noise)
      shell: pwsh
      working-directory: controller
      run: |
        go build -o ..\build\ranz-noisepeer.exe ./cmd/ranz-noisepeer
        if ($LASTEXITCODE -ne 0) { throw "go build exited with code $LASTEXITCODE" }
    - name: coretest under ASan
      shell: pwsh
      timeout-minutes: 10
      run: |
        # The crypto and session modules' tests of build_and_test (.github/scripts/coretest.ps1) on
        # the instrumented build, output and stderr captured as for vpntest above
        $script = '.github/scripts/coretest.ps1'
        $out = (cmd /c "pwsh -NoProfile -ExecutionPolicy Bypass -File $script -BuildDir build 2>&1") | Out-String
        $code = $LASTEXITCODE
        Write-Host $out
        if ($code -ne 0) { throw "$script failed under AddressSanitizer (exit code $code)" }
        if ($out -match 'ERROR: AddressSanitizer') { throw "AddressSanitizer reported an error while running $script" }
    - name: Fuzz seed replay (deterministic)
      shell: pwsh
      timeout-minutes: 10
      run: |
        ./src/fuzz/run_fuzzers.ps1 -BuildDir build -Seconds 0
    # The targets run one after the other, about 61 s each: the 29 targets of integration 065246a1
    # took 29.6 minutes, and the 30th (fuzz_frame, SDN-87 #386) ran out of the 30 minutes that this
    # step had. 45 minutes leave room for the targets to come.
    - name: Fuzz (60 s per target)
      shell: pwsh
      timeout-minutes: 45
      run: |
        ./src/fuzz/run_fuzzers.ps1 -BuildDir build -Seconds 60 -Seed 1
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fuzz-asan-artifacts
        if-no-files-found: ignore
        path: |
          build/fuzz-artifacts/
          build/fuzz-logs/
    # What a crash needs to be replayed elsewhere: the instrumented executables, their symbols
    # and the ASan runtime DLL
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: fuzz-asan-binaries
        if-no-files-found: ignore
        path: |
          build/fuzz_*.exe
          build/fuzz_*.pdb
          build/vpntest.exe
          build/vpntest.pdb
          build/clang_rt.asan_dynamic*.dll

  # The coverage floor of the new core (ADR-0040 item 2), x64: coretest and vpntest built with
  # RANZ_COVERAGE (cmake/RanzCoverage.cmake, the coverage preset) run the tests of
  # .github/scripts/coretest.ps1 and the transport test of vpntest (the transport module's, CORE-F4
  # #64), its vxlan test (the VXLAN module's, SDN-62 #289) and its switch test (the switch module's,
  # CORE-S4-1 #74), llvm-cov counts the lines of each module of src/Core over both programs, and a
  # module below its floor in .github/quality/coverage-floors.txt, or a file of src/Core in no module,
  # fails the job.
  coverage:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: windows-latest
    name: coverage (new core)
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: go.sum
    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-none
        restore-keys: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-
    - name: Pick clang-cl with llvm-profdata, llvm-cov and the profile runtime
      shell: pwsh
      run: |
        # Visual Studio's clang-cl first (the compiler of build_and_test), the runner's standalone LLVM
        # second. A toolchain is taken only if its bin directory has llvm-profdata and llvm-cov, which
        # must be of the compiler's release to read its profiles, and its runtime directory has the
        # profile runtime that cmake/RanzCoverage.cmake links.
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
        foreach ($cc in @("$vs\VC\Tools\Llvm\x64\bin\clang-cl.exe", "$env:ProgramFiles\LLVM\bin\clang-cl.exe")) {
          if (-not (Test-Path -LiteralPath $cc)) { continue }
          $bin = Split-Path -Parent $cc
          $tools = @(@('llvm-profdata.exe', 'llvm-cov.exe') | Where-Object { -not (Test-Path -LiteralPath (Join-Path $bin $_)) })
          $dirs = @((& $cc -print-runtime-dir | Out-String).Trim(), (Join-Path (& $cc -print-resource-dir | Out-String).Trim() 'lib\windows'))
          foreach ($rt in $dirs) {
            if (-not (Test-Path -LiteralPath $rt)) { Write-Host "$cc -> $rt (does not exist)"; continue }
            $lib = @(@('clang_rt.profile-x86_64.lib', 'clang_rt.profile.lib') | Where-Object { Test-Path -LiteralPath (Join-Path $rt $_) })
            Write-Host "$cc -> $rt (profile runtime: $($lib -join ', '); missing tools: $($tools -join ', '))"
            if ($lib.Count -gt 0 -and $tools.Count -eq 0) {
              & $cc --version
              "COMPILER_PATH=$cc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "RANZ_RT_DIR=$rt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "LLVM_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              exit 0
            }
          }
        }
        throw 'No clang-cl with llvm-profdata, llvm-cov and the profile runtime found'
    # The msquic package of the QUIC transport (CORE-S1-1, #67): CMake configures only with its headers, and the
    # quic test runs against msquic.dll next to vpntest
    - name: Fetch msquic
      shell: pwsh
      run: |
        .github/scripts/fetch-msquic.ps1 -Arch x64 -DllDir "${{ github.workspace }}\build"
    # The control module (SDN-3, #179) generates its messages with nanopb at build time
    - name: Install the nanopb generator
      uses: ./.github/actions/nanopb
    - name: Build coretest and vpntest (RANZ_COVERAGE=ON)
      run: |
        if not exist "%VCPKG_BINCACHE%" mkdir "%VCPKG_BINCACHE%"

        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
        if "%VSINSTALL%"=="" (
          echo Visual Studio installation was not found.
          exit /b 1
        )

        call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
        rem COMPILER_PATH is the clang-cl picked by the step above
        cmake --preset coverage -DCMAKE_C_COMPILER="%COMPILER_PATH%"
        if errorlevel 1 exit /b 1
        cmake --build --preset coverage --target coretest vpntest
      shell: cmd
    - name: Build the Noise interop peer (flynn/noise)
      shell: pwsh
      working-directory: controller
      run: |
        go build -o ..\build\ranz-noisepeer.exe ./cmd/ranz-noisepeer
        if ($LASTEXITCODE -ne 0) { throw "go build exited with code $LASTEXITCODE" }
    - name: Core tests with coverage
      shell: pwsh
      timeout-minutes: 10
      run: |
        $dir = Join-Path $PWD 'build\coverage'
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        # One profile per process id (%p): coretest.ps1 runs each test in a process of its own. Windows hands a
        # freed process id to the next process at once, and with %p alone a later test overwrote the profile of an
        # earlier one of the same id (FIX-10, #435: the mlkem test's lines were lost); %m merges a profile into the
        # file that is there instead (online profile merging, locked between processes)
        $env:LLVM_PROFILE_FILE = Join-Path $dir 'coretest-%p-%m.profraw'
        . .github/scripts/coretest.ps1
        # The tests of the new core's modules that vpntest has (transport, quic over msquic, tls over Schannel and
        # lossylink, the ingress queue; vxlan; switch) carry the tag core (RANZ_TEST_TAGS, src/vpntest/testlist.h), which
        # its smoke test script selects; a new one is tagged in its own file
        $env:LLVM_PROFILE_FILE = Join-Path $dir 'vpntest-%p-%m.profraw'
        $env:RANZ_SMOKE_TAG = 'core'
        . .github/scripts/vpntest.ps1
    - name: Coverage floor
      if: ${{ !cancelled() }}
      shell: pwsh
      run: |
        $raw = @(Get-ChildItem -LiteralPath build\coverage -Filter '*.profraw' | ForEach-Object { $_.FullName })
        if ($raw.Count -eq 0) { throw 'coretest and vpntest wrote no .profraw file' }
        & "$env:LLVM_BIN\llvm-profdata.exe" merge -sparse @raw -o build\coverage\core.profdata
        if ($LASTEXITCODE -ne 0) { throw "llvm-profdata exited with code $LASTEXITCODE" }
        # The lines of each file of the new core in the job log, then the JSON that the floor check reads, over
        # both programs: a module that both link counts the lines that either ran
        & "$env:LLVM_BIN\llvm-cov.exe" report -instr-profile build\coverage\core.profdata build\coretest.exe -object build\vpntest.exe src\Core
        & "$env:LLVM_BIN\llvm-cov.exe" export -summary-only -instr-profile build\coverage\core.profdata build\coretest.exe -object build\vpntest.exe | Set-Content -LiteralPath build\coverage\core.json -Encoding utf8NoBOM
        if ($LASTEXITCODE -ne 0) { throw "llvm-cov exited with code $LASTEXITCODE" }
        python .github/scripts/coverage-floor.py llvm --export build/coverage/core.json --scope src/Core
        if ($LASTEXITCODE -ne 0) { throw "a module of the new core is below its coverage floor (exit code $LASTEXITCODE)" }
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: coverage-core
        if-no-files-found: ignore
        path: |
          build/coverage/core.json
          build/coverage/core.profdata

  # The C static analysis of the new core (ADR-0040 item 3), x64: clang-tidy with the checks of
  # .github/quality/clang-tidy.yaml on every .c file of src/Core, over the compile commands of the x64
  # build, and MSVC /analyze, which checks the SAL annotations of the Windows SDK and of the code, on a
  # cl.exe build of the new core's modules (corecrypto, corenoise, corepeer, coretransport, corevxlan, coreswitch,
  # corepolicy, corefrontdoor). A finding that the baseline of its tool in .github/quality does not hold fails the job
  # (.github/scripts/static-findings.py). The third-party libraries of the peer module
  # (src/Core/3rdparty: libjuice, libplum), which that build compiles too, are not the new core's code
  # and do not count.
  static-analysis:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: windows-latest
    name: static analysis (new core)
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-none
        restore-keys: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-
    # The msquic headers of the QUIC transport (CORE-S1-1, #67): CMake does not configure without them
    - name: Fetch msquic
      shell: pwsh
      run: |
        .github/scripts/fetch-msquic.ps1 -Arch x64
    # The control module (SDN-3, #179) generates its messages with nanopb at build time
    - name: Install the nanopb generator
      uses: ./.github/actions/nanopb
    - name: clang-tidy
      run: |
        if not exist "%VCPKG_BINCACHE%" mkdir "%VCPKG_BINCACHE%"

        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
        if "%VSINSTALL%"=="" (
          echo Visual Studio installation was not found.
          exit /b 1
        )

        call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
        set "CLANG_TIDY=%VSINSTALL%\VC\Tools\Llvm\x64\bin\clang-tidy.exe"
        "%CLANG_TIDY%" --version
        if errorlevel 1 exit /b 1
        rem The compile commands of the x64 build (build_and_test's compiler); configured, not built
        cmake --preset x64 -DCMAKE_C_COMPILER="%VSINSTALL%\VC\Tools\Llvm\x64\bin\clang-cl.exe" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        if errorlevel 1 exit /b 1
        rem The messages of the control module are generated by nanopb at build time, and Control.c includes them
        cmake --build --preset x64 --target corecontrol
        if errorlevel 1 exit /b 1

        rem The planted finding (.github\scripts\static-fault.c) must be reported as new
        "%CLANG_TIDY%" --config-file=.github\quality\clang-tidy.yaml .github\scripts\static-fault.c -- -std=c17 > build\clang-tidy-planted.txt 2>&1
        python .github\scripts\static-findings.py --tool clang-tidy --log build\clang-tidy-planted.txt --baseline .github\quality\clang-tidy-baseline.txt --scope .github/scripts
        if not errorlevel 1 (
          type build\clang-tidy-planted.txt
          echo ::error::clang-tidy did not report the planted finding of .github\scripts\static-fault.c
          exit /b 1
        )

        if exist build\clang-tidy.txt del build\clang-tidy.txt
        for %%f in (src\Core\*.c) do (
          echo clang-tidy %%f
          "%CLANG_TIDY%" -p build --config-file=.github\quality\clang-tidy.yaml "%%f" >> build\clang-tidy.txt 2>&1
        )
        type build\clang-tidy.txt
        rem A file that clang-tidy could not process gives no findings: that fails too
        findstr /C:"Error while" build\clang-tidy.txt
        if not errorlevel 1 exit /b 1
        python .github\scripts\static-findings.py --tool clang-tidy --log build\clang-tidy.txt --baseline .github\quality\clang-tidy-baseline.txt --scope src/Core --exclude src/Core/3rdparty
      shell: cmd
    - name: MSVC /analyze
      if: ${{ !cancelled() }}
      run: |
        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
        call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
        if not exist build-msvc mkdir build-msvc

        rem The planted finding (.github\scripts\static-fault.c) must be reported as new
        cl /nologo /analyze /c /Fobuild-msvc\static-fault.obj .github\scripts\static-fault.c > build-msvc\analyze-planted.txt 2>&1
        python .github\scripts\static-findings.py --tool msvc --log build-msvc\analyze-planted.txt --baseline .github\quality\msvc-analyze-baseline.txt --scope .github/scripts
        if not errorlevel 1 (
          type build-msvc\analyze-planted.txt
          echo ::error::MSVC /analyze did not report the planted finding of .github\scripts\static-fault.c
          exit /b 1
        )

        rem cl.exe in a build directory of its own, with CMake's default C flags and /analyze, which
        rem defines _PREFAST_ and so checks the SAL annotations
        cmake -S . -B build-msvc -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_C_COMPILER=cl -DBUILD_NUMBER=0 "-DCMAKE_C_FLAGS=/DWIN32 /D_WINDOWS /analyze"
        if errorlevel 1 exit /b 1

        cmake --build build-msvc --target corecrypto corenoise corepeer coretransport corevxlan coreswitch corepolicy corefrontdoor > build-msvc\analyze.txt 2>&1
        set BUILD_EXIT=%ERRORLEVEL%
        type build-msvc\analyze.txt
        if not "%BUILD_EXIT%"=="0" exit /b %BUILD_EXIT%
        python .github\scripts\static-findings.py --tool msvc --log build-msvc\analyze.txt --baseline .github\quality\msvc-analyze-baseline.txt --scope src/Core --exclude src/Core/3rdparty
      shell: cmd
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: static-analysis
        if-no-files-found: ignore
        path: |
          build/clang-tidy.txt
          build-msvc/analyze.txt

  # Application Verifier (ADR-0040 item 4), x64: the native Windows tool for locks, handles and the
  # heap, which stands in for ThreadSanitizer (not available on Windows). It is a feature of the
  # Windows SDK, which the runner image has; on an image without it the job adds it with the SDK
  # installer. The job runs a planted fault (.github/scripts/appverif-fault.c), then the tests of
  # coretest under the Heaps, Handles and Locks layers (.github/scripts/appverif.ps1). An unreported
  # planted fault, a failed test or a verifier error fails the job. go test -race covers the Go code
  # (ranz.yml).
  appverif:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: windows-latest
    name: Application Verifier (new core)
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: go.sum
    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-none
        restore-keys: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-
    # The msquic headers of the QUIC transport (CORE-S1-1, #67): CMake does not configure without them
    - name: Fetch msquic
      shell: pwsh
      run: |
        .github/scripts/fetch-msquic.ps1 -Arch x64
    # The control module (SDN-3, #179) generates its messages with nanopb at build time
    - name: Install the nanopb generator
      uses: ./.github/actions/nanopb
    - name: Build coretest and the planted fault
      run: |
        if not exist "%VCPKG_BINCACHE%" mkdir "%VCPKG_BINCACHE%"

        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
        if "%VSINSTALL%"=="" (
          echo Visual Studio installation was not found.
          exit /b 1
        )

        call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
        cmake --preset x64 -DCMAKE_C_COMPILER="%VSINSTALL%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
        if errorlevel 1 exit /b 1
        cmake --build --preset x64 --target coretest
        if errorlevel 1 exit /b 1
        cl /nologo /W3 /Fobuild\appverif-fault.obj /Febuild\appverif-fault.exe .github\scripts\appverif-fault.c
      shell: cmd
    - name: Build the Noise interop peer (flynn/noise)
      shell: pwsh
      working-directory: controller
      run: |
        go build -o ..\build\ranz-noisepeer.exe ./cmd/ranz-noisepeer
        if ($LASTEXITCODE -ne 0) { throw "go build exited with code $LASTEXITCODE" }
    - name: Install Application Verifier
      shell: pwsh
      timeout-minutes: 15
      run: |
        $appverif = Join-Path $env:windir 'System32\appverif.exe'
        if (-not (Test-Path -LiteralPath $appverif)) {
          # The Application Verifier feature of the Windows SDK (OptionId.AvrfExternal), added with the
          # SDK installer that the runner image keeps in its package cache, as the image adds the
          # debuggers feature; without one, with the installer of the SDK that the image installs
          $sdk = Get-ItemProperty 'HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object { $_.BundleCachePath -and $_.DisplayName -like 'Windows Software Development Kit*' } |
            Sort-Object -Property DisplayVersion -Descending | Select-Object -First 1
          $installer = if ($sdk -and (Test-Path -LiteralPath $sdk.BundleCachePath)) { $sdk.BundleCachePath } else { $null }
          if (-not $installer) {
            $installer = Join-Path $env:RUNNER_TEMP 'winsdksetup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2349110' -OutFile $installer
          }
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "$installer is not signed by Microsoft ($($signature.Status), $($signature.SignerCertificate.Subject))"
          }
          Write-Host "Adding OptionId.AvrfExternal with $installer ($($sdk.DisplayName) $($sdk.DisplayVersion))"
          $p = Start-Process -FilePath $installer -ArgumentList '/features', 'OptionId.AvrfExternal', '/q', '/norestart', '/ceip', 'off' -Wait -PassThru
          Write-Host "The SDK installer exited with code $($p.ExitCode)"
          if (-not (Test-Path -LiteralPath $appverif)) {
            Get-ChildItem -Path $env:TEMP -Recurse -Filter '*.log' -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'sdk|Avrf|Verifier' } |
              Sort-Object LastWriteTime -Descending | Select-Object -First 2 | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -Tail 40 }
            throw "$appverif is not there after the SDK installer"
          }
        }
        (Get-Item -LiteralPath $appverif).VersionInfo | Format-List FileVersion, ProductName
    - name: coretest under Application Verifier
      shell: pwsh
      timeout-minutes: 20
      run: |
        ./.github/scripts/appverif.ps1 -BuildDir build -FaultExe build\appverif-fault.exe
        if ($LASTEXITCODE -ne 0) { throw "Application Verifier gate failed (exit code $LASTEXITCODE)" }
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: appverif-logs
        if-no-files-found: ignore
        path: build/appverif/

  # The release-only hardened variant (SEC-4 #282, ADR-0036), x64 only. Builds with RANZ_HARDENED=ON so
  # ranzguard is built next to the clean binaries, then asserts the four acceptance criteria of #282 in
  # CI: both variants build; the release variant has an empty import table and no RWX page and never
  # writes into ntdll; the VMProtect markers wrap only the licence-gate and key-handling routines; and
  # the release variant degrades or deceives under a debugger instead of crashing.
  harden:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: windows-latest
    name: harden (ranzguard)
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-none
        restore-keys: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-
    # The msquic headers for the QUIC transport of the new core (CORE-S1-1, #67): the hardened build compiles
    # vpntest, which links TransportQuic.c. The job runs no quic test, so the headers are enough.
    - name: Fetch msquic
      shell: pwsh
      run: |
        .github/scripts/fetch-msquic.ps1 -Arch x64
    # vpntest links the SDN-3 tracer (sdntrace.c), whose control messages are generated by nanopb
    - name: Install the nanopb generator
      uses: ./.github/actions/nanopb
    - name: Build (RANZ_HARDENED=ON)
      run: |
        if not exist "%VCPKG_BINCACHE%" mkdir "%VCPKG_BINCACHE%"

        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
        if "%VSINSTALL%"=="" (
          echo Visual Studio installation was not found.
          exit /b 1
        )

        call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
        set "COMPILER_PATH=%VSINSTALL%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
        rem The clean binaries (ranz-node for the clean-variant check, vpntest for the debugger test) and
        rem the release-only ranzguard, in one build. VCPKG_APPLOCAL_DEPS is off: the static triplet copies
        rem no DLLs, and the per-target applocal step otherwise contends on the installed bin dir when
        rem several targets link at once ("the process cannot access the file because it is being used by
        rem another process").
        cmake --preset hardened -DCMAKE_C_COMPILER="%COMPILER_PATH%" -DBUILD_NUMBER=%GITHUB_RUN_NUMBER% -DVCPKG_APPLOCAL_DEPS=OFF
        if errorlevel 1 exit /b 1
        rem One target per build call, so the three executables never link at the same moment and never
        rem contend on an output file
        cmake --build --preset hardened --target ranzguard
        if errorlevel 1 exit /b 1
        cmake --build --preset hardened --target ranz-node
        if errorlevel 1 exit /b 1
        cmake --build --preset hardened --target vpntest
      shell: cmd
    - name: Save vcpkg binary cache
      if: ${{ !cancelled() }}
      uses: actions/cache/save@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-x64-windows-static-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('vcpkg-bincache/**') }}
    # Acceptance criterion 2: the release variant has an empty import table (dynamic API resolution) and
    # no section that is both executable and writable (the RWX page that trips HVCI and EDR)
    - name: ranzguard is hardened (empty import table, no RWX)
      shell: pwsh
      run: |
        python .github/scripts/harden-check.py pe --binary build/ranzguard.exe
        if ($LASTEXITCODE -ne 0) { throw "ranzguard.exe failed the hardened PE checks (exit $LASTEXITCODE)" }
    # Acceptance criterion 2 (the ntdll and RWX properties at the source) and criterion 4 (selective
    # VMProtect): the source allocates no RWX page and writes into no module, and the markers wrap only
    # the two protected routines
    - name: ranzguard source safety and VMProtect marker placement
      shell: pwsh
      run: |
        python .github/scripts/harden-check.py safety --source src/guard/ranzguard.c
        if ($LASTEXITCODE -ne 0) { throw "ranzguard source safety check failed (exit $LASTEXITCODE)" }
        python .github/scripts/harden-check.py markers --source src/guard/ranzguard.c
        if ($LASTEXITCODE -ne 0) { throw "ranzguard VMProtect marker check failed (exit $LASTEXITCODE)" }
    # Acceptance criterion 1: the clean variant carries no obfuscation (an ordinary import table, no
    # VMProtect section)
    - name: Clean variant carries no obfuscation
      shell: pwsh
      run: |
        python .github/scripts/harden-check.py clean --binary build/ranz-node.exe
        if ($LASTEXITCODE -ne 0) { throw "ranz-node.exe is not a clean, unobfuscated binary (exit $LASTEXITCODE)" }
    # Acceptance criterion 3: run the release variant under a debugger and assert the degrade-or-deceive
    # response (it reports locked, never crashes), and that it reports unlocked when unwatched. The
    # harden self-test of vpntest drives both paths through the Win32 debug API.
    - name: Degrade-or-deceive under a debugger
      timeout-minutes: 10
      shell: pwsh
      env:
        RANZ_SMOKE_TESTS: harden
      run: |
        . .github/scripts/vpntest.ps1
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        if-no-files-found: warn
        name: ranzguard-x64
        path: |
          build/ranzguard.exe
          build/ranzguard.pdb

  # ranz-compat (ADR-0037; SDN-L1 #207) builds from the frozen Cedar of the slim fork, which CORE-S8-3 (#577) deletes
  # from this tree: the commit of the branch frozen/cedar-se-vpn that compat/CMakeLists.txt pins by its sha (CORE-S8-2,
  # #576). The job checks that commit out with its submodules and builds compat/, which configures the tree of the
  # commit as a project of its own and builds its cedar and mayaqua libraries, with OpenSSL from vcpkg and liboqs. The
  # msquic headers and the nanopb generator of its new core come from the scripts of that commit, so that the build of
  # the frozen tree stays the one of its own time. It is a job of the full set, and compat/ is a path of SENSITIVE in
  # ci-plan.py, so a pull request that changes the pin or the build of ranz-compat runs it before it merges.
  compat:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: windows-latest
    name: ranz-compat (frozen Cedar)
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: The pinned commit of the frozen Cedar
      id: frozen
      shell: pwsh
      run: |
        $text = Get-Content -Raw -LiteralPath compat/CMakeLists.txt
        if ($text -notmatch 'set\(RANZ_FROZEN_CEDAR_SHA "([0-9a-f]{40})"\)') { throw 'compat/CMakeLists.txt pins no RANZ_FROZEN_CEDAR_SHA' }
        Write-Host "The frozen Cedar of ranz-compat: $($Matches[1])"
        "sha=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
    - uses: actions/checkout@v4
      with:
        ref: ${{ steps.frozen.outputs.sha }}
        path: frozen-cedar
        submodules: true
    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-x64-windows-static-${{ hashFiles('frozen-cedar/vcpkg.json') }}-none
        restore-keys: vcpkg-bin-x64-windows-static-${{ hashFiles('frozen-cedar/vcpkg.json') }}-
    - name: Fetch msquic
      shell: pwsh
      run: |
        frozen-cedar/.github/scripts/fetch-msquic.ps1 -Arch x64
    - name: Install the nanopb generator
      uses: ./frozen-cedar/.github/actions/nanopb
    - name: Build ranz-compat
      run: |
        if not exist "%VCPKG_BINCACHE%" mkdir "%VCPKG_BINCACHE%"

        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
        if "%VSINSTALL%"=="" (
          echo Visual Studio installation was not found.
          exit /b 1
        )

        call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
        set "COMPILER_PATH=%VSINSTALL%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
        cmake -S compat -B build-compat -G Ninja -DCMAKE_C_COMPILER="%COMPILER_PATH%" -DRANZ_FROZEN_CEDAR_DIR="%GITHUB_WORKSPACE%\frozen-cedar"
        if errorlevel 1 exit /b 1
        cmake --build build-compat
      shell: cmd

  # Debug configuration, built without running anything: the code that build_and_test
  # (RelWithDebInfo) never compiles, under _DEBUG (Microsoft.c) and without
  # WIN32_NO_DEBUG_HELP_DLL (the DbgHelp call stacks of Win32.c), with the Debug definitions of
  # cmake/RanzOptions.cmake. x64 and arm64: Win32GetCallStack captures with CaptureStackBackTrace,
  # which needs no machine type. A pull request builds arm64 only: the x64 build of build_and_test covers
  # x64, and this is the arm64 compile check.
  debug:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        # arm64 on a pull request, x64 and arm64 in the full set (MATRICES in ci-plan.py)
        platform: ${{ fromJSON(needs.plan.outputs.debug_matrix) }}
    runs-on: ${{ matrix.platform.RUNNER }}
    name: ${{ matrix.platform.ARCHITECTURE }} Debug (build only)
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Restore vcpkg binary cache
      uses: actions/cache/restore@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-${{ matrix.platform.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json') }}-none
        restore-keys: vcpkg-bin-${{ matrix.platform.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json') }}-
    # The msquic headers for the QUIC transport of the new core (CORE-S1-1, #67); the Debug job only
    # builds, so it needs the headers, not the DLL.
    - name: Fetch msquic
      shell: pwsh
      run: |
        .github/scripts/fetch-msquic.ps1 -Arch ${{ matrix.platform.ARCHITECTURE }}
    - name: Install the nanopb generator
      uses: ./.github/actions/nanopb
    - name: Build (Debug)
      env:
        ARCHITECTURE: ${{ matrix.platform.ARCHITECTURE }}
        PRESET: ${{ matrix.platform.PRESET }}
      run: |
        if not exist "%VCPKG_BINCACHE%" mkdir "%VCPKG_BINCACHE%"

        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
        if "%VSINSTALL%"=="" (
          echo Visual Studio installation was not found.
          exit /b 1
        )

        if /i "%ARCHITECTURE%"=="x64" (
          set "VCVARS_PATH=%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "COMPILER_PATH=%VSINSTALL%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
        ) else if /i "%ARCHITECTURE%"=="arm64" (
          set "VCVARS_PATH=%VSINSTALL%\VC\Auxiliary\Build\vcvarsarm64.bat"
          set "COMPILER_PATH=%VSINSTALL%\VC\Tools\Llvm\ARM64\bin\clang-cl.exe"
        ) else (
          echo Unsupported architecture: %ARCHITECTURE%
          exit /b 1
        )

        call "%VCVARS_PATH%"
        rem PRESET is the Debug preset of the architecture (CMakePresets.json: debug, debug-arm64)
        cmake --preset %PRESET% -DCMAKE_C_COMPILER="%COMPILER_PATH%"
        if errorlevel 1 exit /b 1
        cmake --build --preset %PRESET%
      shell: cmd

  # Layout drift check (spec #24, pass 11): every file that format_check.py lists must already be
  # formatted by the committed .clang-format, with the clang-format version that format.yml pins.
  # It needs only Python, so it runs on Linux like the reformat itself.
  format:
    runs-on: ubuntu-latest
    name: format check
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Format check
      env:
        # the pin of .github/workflows/format.yml
        CLANG_FORMAT_VERSION: '22.1.8'
      run: |
        python -m pip install --disable-pip-version-check "clang-format==${CLANG_FORMAT_VERSION}"
        clang-format --version
        python .github/scripts/format_check.py files . > "$RUNNER_TEMP/files.txt"
        echo "$(wc -l < "$RUNNER_TEMP/files.txt") files in scope"
        # --Werror turns every place that clang-format would change into an error
        if ! xargs -a "$RUNNER_TEMP/files.txt" clang-format --dry-run --Werror --style=file:.clang-format; then
          echo "::error::Some files are not formatted. Fix: pip install clang-format==${CLANG_FORMAT_VERSION}, then python .github/scripts/format_check.py files | xargs clang-format -i (docs/formatting.md)"
          exit 1
        fi

  # Binary signing and the self-integrity check (SEC-3 #281, ADR-0020 and ADR-0036 amendments of
  # 2026-10-22). It takes the executables build_and_test produced, signs every shipped one and an MSI with
  # a self-signed certificate (the production Authenticode certificate is bought near release), checks each
  # signature is present, runs the self-integrity check on a signed binary (it passes) and on a copy whose
  # .text was changed (it degrades, not crashes), and checks the shipped binaries carry no symbols and the
  # package no public PDB. The Go executable ranz built with -trimpath and -ldflags "-s -w" has no
  # symbol table. It also builds the signed ranz.exe of each architecture with the signed ranz-node.exe
  # as its Payload, and the same with one byte of the Payload changed, for the install job (ONE-2, #311);
  # both carry the signed rqlited.exe of the pinned rqlite release too, the rqlite member of a Controller
  # (ONE-4, #313). .github/scripts/self-integrity.ps1.
  sign_and_integrity:
    needs: [plan, build_and_test]
    if: needs.plan.outputs.full == 'true'
    runs-on: windows-latest
    name: sign and self-integrity
    timeout-minutes: 30
    # The SHA-256 of the signed ranz-node.exe of each architecture (ONE-2, #311), which the install job
    # compares with the file that ranz install writes, and of the signed rqlited.exe (ONE-4, #313),
    # which it compares with the file that the Controller writes under its data directory, and of the
    # wintun.dll of each architecture and the xdp.sys and xdpapi.dll of the XDP runtime (ONE-3, #312),
    # and the wireguard.dll of WireGuardNT of each architecture (SDN-80, #375), which ranz install
    # writes as they are
    outputs:
      node-sha256-x64: ${{ steps.signing.outputs.node-sha256-x64 }}
      node-sha256-arm64: ${{ steps.signing.outputs.node-sha256-arm64 }}
      member-sha256: ${{ steps.signing.outputs.member-sha256 }}
      wintun-sha256-x64: ${{ steps.signing.outputs.wintun-sha256-x64 }}
      wintun-sha256-arm64: ${{ steps.signing.outputs.wintun-sha256-arm64 }}
      wireguard-sha256-x64: ${{ steps.signing.outputs.wireguard-sha256-x64 }}
      wireguard-sha256-arm64: ${{ steps.signing.outputs.wireguard-sha256-arm64 }}
      xdp-sys-sha256: ${{ steps.signing.outputs.xdp-sys-sha256 }}
      xdp-api-sha256: ${{ steps.signing.outputs.xdp-api-sha256 }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: go.sum
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Download x64 binaries
      uses: actions/download-artifact@v4
      with:
        name: Binaries-x64
        path: artifacts/x64
    - name: Download arm64 binaries
      uses: actions/download-artifact@v4
      with:
        name: Binaries-arm64
        path: artifacts/arm64
    - name: Install WiX
      shell: pwsh
      run: |
        # The WiX Toolset of the MSI (ADR-0020; REL-5, #50)
        dotnet tool install --global wix --version 5.0.2
        if ($LASTEXITCODE -ne 0) { throw "dotnet tool install exited with code $LASTEXITCODE" }
        $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
        $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & (Join-Path $tools 'wix.exe') --version
    # The rqlite member of a Controller (ONE-4, #313): the rqlited.exe of the pinned release, which
    # self-integrity.ps1 signs and embeds as a Payload of the ranz.exe of each architecture
    - name: Download the rqlite member
      shell: pwsh
      run: |
        $zip = Join-Path $env:RUNNER_TEMP 'rqlite.zip'
        $dir = Join-Path $env:RUNNER_TEMP 'rqlite'
        Invoke-WebRequest -Uri "https://github.com/rqlite/rqlite/releases/download/$env:RQLITE_VERSION/rqlite-$env:RQLITE_VERSION-win64.zip" -OutFile $zip
        $sum = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
        if ($sum -ne $env:RQLITE_WIN64_SHA256) { throw "rqlite-$env:RQLITE_VERSION-win64.zip has the SHA-256 $sum, not the pinned $env:RQLITE_WIN64_SHA256" }
        Expand-Archive -Path $zip -DestinationPath $dir
        $exe = Get-ChildItem -Path $dir -Recurse -Filter 'rqlited.exe' | Select-Object -First 1
        if (-not $exe) { throw 'rqlited.exe is not in the rqlite release archive' }
        "RQLITED=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    # The drivers that ranz install carries (ONE-3, #312), as the vendors signed them: the wintun.dll of
    # the pinned Wintun release of each architecture (fetch-wintun.ps1 checks the SHA-256 of the archive
    # and that WireGuard LLC signed the DLL), and the files of the pinned XDP runtime, for x64 only
    # (fetch-xdp.ps1 checks the SHA-512 of the package, that Microsoft signed the driver and its catalog,
    # and that the catalog lists xdpapi.dll, whose own signature no machine trusts). The SeLow package is
    # in the repository.
    - name: Fetch Wintun
      shell: pwsh
      run: |
        .github/scripts/fetch-wintun.ps1 -Arch x64 -DllDir "${{ github.workspace }}\build\wintun-x64"
        .github/scripts/fetch-wintun.ps1 -Arch arm64 -DllDir "${{ github.workspace }}\build\wintun-arm64"
    # The licence file of the Wintun archive that the DLLs come from, word for word in the NOTICE that
    # ranz.exe carries and ranz install writes beside the DLL (the licence asks for its text to go
    # with the DLL; TestNoticeHasTheWintunLicence compares the same text from the pinned tag)
    - name: The NOTICE holds the licence of the Wintun archive
      shell: pwsh
      run: |
        $words = { param($path) (Get-Content -Raw -LiteralPath $path) -split '\s+' | Where-Object { $_ } }
        $licence = (& $words 'build\wintun-x64\wintun-LICENSE.txt') -join ' '
        $notice = (& $words 'controller\cmd\ranz\NOTICE') -join ' '
        if (-not $licence) { throw 'build\wintun-x64\wintun-LICENSE.txt holds no words' }
        if (-not $notice.Contains($licence)) { throw 'the NOTICE does not hold the licence file of the Wintun archive word for word' }
        Write-Host 'the NOTICE holds the licence file of the Wintun archive word for word'
    - name: Fetch the XDP runtime
      shell: pwsh
      run: |
        .github/scripts/fetch-xdp.ps1 -OutDir "${{ github.workspace }}\build\xdp"
    # The wireguard.dll of the pinned WireGuardNT SDK of each architecture (SDN-80, #375), which a
    # gateway of WireGuard Devices loads: fetch-wireguard.ps1 checks the SHA-256 of the archive and that
    # WireGuard LLC signed the DLL
    - name: Fetch WireGuardNT
      shell: pwsh
      run: |
        .github/scripts/fetch-wireguard.ps1 -Arch x64 -DllDir "${{ github.workspace }}\build\wireguard-x64"
        .github/scripts/fetch-wireguard.ps1 -Arch arm64 -DllDir "${{ github.workspace }}\build\wireguard-arm64"
    # The licence file of the WireGuardNT archive, word for word in the NOTICE that ranz.exe carries and
    # ranz install writes beside the DLL, as for Wintun above
    - name: The NOTICE holds the licence of the WireGuardNT archive
      shell: pwsh
      run: |
        $words = { param($path) (Get-Content -Raw -LiteralPath $path) -split '\s+' | Where-Object { $_ } }
        $licence = (& $words 'build\wireguard-x64\wireguard-LICENSE.txt') -join ' '
        $notice = (& $words 'controller\cmd\ranz\NOTICE') -join ' '
        if (-not $licence) { throw 'build\wireguard-x64\wireguard-LICENSE.txt holds no words' }
        if (-not $notice.Contains($licence)) { throw 'the NOTICE does not hold the licence file of the WireGuardNT archive word for word' }
        Write-Host 'the NOTICE holds the licence file of the WireGuardNT archive word for word'
    - name: Sign, self-integrity and symbol strip
      id: signing
      shell: pwsh
      run: |
        . .github/scripts/self-integrity.ps1 -X64Dir artifacts/x64 -Arm64Dir artifacts/arm64 -Wxs .github/signing/signing-proof.wxs -LicenseFile LICENSE -GoModuleDir . -OutDir build/signing -Rqlited $env:RQLITED -WintunX64 build/wintun-x64 -WintunArm64 build/wintun-arm64 -Xdp build/xdp -WireGuardX64 build/wireguard-x64 -WireGuardArm64 build/wireguard-arm64
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: signing-proof
        if-no-files-found: warn
        retention-days: 14
        path: |
          build/signing/*.msi
          build/signing/*.cer
    # The signed ranz.exe of each architecture, with the signed ranz-node.exe as its Payload, and the
    # same ranz.exe with one byte of its Payload changed (ONE-2, #311), each in an artifact of its own
    # that holds that one file, for the install job below. The certificate that signed them is the
    # one thing besides ranz.exe that a runner needs, to trust it.
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: ranz-x64
        if-no-files-found: warn
        retention-days: 14
        path: build/signing/x64/ranz.exe
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: ranz-arm64
        if-no-files-found: warn
        retention-days: 14
        path: build/signing/arm64/ranz.exe
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: ranz-tampered-x64
        if-no-files-found: warn
        retention-days: 14
        path: build/signing/x64-tampered/ranz.exe
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: ranz-tampered-arm64
        if-no-files-found: warn
        retention-days: 14
        path: build/signing/arm64-tampered/ranz.exe
    # The x64 ranz.exe whose XDP driver has one byte changed (ONE-3, #312): ranz install must refuse the
    # XDP runtime and still install the Node
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: ranz-xdpfail-x64
        if-no-files-found: warn
        retention-days: 14
        path: build/signing/x64-xdpfail/ranz.exe
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: ci-signing-certificate
        if-no-files-found: warn
        retention-days: 14
        path: build/signing/ranz-ci-signing.cer
    # The thin MSI of ranz.exe (ONE-5, #314; ADR-0020 amendment of 2026-10-22), for x64 and arm64: it carries
    # the signed ranz.exe of its architecture and nothing else, and it is signed like the executables, with
    # the self-signed certificate of this job. Its version is the one that ranz version prints, major.minor
    # and the run number, the one counter that only grows (ADR-0020 consequences). The step builds packages
    # and publishes nothing. Each architecture gets the package at the version before it too, for the upgrade
    # and the downgrade of the msi job, and one that carries the ranz.exe with a changed Payload, which ranz
    # install must refuse (.github/scripts/msi-build.ps1, .github/msi/ranz.wxs).
    - name: Build and sign the MSI of each architecture
      shell: pwsh
      run: |
        $subject = 'CN=Ranz VPN CI signing (self-signed), O=Hanzcodes'
        $cert = @(Get-ChildItem -Path Cert:\CurrentUser\My | Where-Object { $_.Subject -eq $subject })
        if ($cert.Count -ne 1) { throw "$($cert.Count) certificates of the subject $subject are in the store of the signing step, not one" }
        .github/scripts/msi-build.ps1 -Wxs .github/msi/ranz.wxs -OutDir build/msi `
          -X64 build/signing/x64/ranz.exe -Arm64 build/signing/arm64/ranz.exe `
          -X64Tampered build/signing/x64-tampered/ranz.exe -Arm64Tampered build/signing/arm64-tampered/ranz.exe `
          -Thumbprint $cert[0].Thumbprint
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: msi-x64
        if-no-files-found: warn
        retention-days: 14
        path: |
          build/msi/ranz-x64*.msi
          build/msi/ranz-x64.sha256
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: msi-arm64
        if-no-files-found: warn
        retention-days: 14
        path: |
          build/msi/ranz-arm64*.msi
          build/msi/ranz-arm64.sha256

  # The thin MSI of ranz.exe with a stand-in ranz.exe (ONE-5, #314): what Windows Installer does with the two
  # actions of the package, ranz install and ranz uninstall -keep-ranz, proved without the C build, so that a
  # mistake of the package shows within minutes and not after the build of the node. The stand-in
  # (.github/msi/standin-ranz.go) logs each call and writes and removes a ranz-node.exe beside itself; the
  # package is built from .github/msi/ranz.wxs with the pinned WiX, as the real one, at two versions. The
  # next job runs the packages on both architectures (.github/scripts/msi-install.ps1 -StandIn), and the msi
  # job, after sign_and_integrity, runs the same steps with the real signed ranz.exe. A pull request that
  # changes the package or its scripts runs the full set (SENSITIVE in ci-plan.py), and this job with it.
  msi_standin_build:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: windows-latest
    name: MSI with a stand-in ranz.exe (build)
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: go.sum
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Install WiX
      shell: pwsh
      run: |
        # The WiX Toolset of the MSI (ADR-0020; REL-5, #50), the version that sign_and_integrity pins
        dotnet tool install --global wix --version 5.0.2
        if ($LASTEXITCODE -ne 0) { throw "dotnet tool install exited with code $LASTEXITCODE" }
        $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
        $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & (Join-Path $tools 'wix.exe') --version
    - name: Build the stand-in ranz.exe and the MSIs that carry it
      shell: pwsh
      run: |
        $work = Join-Path $env:RUNNER_TEMP 'standin'
        $env:GOOS = 'windows'
        $env:CGO_ENABLED = '0'
        foreach ($arch in @(@{ Name = 'x64'; Goarch = 'amd64' }, @{ Name = 'arm64'; Goarch = 'arm64' })) {
          $env:GOARCH = $arch.Goarch
          # prev is the stand-in of the package at the lower version, cur the one of the package under test
          foreach ($id in 'prev', 'cur') {
            $dir = Join-Path $work "$($arch.Name)-$id"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            go build -ldflags "-X main.id=$id" -o (Join-Path $dir 'ranz.exe') .github/msi/standin-ranz.go
            if ($LASTEXITCODE -ne 0) { throw "go build of the stand-in ($($arch.Name), $id) exited with code $LASTEXITCODE" }
          }
        }
        Remove-Item Env:\GOOS, Env:\GOARCH, Env:\CGO_ENABLED
        .github/scripts/msi-build.ps1 -Wxs .github/msi/ranz.wxs -OutDir build/msi-standin `
          -X64 (Join-Path $work 'x64-cur\ranz.exe') -Arm64 (Join-Path $work 'arm64-cur\ranz.exe') `
          -X64Previous (Join-Path $work 'x64-prev\ranz.exe') -Arm64Previous (Join-Path $work 'arm64-prev\ranz.exe') `
          -Version 0.1.2 -PreviousVersion 0.1.1
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: msi-standin
        if-no-files-found: warn
        retention-days: 14
        path: build/msi-standin/

  msi_standin:
    needs: msi_standin_build
    strategy:
      fail-fast: false
      matrix:
        platform: [
          { ARCHITECTURE: x64, RUNNER: "windows-latest" },
          { ARCHITECTURE: arm64, RUNNER: "windows-11-arm" }
        ]
    name: MSI with a stand-in ranz.exe (${{ matrix.platform.ARCHITECTURE }})
    runs-on: ${{ matrix.platform.RUNNER }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Download the MSIs
      uses: actions/download-artifact@v4
      with:
        name: msi-standin
        path: artifacts/msi
    - name: The MSI, checked from outside
      shell: pwsh
      env:
        ARCHITECTURE: ${{ matrix.platform.ARCHITECTURE }}
      run: |
        . .github/scripts/msi-install.ps1 -StandIn -Architecture $env:ARCHITECTURE -Dir artifacts\msi -OtherDir artifacts\msi -LogDir (Join-Path $env:RUNNER_TEMP 'msi-logs')
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: msi-standin-logs-${{ matrix.platform.ARCHITECTURE }}
        if-no-files-found: warn
        retention-days: 14
        path: ${{ runner.temp }}/msi-logs

  # The thin MSI of ranz.exe (ONE-5, #314; ADR-0011 and ADR-0020 amendments of 2026-10-22), on windows-latest
  # (x64) and windows-11-arm (arm64), checked from outside the running process with msiexec: the exit codes,
  # the Service Control Manager, the files and their access list, the Apps and Features entries and the data
  # directory. The job copies the MSI of its architecture to its runner, the one at the version of the
  # run, with the package at the version before it, the package of the other architecture and one whose
  # ranz.exe carries a changed Payload, and the certificate that signed them (this is another machine than
  # the one that signed). It proves that the MSI installs ranz.exe, runs ranz install and ends with
  # ranzvpnserver running, and that the uninstall leaves nothing but the data directory; that an upgrade
  # from N to N+1 keeps the data directory and the Node identity key, with one Apps and Features entry, and
  # that a downgrade is refused; that each MSI is refused on the wrong architecture and installs nothing,
  # and that a failed ranz install rolls the package back. The version of the package is the run number,
  # the build that ranz version prints. .github/scripts/msi-install.ps1.
  #
  # Every msiexec call of the script has a bound of 300 s and fails with the evidence (CI-FLAKE-6, #593). The step has a
  # timeout of 10 minutes (the bound, the longest normal step, 77 s, and 3 minutes for the evidence) and the job one of 20 (the
  # step, the step of the planted hang, the setup and the upload): they are the second line, for a hang that the bound cannot
  # catch. The old ones, 30 and 45 minutes, ended nothing in three jobs: the step was still running when the service cancelled
  # each job after 55 minutes, the 45 of the job and 10 more. A msiexec that hangs does not do that by itself, since the runner
  # ends such a step at its timeout (the pull request of #593 has the runs), so the runner or the computer did not answer; the
  # evidence that the bound prints is there to tell which.
  msi:
    needs: sign_and_integrity
    strategy:
      fail-fast: false
      matrix:
        platform: [
          { ARCHITECTURE: x64, OTHER: arm64, RUNNER: "windows-latest" },
          { ARCHITECTURE: arm64, OTHER: x64, RUNNER: "windows-11-arm" }
        ]
    name: msi (${{ matrix.platform.ARCHITECTURE }})
    runs-on: ${{ matrix.platform.RUNNER }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Download the MSIs of this architecture
      uses: actions/download-artifact@v4
      with:
        name: msi-${{ matrix.platform.ARCHITECTURE }}
        path: artifacts/msi
    - name: Download the MSI of the other architecture
      uses: actions/download-artifact@v4
      with:
        name: msi-${{ matrix.platform.OTHER }}
        path: artifacts/msi-other
    - name: Download the CI signing certificate
      uses: actions/download-artifact@v4
      with:
        name: ci-signing-certificate
        path: artifacts/certificate
    # The root store only: the signature of a file chains to a trusted root, and nothing here asks for
    # a trusted publisher
    - name: Trust the CI signing certificate on this runner
      shell: pwsh
      run: |
        $cer = Get-ChildItem -Path artifacts/certificate -Filter '*.cer' | Select-Object -First 1
        if (-not $cer) { throw 'no .cer file in the ci-signing-certificate artifact' }
        Import-Certificate -FilePath $cer.FullName -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
        Write-Host "trusted $($cer.FullName) as a root"
    - name: The MSI, checked from outside
      shell: pwsh
      timeout-minutes: 10
      env:
        NODE_SHA256: ${{ needs.sign_and_integrity.outputs[format('node-sha256-{0}', matrix.platform.ARCHITECTURE)] }}
        ARCHITECTURE: ${{ matrix.platform.ARCHITECTURE }}
      run: |
        . .github/scripts/msi-install.ps1 -Architecture $env:ARCHITECTURE -Dir artifacts\msi -OtherDir artifacts\msi-other -LogDir (Join-Path $env:RUNNER_TEMP 'msi-logs') -NodeSha256 $env:NODE_SHA256
    # The bound of every msiexec call of the step above, on a planted hang: a stand-in for msiexec.exe that never ends must fail
    # within its bound, with the evidence, and its process tree must be ended (CI-FLAKE-6, #593). It runs whatever the step above
    # did, and it runs the real msiexec.exe once, on a package that is not there.
    - name: The bound of a msiexec call, on a planted hang
      if: ${{ !cancelled() }}
      shell: pwsh
      timeout-minutes: 3
      run: |
        . .github/scripts/msi-install.ps1 -SelfTest
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: msi-logs-${{ matrix.platform.ARCHITECTURE }}
        if-no-files-found: warn
        retention-days: 14
        path: ${{ runner.temp }}/msi-logs

  # ranz install and ranz uninstall (ONE-2, #311; ADR-0011 and ADR-0020 amendments of 2026-10-22), on
  # windows-latest (x64) and windows-11-arm (arm64), checked from outside the running process. The
  # job copies one file of the product to its runner: the signed ranz.exe of its architecture that
  # sign_and_integrity built with the signed ranz-node.exe as its Payload (internal/payload), with no
  # ranz-node.exe beside it and no second download. It copies the same ranz.exe with one byte of its
  # Payload changed too, which ranz install must refuse, writing nothing under Program Files and
  # starting nothing. Besides ranz.exe a runner needs the certificate that signed both, so that their
  # signatures chain to a trusted root (this is another machine than the one that signed). The Controller
  # service that ranz install --controller starts runs the rqlite member that ranz.exe carries (ONE-4,
  # #313): no rqlited is installed or started by the job. The same ranz.exe also carries the drivers
  # (ONE-3, #312): the wintun.dll of the pinned Wintun release on both architectures, the wireguard.dll of
  # the pinned WireGuardNT SDK on both (SDN-80, #375), which ranz install --no-wireguard leaves out, and on
  # x64 the SeLow driver package and the XDP runtime of the pinned Microsoft package. The job reads from
  # outside that ranz install wrote each of them as it is, installed SeLow and the XDP runtime (the
  # XDP files keep the production signature of Microsoft: signtool verify /kp for the driver, and
  # signtool verify /c for xdpapi.dll, a member of the catalog), and that the Node
  # reported what is there as its Capabilities; that an XDP runtime that fails to install leaves the
  # Node installed with the xdp Capability absent (a third ranz.exe with one byte of xdp.sys changed),
  # as ranz install --no-xdp does; that on arm64 only Wintun is installed; and that ranz uninstall
  # removes the drivers it installed and leaves the ones that were there before.
  # .github/scripts/install.ps1.
  install:
    needs: sign_and_integrity
    strategy:
      fail-fast: false
      matrix:
        platform: [
          { ARCHITECTURE: x64, RUNNER: "windows-latest" },
          { ARCHITECTURE: arm64, RUNNER: "windows-11-arm" }
        ]
    name: install (${{ matrix.platform.ARCHITECTURE }})
    runs-on: ${{ matrix.platform.RUNNER }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Download ranz.exe
      uses: actions/download-artifact@v4
      with:
        name: ranz-${{ matrix.platform.ARCHITECTURE }}
        path: artifacts/ranz
    - name: Download ranz.exe with a changed Payload
      uses: actions/download-artifact@v4
      with:
        name: ranz-tampered-${{ matrix.platform.ARCHITECTURE }}
        path: artifacts/ranz-tampered
    - name: Download ranz.exe with a changed XDP driver
      if: matrix.platform.ARCHITECTURE == 'x64'
      uses: actions/download-artifact@v4
      with:
        name: ranz-xdpfail-x64
        path: artifacts/ranz-xdpfail
    - name: Download the CI signing certificate
      uses: actions/download-artifact@v4
      with:
        name: ci-signing-certificate
        path: artifacts/certificate
    # The root store only: the signature of a file chains to a trusted root, and nothing here asks for
    # a trusted publisher
    - name: Trust the CI signing certificate on this runner
      shell: pwsh
      run: |
        $cer = Get-ChildItem -Path artifacts/certificate -Filter '*.cer' | Select-Object -First 1
        if (-not $cer) { throw 'no .cer file in the ci-signing-certificate artifact' }
        Import-Certificate -FilePath $cer.FullName -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
        Write-Host "trusted $($cer.FullName) as a root"
    - name: ranz install, checked from outside, then ranz uninstall
      shell: pwsh
      timeout-minutes: 30
      env:
        NODE_SHA256: ${{ needs.sign_and_integrity.outputs[format('node-sha256-{0}', matrix.platform.ARCHITECTURE)] }}
        MEMBER_SHA256: ${{ needs.sign_and_integrity.outputs.member-sha256 }}
        WINTUN_SHA256: ${{ needs.sign_and_integrity.outputs[format('wintun-sha256-{0}', matrix.platform.ARCHITECTURE)] }}
        WIREGUARD_SHA256: ${{ needs.sign_and_integrity.outputs[format('wireguard-sha256-{0}', matrix.platform.ARCHITECTURE)] }}
        XDP_SYS_SHA256: ${{ needs.sign_and_integrity.outputs.xdp-sys-sha256 }}
        XDP_API_SHA256: ${{ needs.sign_and_integrity.outputs.xdp-api-sha256 }}
        ARCHITECTURE: ${{ matrix.platform.ARCHITECTURE }}
      run: |
        . .github/scripts/install.ps1 -Ranz artifacts\ranz\ranz.exe -Tampered artifacts\ranz-tampered\ranz.exe -XdpFail artifacts\ranz-xdpfail\ranz.exe -Architecture $env:ARCHITECTURE -NodeSha256 $env:NODE_SHA256 -MemberSha256 $env:MEMBER_SHA256 -WintunSha256 $env:WINTUN_SHA256 -XdpSysSha256 $env:XDP_SYS_SHA256 -XdpApiSha256 $env:XDP_API_SHA256 -WireGuardSha256 $env:WIREGUARD_SHA256

  # The XDP job of the L2 adapter (CORE-S3-2, #72; seam 3 of #45): the vpntest test kmtest on a real KM-TEST Loopback
  # Adapter, on Windows Server 2022 and 2025 x64, with the drivers that the signed ranz.exe of sign_and_integrity installs
  # (ONE-3, #312), never a script. First SeLow alone (ranz install --no-xdp): the node finds at run time that XDP cannot
  # bind and falls back to SeLow. Then the XDP runtime too, whose xdp.sys passes signtool verify /kp: TX inspect, RX
  # inject, LAN discovery through an L2 switch with per-VLAN broadcast limits, recovery and shutdown, the soak (an hour
  # on the nightly run of a Sunday), ranz uninstall and install after the traffic, and then the paused consumer and the
  # benchmark of the batch sizes. Between them, the bridge of an L2 Network (CORE-S3-3, #73: vpntest nicbridge) on the
  # runner's NIC, on a KM-TEST adapter standing in for a Hyper-V switch and on an internal Hyper-V switch that the job
  # makes, with SeLow, XDP, and Npcap through a stand-in of its pcap API; ranz install puts no Npcap on the machine.
  # Each run of vpntest has a time limit. arm64 is L3 only (no XDP runtime and no SeLow package for it): the l2adapter
  # test of build_and_test shows that no L2 adapter is offered there.
  # .github/scripts/kmtest.ps1. Then QTIP between two server node processes, each on its own KM-TEST adapter with XDP
  # (CORE-S7-2, #83): .github/scripts/qtip.ps1.
  kmtest:
    needs: [build_and_test, sign_and_integrity]
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    name: kmtest (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 135
    steps:
    - uses: actions/checkout@v4
    - name: Download the x64 binaries
      uses: actions/download-artifact@v4
      with:
        name: Binaries-x64
        path: artifacts/bin
    - name: Download ranz.exe
      uses: actions/download-artifact@v4
      with:
        name: ranz-x64
        path: artifacts/ranz
    - name: Download the CI signing certificate
      uses: actions/download-artifact@v4
      with:
        name: ci-signing-certificate
        path: artifacts/certificate
    # The root store only, as in the install job: the signature of ranz.exe chains to a trusted root
    - name: Trust the CI signing certificate on this runner
      shell: pwsh
      run: |
        $cer = Get-ChildItem -Path artifacts/certificate -Filter '*.cer' | Select-Object -First 1
        if (-not $cer) { throw 'no .cer file in the ci-signing-certificate artifact' }
        Import-Certificate -FilePath $cer.FullName -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
        Write-Host "trusted $($cer.FullName) as a root"
    - name: The L2 adapter on KM-TEST with SeLow, then with XDP
      shell: pwsh
      timeout-minutes: 100
      run: |
        . .github/scripts/kmtest.ps1 -Ranz artifacts\ranz\ranz.exe -Vpntest artifacts\bin\vpntest.exe -Runner ${{ matrix.runner }}
    # The msquic.dll of the pinned package next to vpntest, for the QTIP step below (CORE-S7-2, #83); the step of the L2
    # adapter above needs none, so it comes after it
    - name: Fetch msquic
      if: ${{ !cancelled() }}
      shell: pwsh
      run: |
        .github/scripts/fetch-msquic.ps1 -Arch x64 -DllDir "${{ github.workspace }}\artifacts\bin"
    # QTIP between two server node processes on this runner, each on its own KM-TEST adapter with XDP (CORE-S7-2, #83;
    # ADR-0018 decision 5, ADR-0002 amendment of 2026-10-21): ranz install, vpntest qtip in one process, then the wire
    # between the nodes (an internal Hyper-V switch with a host vNIC for each, set up as the DuoNic pair on which msquic
    # tests XDP and QTIP on one host), node-s (vpntest qtip serve) with QTIP on
    # 8443, whose TCP and UDP port must be held, and node-c (vpntest qtip dial), whose QTIP link to node-s across the wire
    # must come up, then the wire goes and ranz uninstall (.github/scripts/qtip.ps1)
    - name: QTIP between two server node processes
      if: ${{ !cancelled() }}
      shell: pwsh
      timeout-minutes: 20
      run: |
        . .github/scripts/qtip.ps1 -Ranz artifacts\ranz\ranz.exe -Vpntest artifacts\bin\vpntest.exe -Runner ${{ matrix.runner }}

  # The first test of the product on two PCs (docs/first-test.md, in simple English for the person who runs it by hand), proved on a
  # runner that plays both PCs, on windows-latest (x64) and windows-11-arm (arm64). .github/scripts/first-test.ps1 reads the
  # runbook and runs its steps in its order, with the commands of its code blocks: ranz install --controller (the Node service and
  # the Controller service from the one signed ranz.exe, with the CI certificate trusted), the first start of the Controller, its
  # certificate, its API and its web UI, the default VRF, Network and starter rule, a second install as PC B, PC B reaching the
  # Controller through the address of the runner with its TLS fingerprint, the link check of ranz test throughput, the two Node
  # resources and the addresses that the Controller gives them, the stand-in Nodes (vpntest firsttest: two nodes with their
  # control streams to that Controller, one with a real Wintun adapter and one with a fake host), the enrolment in the audit log,
  # the ping of the stack of the runner through the adapter and the overlay, ranz doctor, the logs, ranz uninstall and the clean-up.
  # The Gap step of the runbook is read from the sources: the job fails when a Gap is closed, until the runbook has real steps
  # for it. In step 20 the Node service of the runner joins the Controller as pc-a with its own key, through ranz node
  # (SDN-90, #395); two Node services cannot form a session yet, so the stand-in keeps playing pc-b.
  # It follows build_and_test (vpntest) and sign_and_integrity (the signed ranz.exe and its certificate, as the install job does).
  first_test:
    needs: [plan, build_and_test, sign_and_integrity]
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [
          { ARCHITECTURE: x64, RUNNER: "windows-latest" },
          { ARCHITECTURE: arm64, RUNNER: "windows-11-arm" }
        ]
    name: first test (${{ matrix.platform.ARCHITECTURE }})
    runs-on: ${{ matrix.platform.RUNNER }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Download ranz.exe
      uses: actions/download-artifact@v4
      with:
        name: ranz-${{ matrix.platform.ARCHITECTURE }}
        path: artifacts/ranz
    - name: Download the CI signing certificate
      uses: actions/download-artifact@v4
      with:
        name: ci-signing-certificate
        path: artifacts/certificate
    - name: Download the test programs
      uses: actions/download-artifact@v4
      with:
        name: Binaries-${{ matrix.platform.ARCHITECTURE }}
        path: artifacts/binaries
    - name: The first test, step by step
      shell: pwsh
      timeout-minutes: 30
      run: |
        . .github/scripts/first-test.ps1 -Ranz artifacts\ranz\ranz.exe -Certificate artifacts\certificate\ranz-ci-signing.cer -Binaries artifacts\binaries -Architecture ${{ matrix.platform.ARCHITECTURE }}

  # RRAS NAT of the internet exit of a VRF (SDN-12, #188; ADR-0025 decision 13), the VM job of the ticket on Windows Server 2025
  # x64: Routing and Remote Access installed as a LAN router, as an operator sets it up, then vpntest egressrras: the
  # Capabilities of the runner give RRAS NAT, the node adds the NAT routing protocol and makes the adapter of its VRF a private
  # interface and the interfaces that carry the egress public ones through MprConfig and MprAdmin, the egress of a peer leaves
  # translated and its answers come back, the NAT setting of the adapter taken away behind the node's back is set again by the
  # next reconcile, and the NAT holds nothing of the node once it is the exit of no VRF (.github/scripts/egress-nat.ps1). It
  # follows build_and_test (vpntest); RRAS changes the runner, so the test has a job of its own.
  egress_rras:
    needs: [plan, build_and_test]
    if: needs.plan.outputs.full == 'true'
    name: egress (RRAS NAT)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Download the x64 binaries
      uses: actions/download-artifact@v4
      with:
        name: Binaries-x64
        path: artifacts/bin
    - name: Fetch Wintun
      shell: pwsh
      run: |
        .github/scripts/fetch-wintun.ps1 -Arch x64 -DllDir "${{ github.workspace }}\artifacts\bin"
    - name: RRAS NAT of the internet exit
      shell: pwsh
      timeout-minutes: 20
      run: |
        . .github/scripts/egress-nat.ps1 -BuildDir artifacts\bin -Rras
