# Move-only checker for the #29 structural split (.github/scripts/move-only-check.py).
#
# Every "split: ", "header: " and "linkage: " commit of the pull request (or of the push) is
# checked against its parent, and every unmarked commit made after the checker landed is scanned
# for code that moves verbatim into another file. The fixtures run first, so a broken checker
# fails here instead of passing everything. Only git and Python are needed, so it runs on Linux
# and finishes in about a minute, beside the Windows build.
#
# It is the commit audit, so it has no path filter: it runs on every pull request, whatever files
# it changes, and on every push to master or integration and on workflow_dispatch. windows.yml and
# ranz.yml run only for the paths that they read (see their header comments).

name: move-only

on:
  push:
    branches: [master, integration]
  workflow_dispatch:
  pull_request:

# Named as in windows.yml: a run that is not a pull request is Full CI: <event> on <branch>
run-name: "${{ github.event_name == 'pull_request' && github.event.pull_request.title || format('Full CI: {0} on {1}', github.event_name, github.ref_name) }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  move_only:
    name: move-only check
    runs-on: ubuntu-latest
    # The job itself took 17 to 43 s in the 187 successful runs from 2026-11-01 05:46 to 2026-11-02 22:04 UTC, pushes and pull requests
    # (the limit counts from the start of the job, not from the minutes that a run may wait for a runner). 10 minutes is almost 14 times
    # the longest of them, and ends a hung job 350 minutes before GitHub would: since CI-INTEG-1 (#585) a push to integration or master
    # waits for the run of the push before it, so a job without a limit holds the group for 360 minutes (CI-INTEG-1-R1, #597;
    # .github/scripts/job-timeout-check.py)
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Checker fixtures
      run: python3 -I .github/scripts/move-only-check-test.py
    - name: Check the commits
      env:
        BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      run: |
        # A push that creates the branch has no "before": check the pushed commit alone.
        if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="$HEAD~1"; fi
        python3 -I .github/scripts/move-only-check.py --range "$BASE..$HEAD"
