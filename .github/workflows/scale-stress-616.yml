# A temporary stress of CI-FLAKE-9 (#616), taken out again by the last commit of its pull request. It runs the scale scenario of
# ranz.yml at a tenth of the target again and again on each of six runners, in turn on the disk of the runner and on a RAM disk,
# with a probe of the sync latency of that disk before and after each run, to show how much of the spread of the enrolment
# belongs to the runner, how much to the run, and what the disk has to do with it. It runs when this file changes in a push.
#
# Round 1: the scenario of integration (one enrolment in a run).

name: scale-stress-616

on:
  push:
    branches: [ci/616-scale-gate-enrolment]
    paths:
    - '.github/workflows/scale-stress-616.yml'

permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'
  RQLITE_VERSION: 'v10.5.3'
  RQLITE_LINUX_AMD64_SHA256: '93dc04417d9d233e79eb359e325793b1f92daa84ec93694953f4bff6307fda2b'

jobs:
  stress:
    name: stress ${{ matrix.n }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: go.sum
    - name: Install rqlited
      timeout-minutes: 5
      run: |
        curl -fsSL -o "$RUNNER_TEMP/rqlite.tar.gz" "https://github.com/rqlite/rqlite/releases/download/${RQLITE_VERSION}/rqlite-${RQLITE_VERSION}-linux-amd64.tar.gz"
        echo "${RQLITE_LINUX_AMD64_SHA256}  $RUNNER_TEMP/rqlite.tar.gz" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/rqlite"
        tar -xzf "$RUNNER_TEMP/rqlite.tar.gz" -C "$RUNNER_TEMP/rqlite"
        rqlited="$(find "$RUNNER_TEMP/rqlite" -name rqlited -type f | head -n 1)"
        test -n "$rqlited"
        "$rqlited" -version
        echo "RQLITED=$rqlited" >> "$GITHUB_ENV"
    - name: The machine
      run: |
        mkdir -p stress-out
        {
          lscpu
          echo
          uname -r
          findmnt -T "$RUNNER_TEMP" || true
          findmnt -T /dev/shm || true
          lsblk || true
          df -h "$RUNNER_TEMP" /dev/shm || true
        } > stress-out/machine.txt 2>&1
        grep -E 'Model name|^CPU\(s\)|Hypervisor' stress-out/machine.txt || true
        findmnt -T "$RUNNER_TEMP" || true
    - name: Build the scale test
      timeout-minutes: 10
      run: go test -c -o "$RUNNER_TEMP/scale.test" ./controller/internal/controller
    - name: Stress
      timeout-minutes: 20
      run: |
        out="$GITHUB_WORKSPACE/stress-out"
        cat > "$RUNNER_TEMP/probe.py" <<'PY'
        import os
        import sys
        import time

        d = sys.argv[1]
        path = os.path.join(d, 'ranz-probe.bin')
        fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
        buf = b'x' * 4096
        lat = []
        for _ in range(400):
            t = time.perf_counter()
            os.write(fd, buf)
            os.fsync(fd)
            lat.append((time.perf_counter() - t) * 1000)
        os.close(fd)
        os.unlink(path)
        lat.sort()
        n = len(lat)
        print('fsync in %s: n=%d mean=%.2f p50=%.2f p90=%.2f p99=%.2f max=%.2f ms' % (d, n, sum(lat) / n, lat[n // 2], lat[int(n * 0.9)], lat[int(n * 0.99)], lat[-1]))
        PY
        cd controller/internal/controller
        for i in 1 2 3 4 5 6; do
          if [ $((i % 2)) -eq 1 ]; then mode=disk; tmp=/tmp; else mode=shm; tmp=/dev/shm; fi
          echo "::group::run $i on $mode"
          date -u +%H:%M:%S
          python3 "$RUNNER_TEMP/probe.py" "$tmp" | sed "s/^/run $i before: /" | tee -a "$out/probe.txt"
          TMPDIR="$tmp" RANZ_SCALE=pr RANZ_SCALE_OUT="$out/run$i-$mode" "$RUNNER_TEMP/scale.test" -test.run '^TestScale$' -test.v -test.timeout 10m > "$out/run$i-$mode.log" 2>&1 || echo "run $i failed"
          python3 "$RUNNER_TEMP/probe.py" "$tmp" | sed "s/^/run $i after: /" | tee -a "$out/probe.txt"
          grep -E 'enrolled|declared|FAIL|panic' "$out/run$i-$mode.log" || true
          grep -hE 'scale_(enrol|setup|change_apply)' "$out/run$i-$mode/scale-bench.txt" || true
          echo "::endgroup::"
        done
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: scale-stress-${{ matrix.n }}
        retention-days: 30
        if-no-files-found: ignore
        path: stress-out
