# Spike: Windows Installer packages (WiX Toolset v5) for Ranz VPN Server, x64 and arm64.
# The build job is a copy of windows.yml's build steps. The msi job runs on the x64 runner:
# it builds both MSIs (WiX builds any target architecture on any host) and runs the
# install/uninstall test of spikes/msi/test-msi.ps1 on the x64 one.
name: spike-msi

on:
  push:
    branches: ['spike/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WIX_VERSION: '5.0.2'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [
          { ARCHITECTURE: x64, VCPKG_TRIPLET: "x64-windows-static", RUNNER: "windows-latest", CMAKE_EXTRA_FLAGS: ""},
          { ARCHITECTURE: arm64, VCPKG_TRIPLET: "arm64-windows-static", RUNNER: "windows-11-arm", CMAKE_EXTRA_FLAGS: "-DOQS_PERMIT_UNSUPPORTED_ARCHITECTURE=ON"}
        ]
    runs-on: ${{ matrix.platform.RUNNER }}
    name: build-${{ matrix.platform.ARCHITECTURE }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: 'build/vcpkg_installed/'
        key: vcpkg-${{ matrix.platform.VCPKG_TRIPLET }}
    - name: Set version variables
      run: |
        $v = python version.py
        echo "VERSION=$v" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
      shell: pwsh
    - name: Build
      env:
        ARCHITECTURE: ${{ matrix.platform.ARCHITECTURE }}
        VCPKG_TRIPLET: ${{ matrix.platform.VCPKG_TRIPLET }}
        CMAKE_EXTRA_FLAGS: ${{ matrix.platform.CMAKE_EXTRA_FLAGS }}
      run: |
        set BUILD_NUMBER=%GITHUB_RUN_NUMBER%
        mkdir build
        cd build

        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
        if "%VSINSTALL%"=="" (
          echo Visual Studio installation was not found.
          exit /b 1
        )

        if /i "%ARCHITECTURE%"=="x64" (
          set "VCVARS_PATH=%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "COMPILER_PATH=%VSINSTALL%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
        ) else if /i "%ARCHITECTURE%"=="arm64" (
          set "VCVARS_PATH=%VSINSTALL%\VC\Auxiliary\Build\vcvarsarm64.bat"
          set "COMPILER_PATH=%VSINSTALL%\VC\Tools\Llvm\ARM64\bin\clang-cl.exe"
        ) else (
          echo Unsupported architecture: %ARCHITECTURE%
          exit /b 1
        )

        call "%VCVARS_PATH%"
        cmake -G "Ninja" -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=%VCPKG_TRIPLET% -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER="%COMPILER_PATH%" -DCMAKE_CXX_COMPILER="%COMPILER_PATH%" -DBUILD_NUMBER=%BUILD_NUMBER% %CMAKE_EXTRA_FLAGS% ..
        cmake --build .
      shell: cmd
    - uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        name: server-${{ matrix.platform.ARCHITECTURE }}
        path: |
          build/vpnserver.exe
          build/hamcore.se2

  msi:
    needs: build
    runs-on: windows-latest
    name: msi
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: server-x64
        path: payload/x64
    - uses: actions/download-artifact@v4
      with:
        name: server-arm64
        path: payload/arm64
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Install WiX ${{ env.WIX_VERSION }}
      shell: pwsh
      run: |
        dotnet tool install --global wix --version $env:WIX_VERSION
        if ($LASTEXITCODE -ne 0) { throw "dotnet tool install wix failed ($LASTEXITCODE)" }
        "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Build MSIs
      shell: pwsh
      run: |
        $v = "$(python version.py).$env:GITHUB_RUN_NUMBER"
        New-Item -ItemType Directory -Force -Path out | Out-Null
        foreach ($arch in @('x64', 'arm64')) {
          $msi = "out/RanzVPN-Server-$v-$arch.msi"
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" build spikes/msi/Package.wxs -arch $arch -d "Version=$v" -d "BuildDir=payload/$arch" -o $msi
          if ($LASTEXITCODE -ne 0) { throw "wix build ($arch) failed ($LASTEXITCODE)" }
          $len = (Get-Item -LiteralPath $msi).Length
          "$arch MSI: $(Split-Path -Leaf $msi), $len bytes ($([math]::Round($len / 1MB, 2)) MiB)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          foreach ($f in Get-ChildItem "payload/$arch") { "  payload $($f.Name): $($f.Length) bytes" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append }
        }
    - uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        name: RanzVPN-Server-msi
        path: out/*.msi
    - name: Install/uninstall test (x64)
      shell: pwsh
      timeout-minutes: 10
      run: |
        $msi = (Get-ChildItem out/*-x64.msi | Select-Object -First 1).FullName
        ./spikes/msi/test-msi.ps1 -Msi $msi -LogDir out/logs
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        if-no-files-found: ignore
        name: msi-test-logs
        path: out/logs/
