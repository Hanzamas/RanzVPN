# The formal model of the session handshake (AUD-5, #389; docs/formal-model.md): ProVerif, pinned, on Linux.
#
# tests/formal holds the models of the handshakes of Ranz VPN: the session of a client over TLS-443 and over
# QUIC, the control stream of a node and of a Go client, Noise_IK alone with its records under the Noise
# keys, and the peer layer. The prover job builds ProVerif 2.05 from the source archive of its authors, whose
# SHA-256 is the one that opam-repository records for that release, and runs every variant of
# tests/formal/variants.tsv (.github/scripts/formal.py run). The job fails when a query that must hold does
# not hold, when a negative control (the binding left out, the pin left out, neither) stops showing its attack,
# and when a finding (the QUIC binding, the peer layer) stops showing its own, so that a fix of the code has to
# change tests/formal/expected.tsv in the same change. The inputs and the logs of ProVerif, with the traces of
# the attacks, are the artifact formal.
#
# It runs in the full set only (ci-plan.yml, .github/scripts/ci-plan.py): on a push to master or integration,
# every night, on workflow_dispatch, on a pull request with the label full-ci and on a pull request that
# changes the models, this workflow or the script (SENSITIVE in ci-plan.py). A pull request that changes none
# of the files below does not run the workflow. The table from the model to the code, which only needs
# Python, is checked by quality.yml on every pull request.

name: formal

on:
  push:
    branches: [master, integration, audit/aud-5-formal-model]
  schedule:
  - cron: '41 20 * * *'
  workflow_dispatch:
  pull_request:
    # labeled: the label full-ci starts the full set on a pull request that is open
    types: [opened, synchronize, reopened, labeled]
    paths:
    - 'tests/formal/**'
    - 'docs/formal-model.md'
    - '.github/workflows/formal.yml'
    - '.github/workflows/ci-plan.yml'
    - '.github/scripts/ci-plan.py'
    - '.github/scripts/formal.py'

# A run that is not a pull request is the full set, and its name says so: Full CI: push on integration
run-name: "${{ github.event_name == 'pull_request' && github.event.pull_request.title || format('Full CI: {0} on {1}', github.event_name, github.ref_name) }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ProVerif 2.05 (February 2024), the release that opam-repository has as proverif.2.05, from the archive that it
  # names, with its SHA-256. A new release changes the version, the archive and the digest together, and
  # tests/formal/expected.tsv if its answers change.
  PROVERIF_VERSION: '2.05'
  PROVERIF_URL: 'https://proverif.inria.fr/proverif2.05.tar.gz'
  PROVERIF_SHA256: '4871f53c32ab4a04669a060c4886ba5d9080496963fb980a9a62d2c429ceabc4'

jobs:
  # The fast set or the full set (ci-plan.yml); the prover reads what it decided
  plan:
    uses: ./.github/workflows/ci-plan.yml
    permissions:
      contents: read
      pull-requests: read

  prover:
    name: ProVerif on the handshake models
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: The script and the table from the model to the code
      run: |
        python -I .github/scripts/formal.py selftest
        python -I .github/scripts/formal.py check
    # The binary of ProVerif is kept between runs, under a key that names its version and its digest
    - name: Restore ProVerif
      id: proverif
      uses: actions/cache@v4
      with:
        path: ~/proverif
        key: proverif-${{ env.PROVERIF_VERSION }}-${{ env.PROVERIF_SHA256 }}-ubuntu-24.04
    # ./build needs ocamlyacc, ocamllex and ocamlopt, which ocaml-nox brings; -nointeract leaves out the
    # interactive simulator, which needs GTK. The step that makes analyze may fail on a runner without the
    # OCaml headers, after the proverif binary is made, so the step asks for the binary, not the exit status.
    - name: Build ProVerif
      if: steps.proverif.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ocaml-nox
        ocamlfind ocamlopt -version || ocamlopt -version
        curl -fsSL -o "$RUNNER_TEMP/proverif.tar.gz" "$PROVERIF_URL"
        echo "${PROVERIF_SHA256}  $RUNNER_TEMP/proverif.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/proverif.tar.gz" -C "$RUNNER_TEMP"
        cd "$RUNNER_TEMP/proverif${PROVERIF_VERSION}"
        ./build -nointeract || test -x ./proverif
        test -x ./proverif
        mkdir -p "$HOME/proverif"
        cp ./proverif "$HOME/proverif/proverif"
    - name: ProVerif on every variant
      run: |
        python -I .github/scripts/formal.py run --proverif "$HOME/proverif/proverif" --version "$PROVERIF_VERSION" --out build/formal --jobs 4 --timeout 2400
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: formal
        if-no-files-found: warn
        path: build/formal/
