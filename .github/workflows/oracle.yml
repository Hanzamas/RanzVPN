# Oracle build: the original SoftEther VPN source at the fork point, built unchanged for Windows.
# Ranz VPN uses these binaries as a test oracle (ADR-0017, spec #27): the same input is fed to the old
# and the new code and the outputs are compared. The source on this branch is never modified; only this
# workflow differs from upstream. Each build is published as a pinned pre-release "oracle-<sha8>".
on:
  push:
    branches: [main-oracle]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [
          { ARCHITECTURE: x64, VCPKG_TRIPLET: "x64-windows-static", RUNNER: "windows-latest", CMAKE_EXTRA_FLAGS: ""},
          { ARCHITECTURE: arm64, VCPKG_TRIPLET: "arm64-windows-static", RUNNER: "windows-11-arm", CMAKE_EXTRA_FLAGS: "-DOQS_PERMIT_UNSUPPORTED_ARCHITECTURE=ON"}
        ]
    runs-on: ${{ matrix.platform.RUNNER }}
    name: ${{ matrix.platform.ARCHITECTURE }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: 'build/vcpkg_installed/'
        key: oracle-vcpkg-${{ matrix.platform.VCPKG_TRIPLET }}
    - name: Build
      env:
        ARCHITECTURE: ${{ matrix.platform.ARCHITECTURE }}
        VCPKG_TRIPLET: ${{ matrix.platform.VCPKG_TRIPLET }}
        CMAKE_EXTRA_FLAGS: ${{ matrix.platform.CMAKE_EXTRA_FLAGS }}
      run: |
        set BUILD_NUMBER=0
        mkdir build
        cd build

        for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
        if "%VSINSTALL%"=="" (
          echo Visual Studio installation was not found.
          exit /b 1
        )

        if /i "%ARCHITECTURE%"=="x64" (
          set "VCVARS_PATH=%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set "COMPILER_PATH=%VSINSTALL%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
        ) else if /i "%ARCHITECTURE%"=="arm64" (
          set "VCVARS_PATH=%VSINSTALL%\VC\Auxiliary\Build\vcvarsarm64.bat"
          set "COMPILER_PATH=%VSINSTALL%\VC\Tools\Llvm\ARM64\bin\clang-cl.exe"
        ) else (
          echo Unsupported architecture: %ARCHITECTURE%
          exit /b 1
        )

        call "%VCVARS_PATH%"
        cmake -G "Ninja" -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=%VCPKG_TRIPLET% -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER="%COMPILER_PATH%" -DCMAKE_CXX_COMPILER="%COMPILER_PATH%" -DBUILD_NUMBER=%BUILD_NUMBER% %CMAKE_EXTRA_FLAGS% ..
        cmake --build .
      shell: cmd
    - name: Test
      shell: powershell
      run: |
        . .ci/appveyor-vpntest.ps1
    - uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        name: oracle-${{ matrix.platform.ARCHITECTURE }}
        path: |
          build/*.exe
          build/*.pdb
          build/*.se2

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: oracle
    - name: Publish pinned pre-release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        SHA8="${GITHUB_SHA::8}"
        TAG="oracle-${SHA8}"
        cd oracle
        for d in */; do (cd "$d" && zip -q -r "../${d%/}.zip" .); done
        NOTES="Original SoftEther VPN source at the fork point (main-oracle ${GITHUB_SHA}), built unchanged for Windows x64 and arm64. Test oracle for Ranz VPN (ADR-0017, spec #27). Do not deploy."
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" *.zip --clobber
        else
          gh release create "$TAG" *.zip --prerelease --target "$GITHUB_SHA" --title "Oracle ${SHA8} (SoftEther upstream, unmodified)" --notes "$NOTES"
        fi
