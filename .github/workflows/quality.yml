# The quality gates of ADR-0040 that read the whole tree, and the fixtures of every gate's script.
#
# fuzz targets: the fixtures of the gate scripts (.github/scripts/quality-gates-test.py) run first, so
# a broken gate fails here instead of passing everything. Then every parser and wire-format handler
# of the new core, in C (src/Core, the Node and the configuration store of Cedar) and in Go
# (controller/, ranz-bgp/), must have a fuzz target that runs in CI, or an exemption with its reason
# (.github/quality/fuzz-targets.txt, .github/scripts/fuzz-registry.py). A change that adds a parser
# without a fuzz target fails here (ADR-0040 item 1). The fixtures of the fuzz campaign (fuzz.yml: every
# target for a long time against a stored corpus, and every night; AUD-3, #363) run in the same job.
#
# formal model: the table from the models of the handshake to the code (AUD-5, #389) is checked here: every
# function that it names is defined in its file, every field is in the body of one of the functions of its
# row, every name of the models has a row, and the paths of formal.yml cover every file of the table
# (.github/scripts/formal.py).
#
# The gates themselves run where their code is built: the fuzzers, the coverage floors, the static
# analysis, Application Verifier and the performance gate of the C build in windows.yml; go test
# -fuzz, -race, the coverage floors, staticcheck and govulncheck of the Go module, which holds
# controller/ and ranz-bgp/ and builds the one executable ranz, in ranz.yml.
#
# It needs only Python and reads every part of the tree, so it has no path filter: it runs on every
# pull request, on every push to master or integration and on workflow_dispatch. Its jobs are the
# same in every run, and part of the fast set of a pull request (ci-plan.yml).

name: quality

on:
  push:
    branches: [master, integration]
  workflow_dispatch:
  pull_request:

# Named as in windows.yml: a run that is not a pull request is Full CI: <event> on <branch>
run-name: "${{ github.event_name == 'pull_request' && github.event.pull_request.title || format('Full CI: {0} on {1}', github.event_name, github.ref_name) }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fuzz_targets:
    name: fuzz targets of the parsers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Gate script fixtures
      run: python -I .github/scripts/quality-gates-test.py
    - name: Every parser has a fuzz target that runs in CI
      run: python .github/scripts/fuzz-registry.py check
    # AUD-3 (#363): the fuzz campaign of fuzz.yml, which runs every target for a long time against a stored corpus and every
    # night. Its plan, its legs, its report and its tests of a finding run here against stand-ins for libFuzzer and go.
    - name: Fuzz campaign fixtures
      run: python -I .github/scripts/fuzz-campaign-test.py

  # ONE-1 (#310): the Go programs ship as one executable, ranz. CI, the WiX packages and the docs
  # name no executable ranz-controller or ranz-bgp (.github/scripts/one-binary-check.py); the
  # fixtures of that script run with the other gate scripts above.
  one_binary:
    name: no separate Go executable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: CI, WiX packages and docs name no executable that ranz replaces
      run: python .github/scripts/one-binary-check.py

  # The plan of windows.yml and ranz.yml (ci-plan.yml): the fixtures of .github/scripts/ci-plan.py. It
  # takes a few seconds, so a pull request runs it whatever it changes.
  ci_plan:
    name: CI plan fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Fast set, full set and the outputs that the workflows read
      run: python -I .github/scripts/ci-plan-test.py

  # AUD-5 (#389): the formal model of the handshake (docs/formal-model.md). The table from the model to the
  # code names the functions and the fields that stand for each message of the models, and a rename in the
  # code that breaks a row fails here, on the pull request that makes it. The prover itself runs in
  # formal.yml, in the full set; this needs only Python.
  formal_table:
    name: formal model table
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: The tests of the script
      run: python -I .github/scripts/formal.py selftest
    - name: Every function and field that the table names is in the code, every name of the models has a row
      run: python -I .github/scripts/formal.py check
