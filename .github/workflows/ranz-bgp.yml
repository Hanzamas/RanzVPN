# The BGP sidecar ranz-bgp (ranz-bgp/, Go), CORE-S7-1 #82: GoBGP as a library, driven by the node over a
# named pipe with JSON messages.
#
# linux: tidies go.mod and go.sum and runs gofmt; then vets (for Linux and for Windows), builds (for Linux,
# and for Windows on x64 and arm64) and tests the module: the session of the sidecar against GoBGP routers
# in the test, over an in-memory pipe. Then the job fails, and prints the diff, if tidy or gofmt changed a
# committed file. Last come the quality gates of ADR-0040 for the module: the tests run with -race
# (item 4) and -coverprofile, and each package must stay at or above its coverage floor (item 2,
# .github/quality/coverage-floors.txt); the fuzz tests of .github/quality/fuzz-targets.txt run with
# go test -fuzz for a short time each (item 1); and staticcheck and govulncheck, for Linux and for
# Windows, must find nothing (item 3).
#
# windows: vets, builds and tests the module on Windows x64 and arm64, with the named pipe of the node
# (go-winio) in the tests of cmd/ranz-bgp, among them the process mitigations and the System32-only DLL
# search of ranz-bgp read from outside its process (ADR-0039, SEC-1 #279), then checks the flags of the
# binary (.github/scripts/binary-hardening.ps1).
#
# msi: builds ranz-bgp for x64 and arm64 and the CI package of its optional MSI feature RanzBgp
# (ranz-bgp/installer) with WiX, on the runner of each architecture, and installs it there
# (.github/scripts/ranz-bgp-msi.ps1): a default install carries no sidecar, ADDLOCAL=RanzBgp adds it,
# REMOVE=RanzBgp takes it away again.
#
# The spike with the node (BGP on TCP 179, a prefix announced and withdrawn, a learned route installed
# through IP Helper) needs the C build and runs in windows.yml (.github/scripts/ranz-bgp-spike.ps1).

name: ranz-bgp

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'
  # The WiX Toolset of the MSI (ADR-0020; REL-5, #50)
  WIX_VERSION: '5.0.2'
  # The Go static analysis of ADR-0040 item 3: staticcheck 2026.2.2 and govulncheck, as in controller.yml
  STATICCHECK_VERSION: 'v0.8.2'
  GOVULNCHECK_VERSION: 'v1.9.0'

jobs:
  linux:
    name: ranz-bgp (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: ranz-bgp/go.sum
    - name: Tidy and format
      working-directory: ranz-bgp
      run: |
        go mod tidy
        gofmt -l -w .
    - name: Vet
      working-directory: ranz-bgp
      run: |
        go vet ./...
        GOOS=windows go vet ./...
    - name: Build
      working-directory: ranz-bgp
      run: |
        go build ./...
        GOOS=windows GOARCH=amd64 go build -o "$RUNNER_TEMP/windows-x64/" ./cmd/...
        GOOS=windows GOARCH=arm64 go build -o "$RUNNER_TEMP/windows-arm64/" ./cmd/...
        ls -l "$RUNNER_TEMP/windows-x64" "$RUNNER_TEMP/windows-arm64"
    # -race is the race detection of ADR-0040 item 4 for the Go code; the profile is read by the
    # coverage floor step
    - name: Test
      working-directory: ranz-bgp
      run: go test -race -count=1 -coverprofile="$RUNNER_TEMP/cover.out" ./...
    - name: Committed files match tidy and gofmt
      if: ${{ !cancelled() }}
      run: |
        git add -A -N ranz-bgp
        if ! git diff --exit-code -- ranz-bgp; then
          echo "::error::ranz-bgp/ differs from what go mod tidy and gofmt make of it: commit the diff above"
          exit 1
        fi
    # ADR-0040 item 2: the statement coverage of each package against its floor
    - name: Coverage floor
      if: ${{ !cancelled() }}
      run: python3 .github/scripts/coverage-floor.py go --module ranz-bgp --profile "$RUNNER_TEMP/cover.out"
    # ADR-0040 item 1: every fuzz test of the module in .github/quality/fuzz-targets.txt, 20 s each. A
    # crashing input is saved under testdata/fuzz of its package and uploaded below.
    - name: Fuzz (go test -fuzz)
      if: ${{ !cancelled() }}
      working-directory: ranz-bgp
      run: |
        targets="$(python3 ../.github/scripts/fuzz-registry.py go-targets ranz-bgp --root ..)"
        test -n "$targets"
        failed=0
        while read -r package target; do
          echo "::group::$target ($package)"
          if ! go test -run '^$' -fuzz "^${target}\$" -fuzztime 20s "$package"; then
            echo "::error::$target of $package found a failing input (testdata/fuzz/$target of the package, in the artifact ranz-bgp-fuzz-inputs)"
            failed=1
          fi
          echo "::endgroup::"
        done <<< "$targets"
        exit $failed
    # ADR-0040 item 3: staticcheck and govulncheck for Linux and for Windows. Any staticcheck finding
    # fails the job, and so does a vulnerability that the code calls, unless
    # .github/quality/govulncheck-accepted.txt accepts it for that version. Built for the runner;
    # GOOS picks the platform they analyze. The two staticcheck runs are merged (-merge), so code
    # that one platform alone uses is not reported as unused.
    - name: Static analysis (staticcheck, govulncheck)
      if: ${{ !cancelled() }}
      working-directory: ranz-bgp
      run: |
        GOBIN="$RUNNER_TEMP/gobin" go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
        GOBIN="$RUNNER_TEMP/gobin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
        "$RUNNER_TEMP/gobin/staticcheck" -version
        "$RUNNER_TEMP/gobin/staticcheck" -f binary ./... > "$RUNNER_TEMP/staticcheck-linux.bin"
        GOOS=windows "$RUNNER_TEMP/gobin/staticcheck" -f binary ./... > "$RUNNER_TEMP/staticcheck-windows.bin"
        "$RUNNER_TEMP/gobin/staticcheck" -merge "$RUNNER_TEMP/staticcheck-linux.bin" "$RUNNER_TEMP/staticcheck-windows.bin"
        "$RUNNER_TEMP/gobin/govulncheck" -version
        "$RUNNER_TEMP/gobin/govulncheck" -format json ./... > "$RUNNER_TEMP/govulncheck-linux.json"
        GOOS=windows "$RUNNER_TEMP/gobin/govulncheck" -format json ./... > "$RUNNER_TEMP/govulncheck-windows.json"
        python3 ../.github/scripts/govulncheck-gate.py --accepted ../.github/quality/govulncheck-accepted.txt "$RUNNER_TEMP/govulncheck-linux.json" "$RUNNER_TEMP/govulncheck-windows.json"
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: ranz-bgp-fuzz-inputs
        if-no-files-found: ignore
        path: ranz-bgp/**/testdata/fuzz/

  windows:
    strategy:
      fail-fast: false
      matrix:
        platform: [
          { ARCHITECTURE: x64, RUNNER: "windows-latest" },
          { ARCHITECTURE: arm64, RUNNER: "windows-11-arm" }
        ]
    name: ranz-bgp (Windows ${{ matrix.platform.ARCHITECTURE }})
    runs-on: ${{ matrix.platform.RUNNER }}
    timeout-minutes: 20
    env:
      # ranz-bgp is pure Go; the gcc of the arm64 runner builds x64 code only
      CGO_ENABLED: '0'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: ranz-bgp/go.sum
    - name: Vet, build and test
      shell: pwsh
      working-directory: ranz-bgp
      run: |
        go vet ./...
        if ($LASTEXITCODE -ne 0) { throw "go vet exited with code $LASTEXITCODE" }
        go build -o ..\build\ranz-bgp\ ./cmd/...
        if ($LASTEXITCODE -ne 0) { throw "go build exited with code $LASTEXITCODE" }
        go test -count=1 -v -run 'TestPipe|TestNoPipe|TestMitigations' ./cmd/ranz-bgp
        if ($LASTEXITCODE -ne 0) { throw "go test exited with code $LASTEXITCODE" }
        go test -count=1 ./...
        if ($LASTEXITCODE -ne 0) { throw "go test exited with code $LASTEXITCODE" }
    # The exploit-mitigation flags of ADR-0039 decision 1 (SEC-1, #279) on the sidecar, read with
    # dumpbin (.github/scripts/binary-hardening.ps1): ASLR and DEP from the Go toolchain, and the
    # exceptions of the script for CFG, CET, /GS and /sdl
    - name: Binary hardening
      shell: pwsh
      run: |
        ./.github/scripts/binary-hardening.ps1 -Path build\ranz-bgp\ranz-bgp.exe

  msi:
    strategy:
      fail-fast: false
      matrix:
        platform: [
          { ARCHITECTURE: x64, GOARCH: amd64, RUNNER: "windows-latest" },
          { ARCHITECTURE: arm64, GOARCH: arm64, RUNNER: "windows-11-arm" }
        ]
    name: ranz-bgp MSI feature (${{ matrix.platform.ARCHITECTURE }})
    runs-on: ${{ matrix.platform.RUNNER }}
    timeout-minutes: 20
    env:
      # ranz-bgp is pure Go; the gcc of the arm64 runner builds x64 code only
      CGO_ENABLED: '0'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: ranz-bgp/go.sum
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Build ranz-bgp
      shell: pwsh
      working-directory: ranz-bgp
      env:
        GOARCH: ${{ matrix.platform.GOARCH }}
      run: |
        # -trimpath and -ldflags "-s -w" strip the paths and the symbol table from the shipped sidecar
        # (SEC-3 #281, ADR-0036 amendment of 2026-10-22; checked by .github/scripts/self-integrity.ps1)
        go build -trimpath -ldflags '-s -w' -o ..\build\msi\ranz-bgp.exe ./cmd/ranz-bgp
        if ($LASTEXITCODE -ne 0) { throw "go build exited with code $LASTEXITCODE" }
        # The licence of the GoBGP that go.mod pins, from the module cache
        $dir = (go list -m -f '{{.Dir}}' github.com/osrg/gobgp/v4 | Out-String).Trim()
        if ($LASTEXITCODE -ne 0 -or -not $dir) { throw 'the GoBGP module is not in the module cache' }
        Copy-Item -LiteralPath (Join-Path $dir 'LICENSE') -Destination ..\build\msi\GoBGP-LICENSE.txt
    - name: Install WiX
      shell: pwsh
      run: |
        dotnet tool install --global wix --version $env:WIX_VERSION
        if ($LASTEXITCODE -ne 0) { throw "dotnet tool install exited with code $LASTEXITCODE" }
        $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
        $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & (Join-Path $tools 'wix.exe') --version
    - name: Build the MSI
      shell: pwsh
      run: |
        $arch = '${{ matrix.platform.ARCHITECTURE }}'
        wix build -arch $arch `
          -d "Version=0.1.0.$env:GITHUB_RUN_NUMBER" `
          -d "LicenseFile=$PWD\LICENSE" `
          -d "RanzBgpExe=$PWD\build\msi\ranz-bgp.exe" `
          -d "GoBgpLicense=$PWD\build\msi\GoBGP-LICENSE.txt" `
          -o "build\msi\ranz-vpn-ranzbgp-ci-$arch.msi" `
          ranz-bgp\installer\RanzBgpCi.wxs ranz-bgp\installer\RanzBgp.wxs
        if ($LASTEXITCODE -ne 0) { throw "wix build exited with code $LASTEXITCODE" }
        Get-ChildItem build\msi | Format-Table Name, Length
    - name: Install, add and remove the RanzBgp feature
      shell: pwsh
      timeout-minutes: 10
      run: |
        $arch = '${{ matrix.platform.ARCHITECTURE }}'
        . .github/scripts/ranz-bgp-msi.ps1 -Msi "build\msi\ranz-vpn-ranzbgp-ci-$arch.msi" -Arch $arch -LogDir build\msi\logs
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: ranz-bgp-msi-${{ matrix.platform.ARCHITECTURE }}
        if-no-files-found: warn
        retention-days: 14
        path: |
          build/msi/*.msi
          build/msi/logs/
